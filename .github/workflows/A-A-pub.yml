name: DixScript Validate

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: dixscript

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dixscript/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('dixscript/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true   # flip to false once the codebase is fully fmt-clean

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true   # flip to false once you've cleared the warning backlog

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Compile benches (no run)
        run: cargo bench --no-run --verbose

      - name: Inspect package contents
        run: cargo package --list

      - name: Dry-run publish
        run: cargo publish --dry-run
