name: Publish dixscript to crates.io

# Manual only (Actions tab -> Run workflow) — requires typing "publish" in
# the confirmation input, so this can't fire by an accidental click.
#
# ── Trusted Publishing (OIDC) — NOT usable for the very first publish ──────
# crates.io can only trust a GitHub repo/workflow for a crate that already
# exists in the registry — there is no way to pre-authorize a name that has
# never been published. So:
#   1. First-ever publish of `dixscript`: use the ORIGINAL token-based
#      workflow (CARGO_REGISTRY_TOKEN secret) — this file will fail with an
#      auth error if you run it before that.
#   2. Once that succeeds, go to https://crates.io/crates/dixscript/settings
#      -> Trusted Publishing -> add a GitHub Actions publisher with:
#        Repository owner: Mid-D-Man
#        Repository name:  DixScript-Rust
#        Workflow filename: a-publish-dixscript-crate.yml
#        Environment: (leave blank unless you add one below)
#   3. From then on, use THIS workflow for every publish. No
#      CARGO_REGISTRY_TOKEN secret needed or read at all — you can delete
#      that repo secret once this is confirmed working, or leave it as a
#      fallback (it's simply unused by this file either way).
#
# Also creates a GitHub Release, tagged "dixscript-v<version>" (not just
# "v<version>") -- this is a monorepo publishing several independently-
# versioned packages (mdix-cli, the NuGet/PyPI wrappers, ...), each of
# which will eventually want its own tagged release, so the crate name
# stays in the tag to avoid collisions down the line.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. crates.io does not allow un-publishing a version once it is live — only yanking, which hides it from new dependents but does not remove it.'
        required: true

permissions:
  contents: write   # needed to create the tag + GitHub Release below
  id-token: write   # needed to request the OIDC token that authenticates
                     # this workflow run to crates.io's Trusted Publishing —
                     # this replaces CARGO_REGISTRY_TOKEN entirely

jobs:
  publish:
    name: Publish dixscript
    runs-on: ubuntu-latest
    # Optional extra hardening: create a "release" Environment under repo
    # Settings -> Environments, require a reviewer on it, and uncomment the
    # line below. crates.io's Trusted Publisher config can also be scoped to
    # a specific environment name if you want to require this workflow only
    # ever publish from within it.
    # environment: release
    steps:
      - name: Confirm manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release, default features)
        run: cargo build -p dixscript --release

      - name: Run tests
        run: cargo test -p dixscript

      # Packages the crate exactly as it would be uploaded and does a full
      # build from that package in a clean temp directory — catches
      # anything the exclude list or a missing file would break, without
      # actually publishing yet.
      - name: Verify package (dry run)
        run: cargo publish -p dixscript --dry-run

      # ══ BOOTSTRAP ONLY ══════════════════════════════════════════════════
      # Trusted Publishing can't authorize a crate that doesn't exist on
      # crates.io yet — this step is skipped for the very first publish and
      # the plain-token step below is used instead. Once `dixscript` exists
      # and you've configured Trusted Publishing at
      # https://crates.io/crates/dixscript/settings, DELETE this `if: false`
      # step and the one after it, and UNCOMMENT the two steps below them —
      # i.e. revert this file back to its normal committed state.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: false
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: "BOOTSTRAP: Publish to crates.io (plain token, first publish only)"
        run: cargo publish -p dixscript
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # - name: Publish to crates.io
      #   run: cargo publish -p dixscript
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # ══ END BOOTSTRAP ═══════════════════════════════════════════════════

      # ── GitHub Release ──────────────────────────────────────────────────────
      # crates.io and GitHub Releases are entirely separate systems --
      # `cargo publish` above only pushes to the registry. This makes the
      # release visible/discoverable on the repo itself and gives it a
      # permanent, browsable changelog entry, tag, and download bundle.
      - name: Read crate version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' dixscript/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing dixscript v$VERSION"

      - name: Extract changelog section for this version
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Pulls everything between this version's "## [x.y.z]" heading and
          # the next "## " heading (or EOF) out of CHANGELOG.md, so the
          # GitHub Release body matches what's actually documented there
          # instead of duplicating it by hand.
          #
          # Uses index()-based substring matching, not a regex `~` match --
          # "[x.y.z]" contains regex-special characters ([, ], .) that would
          # need escaping to mean literal brackets/dot rather than "any one
          # of these characters"/"any character"; index() sidesteps that
          # entirely by doing a plain substring search.
          HEADING="## [$VERSION]"
          awk -v heading="$HEADING" '
            index($0, heading) == 1 { found=1; print; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' dixscript/CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for version $VERSION -- falling back to a generic note. Add a \"## [$VERSION]\" entry to dixscript/CHANGELOG.md before running this again for future releases."
            echo "dixscript v$VERSION — see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/dixscript/CHANGELOG.md) for details." > release-notes.md
          fi

          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dixscript-v${{ steps.version.outputs.version }}" \
            --title "dixscript v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
