name: Publish dixscript to crates.io

# Two ways to trigger:
#   1. Manual (Actions tab -> Run workflow) — requires typing "publish" in
#      the confirmation input, so this can't fire by an accidental click.
#   2. Pushing a tag matching v*.*.* (e.g. v1.0.0) — for normal releases
#      once you're past today's first manual one.
#
# Requires a CARGO_REGISTRY_TOKEN secret in this repo's settings
# (Settings -> Secrets and variables -> Actions -> New repository secret).
# Generate the token at https://crates.io/settings/tokens with publish
# scope for the dixscript crate.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. crates.io does not allow un-publishing a version once it is live — only yanking, which hides it from new dependents but does not remove it.'
        required: true
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish dixscript
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (release, default features)
        run: cargo build -p dixscript --release

      - name: Run tests
        run: cargo test -p dixscript

      # Packages the crate exactly as it would be uploaded and does a full
      # build from that package in a clean temp directory — catches
      # anything the exclude list or a missing file would break, without
      # actually publishing yet.
      - name: Verify package (dry run)
        run: cargo publish -p dixscript --dry-run

      - name: Publish to crates.io
        run: cargo publish -p dixscript
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
