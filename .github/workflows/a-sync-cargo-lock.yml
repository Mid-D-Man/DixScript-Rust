name: Sync Cargo.lock

# Manual only. Regenerates Cargo.lock against the current Cargo.toml files
# and commits it back if it changed.
#
# Needed whenever a workspace member's dependency changes SOURCE KIND —
# e.g. `dixscript = { path = "../dixscript", version = "1.0.0" }` becoming
# `dixscript = "1.0.0"` (a path+workspace source becoming a plain registry
# source), the way mdix-cli/Cargo.toml and mdix-lsp/Cargo.toml do now. The
# resolved version doesn't change, but the source does, and Cargo.lock
# tracks source per entry — editing Cargo.toml alone does not update it.
# There's no local `cargo update` available (GitHub web UI only), so this
# workflow is the only way to keep `--locked` builds (e.g.
# mdix-cli/Dockerfile) working without an out-of-repo manual step.
#
# Conservative by default: only re-resolves the package(s) named in
# `packages`, leaving every other pinned version untouched. Leave
# `packages` blank to run a full `cargo generate-lockfile` instead
# (re-resolves everything to the latest versions each Cargo.toml's
# requirements allow — review the diff carefully before trusting it).
#
# `packages` must be a fully-qualified pkgid spec, not a bare crate name.
# `dixscript` now genuinely exists at TWO sources in this workspace: the
# local path member (used by dixscript itself, mdix-ffi, mdix-java,
# mdix-lua) and a plain registry dependency (mdix-cli, mdix-lsp,
# mdix-wasm) — `cargo update -p dixscript` errors with "specification
# `dixscript` is ambiguous" because the name alone no longer says which
# source you mean. The default below is the registry-sourced one (the
# one actually missing from Cargo.lock), pinned to dixscript's current
# published version — bump the `@1.0.0` suffix here if/when dixscript's
# version changes, or just leave `packages` blank for a full regenerate
# instead of updating this file.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Fully-qualified pkgid spec(s), space-separated (e.g. "registry+https://github.com/rust-lang/crates.io-index#dixscript@1.0.0") — NOT a bare crate name, see workflow header. Leave blank to regenerate the whole lockfile.'
        required: false
        default: 'registry+https://github.com/rust-lang/crates.io-index#dixscript@1.0.0'

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        run: |
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            for pkg in ${{ github.event.inputs.packages }}; do
              echo "cargo update -p $pkg"
              cargo update -p "$pkg"
            done
          else
            echo "cargo generate-lockfile (full re-resolve)"
            cargo generate-lockfile
          fi

      - name: Show what changed
        run: git diff -- Cargo.lock || true

      - name: Commit Cargo.lock if it changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already up to date -- nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: sync Cargo.lock"
          git push
