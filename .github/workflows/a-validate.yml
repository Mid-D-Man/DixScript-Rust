name: Validate dixscript

# Build, test, wasm-target check, and a fuzz run all gate normally (a red X
# here means something's actually broken). Clippy runs separately and is
# deliberately informational-only — see that job for why.
#
# Fuzz duration: push/PR always run the 60s smoke test (crash-detection
# only, not real coverage). For an actual pre-publish fuzzing campaign, run
# this manually from the Actions tab ("Run workflow") and set fuzz_seconds
# to something real (e.g. 3600 for an hour) — see the fuzz-smoke-test job.
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'dixscript/**'
      - '.github/workflows/a-validate.yml'
  pull_request:
    paths:
      - 'dixscript/**'
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: >-
          Fuzz duration in seconds. Only applies to manual runs (push/PR
          always use 60s regardless of this value). 3600 = 1 hour,
          21600 = 6 hours. Remember to also raise the job's timeout-minutes
          below if you go past ~5 hours.
        required: false
        default: '60'
        type: string

jobs:
  build-and-test:
    name: Build & test (native, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build -p dixscript --all-targets
        working-directory: .

      - name: Run tests
        run: cargo test -p dixscript

  build-minimal:
    name: Build (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Confirms the crate still builds with every optional feature off —
      # catches an accidental hard dependency on cloud-import / a
      # compressor / rayon-support leaking outside its feature gate.
      - name: Build with no default features
        run: cargo build -p dixscript --no-default-features

  wasm-build:
    name: Build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Default features on purpose — this is what mdix-wasm actually builds
      # with. Confirms cloud-import/bzip2-support/xz-support/rayon-support
      # all resolve correctly (or gracefully no-op, for cloud-import) on the
      # target that's historically been the fragile one all along.
      - name: Build dixscript for wasm32
        run: cargo build -p dixscript --target wasm32-unknown-unknown

  fuzz-smoke-test:
    name: Fuzz parse_mdix
    runs-on: ubuntu-latest
    # 60s (push/PR) needs a couple minutes total with build overhead; a
    # manual multi-hour campaign needs real headroom. This is a ceiling, not
    # a target — the job finishes as soon as -max_total_time elapses either way.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Corpus persists across runs instead of starting from empty every
      # time, so a long manual campaign actually accumulates coverage
      # instead of re-discovering the same inputs each run. restore-keys
      # falls back to the most recent prior corpus on a cache miss for the
      # exact key (which is always a miss, by design — see the key below —
      # so a save always happens at the end of every run).
      - name: Cache fuzz corpus
        uses: actions/cache@v4
        with:
          path: dixscript/fuzz/corpus/parse_mdix
          key: fuzz-corpus-parse_mdix-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-parse_mdix-

      # Push/PR: fixed 60s smoke test, just long enough to catch an obvious
      # regression (a panic on some malformed input) before it ships.
      # Manual dispatch: whatever fuzz_seconds was set to, for an actual
      # fuzzing campaign (real coverage, not a smoke test) ahead of a
      # release. Either way this is still nowhere near exhaustive — cargo-fuzz
      # is a "keep chipping away" tool, not a one-shot proof of correctness.
      - name: Fuzz parse_mdix
        run: >-
          cargo fuzz run parse_mdix --
          -max_total_time=${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds || 60 }}
        working-directory: dixscript

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_number }}
          path: dixscript/fuzz/artifacts/
          retention-days: 30

  clippy:
    name: Clippy (informational — does not block)
    runs-on: ubuntu-latest
    # This job can go red without blocking anything that depends on this
    # workflow (e.g. a future branch-protection rule, or a publish gate).
    # There's a real, not-yet-cleared backlog of warnings in the codebase —
    # this job exists to make that backlog visible in CI output over time,
    # not to force it to zero before anything can ship. Flip
    # continue-on-error to false once the backlog's actually been worked
    # through and you want it to start gating for real.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy -p dixscript --all-targets -- -W clippy::all
