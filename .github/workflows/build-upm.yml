name: MidManStudio.Mdix — Unity Package Build

on:
  workflow_dispatch:
    inputs:
      publish_upm:
        description: 'Also publish to the upm branch (git URL install point). Leave off for a normal build — this only pushes local libs into the repo via commit-to-repo.'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - 'mdix-ffi/**'
      - 'mdix-csharp/**'

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Check trigger ───────────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_unity: ${{ steps.decide.outputs.run_unity }}
    steps:
      - name: Decide whether to run Unity package build
        id: decide
        run: |
          RUN=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Already scoped by on.push.paths above (mdix-ffi/** or
            # mdix-csharp/** changed) — no commit-message flag needed on
            # top of that, unlike the pull_request case below.
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
            echo "$MSG" | grep -qiE '\-\-mdix-unity' && RUN=true || true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-unity' && RUN=true || true
          fi

          echo "run_unity=$RUN" >> $GITHUB_OUTPUT
          echo "Run Unity build: $RUN"

  # ── 2. Build FFI — Linux x64 + Windows x64 + Android (3 ABIs) ────────────
  build-ffi-ubuntu:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_unity == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: >-
            x86_64-unknown-linux-gnu
            x86_64-pc-windows-gnu
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-ffi-

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "^3" --locked --force

      # ubuntu-latest ships an Android SDK + NDK preinstalled — no need for a
      # third-party setup action, same as MidManStudio_Unity's own
      # build-audio-libs.yml / build-projectile-rust-libs.yml.
      - name: Locate Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-}}"
          [ -z "$NDK" ] && NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -1)
          [ -z "$NDK" ] && { echo "❌ Android NDK not found on runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "Using NDK: $NDK"

      - name: Build FFI — Linux x64
        run: cargo build -p mdix-ffi --release --target x86_64-unknown-linux-gnu

      - name: Build FFI — Windows x64
        run: cargo build -p mdix-ffi --release --target x86_64-pc-windows-gnu

      # BUGFIX: this used to build only arm64-v8a, via a hand-rolled
      # linker + CC_/CXX_/AR_ env var setup that would have needed
      # tripling (with three different versioned clang paths) to cover
      # the other two ABIs. mdix-ffi/Cargo.toml's own doc comment already
      # specified cargo-ndk across arm64-v8a + armeabi-v7a + x86_64 as the
      # intended Android build — CI just never matched it. cargo-ndk wires
      # up the correct per-ABI linker/CC/CXX/AR itself, so this is the
      # same three `cargo ndk -t <abi> ...` invocations
      # MidManStudio_Unity's mid_audio and projectile_core libs already use
      # successfully in this same organization's other CI.
      - name: Build FFI — Android (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: mdix-ffi
        run: |
          set -e
          cargo ndk -t arm64-v8a   -o ./android-out build --release
          cargo ndk -t armeabi-v7a -o ./android-out build --release
          cargo ndk -t x86_64      -o ./android-out build --release

      - name: Verify Android ABI outputs (present, non-truncated, identical symbol set)
        working-directory: mdix-ffi
        run: |
          set -e
          MIN_BYTES=500
          FAIL=0
          declare -A SYMSETS

          for ABI in arm64-v8a armeabi-v7a x86_64; do
            F="android-out/$ABI/libmdix_ffi.so"
            if [ ! -f "$F" ]; then
              echo "❌ MISSING: $ABI — libmdix_ffi.so was not produced"
              FAIL=1; continue
            fi
            SIZE=$(stat -c%s "$F")
            echo "  $ABI: ${SIZE} bytes"
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              echo "❌ TRUNCATED/EMPTY: $ABI ($SIZE bytes)"
              FAIL=1; continue
            fi
            SYMSETS[$ABI]=$(nm -D --defined-only "$F" 2>/dev/null | awk '{print $3}' | sort)
          done

          # All three ABIs should export the same C ABI surface — a
          # divergent symbol set is what actually distinguishes "small but
          # correct" from "silently built a stub for this ABI".
          if [ -n "${SYMSETS[arm64-v8a]:-}" ] && [ -n "${SYMSETS[armeabi-v7a]:-}" ]; then
            [ "${SYMSETS[arm64-v8a]}" = "${SYMSETS[armeabi-v7a]}" ] || { echo "❌ arm64-v8a/armeabi-v7a export different symbol sets"; FAIL=1; }
          fi
          if [ -n "${SYMSETS[arm64-v8a]:-}" ] && [ -n "${SYMSETS[x86_64]:-}" ]; then
            [ "${SYMSETS[arm64-v8a]}" = "${SYMSETS[x86_64]}" ] || { echo "❌ arm64-v8a/x86_64 export different symbol sets"; FAIL=1; }
          fi

          [ "$FAIL" = "1" ] && { echo "❌ Android artifact verification failed."; exit 1; }
          echo "✅ All 3 ABIs present, export the identical symbol set."

      - name: Collect ubuntu artifacts
        run: |
          mkdir -p ffi-ubuntu/linux-x64
          mkdir -p ffi-ubuntu/windows-x64
          mkdir -p ffi-ubuntu/android-arm64-v8a
          mkdir -p ffi-ubuntu/android-armeabi-v7a
          mkdir -p ffi-ubuntu/android-x86_64

          cp target/x86_64-unknown-linux-gnu/release/libmdix_ffi.so \
             ffi-ubuntu/linux-x64/libmdix_ffi.so

          cp target/x86_64-pc-windows-gnu/release/mdix_ffi.dll \
             ffi-ubuntu/windows-x64/mdix_ffi.dll

          cp mdix-ffi/android-out/arm64-v8a/libmdix_ffi.so \
             ffi-ubuntu/android-arm64-v8a/libmdix_ffi.so

          cp mdix-ffi/android-out/armeabi-v7a/libmdix_ffi.so \
             ffi-ubuntu/android-armeabi-v7a/libmdix_ffi.so

          cp mdix-ffi/android-out/x86_64/libmdix_ffi.so \
             ffi-ubuntu/android-x86_64/libmdix_ffi.so

          echo "Built files:"
          find ffi-ubuntu -type f -exec ls -lh {} \;

      - name: Upload ubuntu FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-ubuntu-${{ github.run_number }}
          path: ffi-ubuntu/
          retention-days: 1

  # ── 3. Build FFI — macOS universal + iOS static ───────────────────────────
  build-ffi-macos:
    runs-on: macos-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_unity == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: >-
            x86_64-apple-darwin
            aarch64-apple-darwin
            aarch64-apple-ios

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-ffi-

      - name: Build FFI — macOS x64
        run: cargo build -p mdix-ffi --release --target x86_64-apple-darwin

      - name: Build FFI — macOS arm64 (Apple Silicon)
        run: cargo build -p mdix-ffi --release --target aarch64-apple-darwin

      - name: Lipo — macOS universal dylib
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/libmdix_ffi.dylib \
            target/aarch64-apple-darwin/release/libmdix_ffi.dylib \
            -output libmdix_ffi_universal.dylib

          echo "Universal dylib:"
          lipo -info libmdix_ffi_universal.dylib

      # iOS forbids dynamic loading of custom libraries — only staticlib is
      # needed.  Building cdylib for aarch64-apple-ios fails because bzip2-sys
      # and lzma-sys emit calls to ___chkstk_darwin (a compiler-rt stack-guard
      # symbol) which the Rust linker cannot resolve when targeting iOS 10.0.
      # Stripping cdylib from crate-type for this one build step avoids the
      # dylib link step entirely; the .a is archived without full linking so
      # the symbol reference is resolved later by Xcode when Unity links the
      # final app against the iOS SDK's libclang_rt.
      - name: Patch Cargo.toml — staticlib only for iOS
        run: |
          sed -i '' \
            's/crate-type = \["cdylib", "staticlib"\]/crate-type = ["staticlib"]/' \
            mdix-ffi/Cargo.toml
          echo "Patched crate-type:"
          grep crate-type mdix-ffi/Cargo.toml

      # IPHONEOS_DEPLOYMENT_TARGET tells cc-rs to compile bzip2/lzma for iOS 16
      # instead of the host SDK default (18.5), keeping the C objects compatible
      # with what Unity's IL2CPP expects.
      - name: Build FFI — iOS arm64 (static)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: cargo build -p mdix-ffi --release --target aarch64-apple-ios

      - name: Collect macOS artifacts
        run: |
          mkdir -p ffi-macos/macos-universal
          mkdir -p ffi-macos/ios-arm64

          cp libmdix_ffi_universal.dylib \
             ffi-macos/macos-universal/libmdix_ffi.dylib

          cp target/aarch64-apple-ios/release/libmdix_ffi.a \
             ffi-macos/ios-arm64/libmdix_ffi.a

          echo "Built files:"
          find ffi-macos -type f -exec ls -lh {} \;

      - name: Upload macOS FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffi-macos-${{ github.run_number }}
          path: ffi-macos/
          retention-days: 1

  # ── 4. Build Core.dll + generate MdixNative.cs ───────────────────────────
  build-core-dll:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_unity == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-core-dll-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-core-dll-

      # Build FFI first — this generates MdixNative.cs via build.rs
      - name: Build mdix-ffi (generates MdixNative.cs)
        run: cargo build -p mdix-ffi --release

      - name: Verify MdixNative.cs was generated
        run: |
          FILE="mdix-csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: MdixNative.cs not generated by build.rs"
            exit 1
          fi
          echo "MdixNative.cs generated OK"
          head -8 "$FILE"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore NuGet packages
        run: dotnet restore mdix-csharp/MidManStudio.Mdix.sln

      - name: Build Core.dll (Release)
        run: |
          dotnet build \
            mdix-csharp/src/MidManStudio.Mdix.Core/MidManStudio.Mdix.Core.csproj \
            --configuration Release \
            --no-restore \
            -o dll-output/

          echo "Built DLL:"
          ls -lh dll-output/*.dll

      - name: Upload Core.dll artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-dll-${{ github.run_number }}
          path: dll-output/MidManStudio.Mdix.Core.dll
          retention-days: 1

  # ── 5. Assemble Unity package ─────────────────────────────────────────────
  assemble-package:
    runs-on: ubuntu-latest
    needs: [build-ffi-ubuntu, build-ffi-macos, build-core-dll]

    steps:
      - uses: actions/checkout@v4

      - name: Download ubuntu FFI
        uses: actions/download-artifact@v4
        with:
          name: ffi-ubuntu-${{ github.run_number }}
          path: ffi-ubuntu/

      - name: Download macOS FFI
        uses: actions/download-artifact@v4
        with:
          name: ffi-macos-${{ github.run_number }}
          path: ffi-macos/

      - name: Download Core.dll
        uses: actions/download-artifact@v4
        with:
          name: core-dll-${{ github.run_number }}
          path: core-dll/

      - name: Assemble package + generate/validate .meta
        run: |
          set -e
          PKG="com.midmanstudio.mdix"
          CORRUPT=0

          copy_if() {
            [ -f "$1" ] && { mkdir -p "$(dirname "$2")"; cp "$1" "$2"; echo "copied $2"; } || echo "missing $1"
          }

          gen_guid() { python3 -c "import uuid; print(uuid.uuid4().hex)"; }

          # Known Unity duplicate-platformData-block corruption pattern — same
          # check MidManStudio_Unity's own build-projectile-rust-libs.yml uses.
          # Never auto-fix this; a hand-authored file that's already corrupt
          # needs a human, not CI silently overwriting it.
          fail_on_corruption() {
            local f="$1"
            [ -f "$f" ] || return 0
            if grep -q "^      : Any" "$f"; then
              echo "❌ CORRUPTED META (duplicate legacy platformData block): $f"
              echo "   Known Unity duplicate-key import crash. Fix by hand — CI will not overwrite it."
              CORRUPT=1
            fi
          }

          # Guard shared by every write_*_meta below: if a .meta already
          # exists, leave it untouched — the GUID must stay stable across
          # rebuilds or every existing scene/prefab reference to this asset
          # breaks. Only ever generates a fresh one the first time a binary
          # shows up with no .meta sitting next to it yet.
          already_has_meta() { [ -f "$1" ]; }

          # Managed C# assembly (Core.dll) — same DLL ships on every platform.
          write_managed_meta() {
            local dll="$1" meta="${1}.meta"
            fail_on_corruption "$meta"
            already_has_meta "$meta" && return 0
            [ -f "$dll" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 1
            validateReferences: 1
            platformData:
            - first:
                Any:
              second:
                enabled: 1
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 1
                settings:
                  DefaultValueInitialized: true
            - first:
                Standalone: Win64
              second:
                enabled: 1
                settings: {}
            - first:
                Standalone: Linux64
              second:
                enabled: 1
                settings: {}
            - first:
                Standalone: OSXUniversal
              second:
                enabled: 1
                settings: {}
            - first:
                Android: Android
              second:
                enabled: 1
                settings: {}
            - first:
                iPhone: iOS
              second:
                enabled: 1
                settings: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
            echo "generated $meta"
          }

          # Desktop native lib (Windows/Linux/macOS). editor_on: 1 = also load
          # in the Editor — needs to be 1 for anything you're actually going
          # to open PackageSandbox and test against locally.
          write_desktop_meta() {
            local so="$1" os="$2" cpu="$3" editor_on="$4" meta="${1}.meta"
            fail_on_corruption "$meta"
            already_has_meta "$meta" && return 0
            [ -f "$so" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: $editor_on
                settings:
                  DefaultValueInitialized: true
            - first:
                Standalone: $os
              second:
                enabled: 1
                settings:
                  CPU: $cpu
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
            echo "generated $meta"
          }

          write_android_meta() {
            local so="$1" cpu="$2" meta="${1}.meta"
            fail_on_corruption "$meta"
            already_has_meta "$meta" && return 0
            [ -f "$so" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                Android: Android
              second:
                enabled: 1
                settings:
                  CPU: $cpu
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 0
                settings:
                  DefaultValueInitialized: true
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
            echo "generated $meta"
          }

          write_ios_meta() {
            local a="$1" meta="${1}.meta"
            fail_on_corruption "$meta"
            already_has_meta "$meta" && return 0
            [ -f "$a" ] || return 0
            local guid; guid=$(gen_guid)
            cat > "$meta" <<EOF
          fileFormatVersion: 2
          guid: $guid
          PluginImporter:
            externalObjects: {}
            serializedVersion: 2
            iconMap: {}
            executionOrder: {}
            defineConstraints: []
            isPreloaded: 0
            isOverridable: 0
            isExplicitlyReferenced: 0
            validateReferences: 1
            platformData:
            - first:
                iPhone: iOS
              second:
                enabled: 1
                settings:
                  CompileFlags:
                  FrameworkDependencies:
            - first:
                Any:
              second:
                enabled: 0
                settings: {}
            - first:
                Editor: Editor
              second:
                enabled: 0
                settings:
                  DefaultValueInitialized: true
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF
            echo "generated $meta"
          }

          # Existing .meta corruption check runs even for files we don't
          # regenerate below.
          find "$PKG/Runtime/Plugins" -name "*.meta" 2>/dev/null | while read -r f; do fail_on_corruption "$f"; done

          # ── Core DLL ───────────────────────────────────────────────────────
          copy_if core-dll/MidManStudio.Mdix.Core.dll "$PKG/Runtime/Plugins/MidManStudio.Mdix.Core.dll"
          write_managed_meta "$PKG/Runtime/Plugins/MidManStudio.Mdix.Core.dll"

          # ── Native — Linux x64 ─────────────────────────────────────────────
          copy_if ffi-ubuntu/linux-x64/libmdix_ffi.so "$PKG/Runtime/Plugins/Linux/x86_64/libmdix_ffi.so"
          write_desktop_meta "$PKG/Runtime/Plugins/Linux/x86_64/libmdix_ffi.so" Linux64 x86_64 1

          # ── Native — Windows x64 ───────────────────────────────────────────
          copy_if ffi-ubuntu/windows-x64/mdix_ffi.dll "$PKG/Runtime/Plugins/Windows/x86_64/mdix_ffi.dll"
          write_desktop_meta "$PKG/Runtime/Plugins/Windows/x86_64/mdix_ffi.dll" Win64 x86_64 1

          # ── Native — Android (arm64-v8a, armeabi-v7a, x86_64) ──────────────
          declare -A CPUMAP=( [arm64-v8a]=ARM64 [armeabi-v7a]=ARMv7 [x86_64]=X86_64 )
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            DST="$PKG/Runtime/Plugins/Android/$ABI/libmdix_ffi.so"
            copy_if "ffi-ubuntu/android-$ABI/libmdix_ffi.so" "$DST"
            write_android_meta "$DST" "${CPUMAP[$ABI]}"
          done

          # ── Native — macOS universal ───────────────────────────────────────
          copy_if ffi-macos/macos-universal/libmdix_ffi.dylib "$PKG/Runtime/Plugins/macOS/libmdix_ffi.dylib"
          write_desktop_meta "$PKG/Runtime/Plugins/macOS/libmdix_ffi.dylib" OSXUniversal AnyCPU 1

          # ── Native — iOS static ────────────────────────────────────────────
          copy_if ffi-macos/ios-arm64/libmdix_ffi.a "$PKG/Runtime/Plugins/iOS/libmdix_ffi.a"
          write_ios_meta "$PKG/Runtime/Plugins/iOS/libmdix_ffi.a"

          [ "$CORRUPT" = "1" ] && { echo "❌ One or more existing .meta files are corrupted — see above. Fix by hand before this can pass."; exit 1; }

          echo "Package contents:"
          find "$PKG" -type f | sort

      - name: Verify all required files present
        run: |
          PKG="com.midmanstudio.mdix"
          MISSING=0

          REQUIRED=(
            "Runtime/Plugins/MidManStudio.Mdix.Core.dll"
            "Runtime/Plugins/Linux/x86_64/libmdix_ffi.so"
            "Runtime/Plugins/Windows/x86_64/mdix_ffi.dll"
            "Runtime/Plugins/Android/arm64-v8a/libmdix_ffi.so"
            "Runtime/Plugins/Android/armeabi-v7a/libmdix_ffi.so"
            "Runtime/Plugins/Android/x86_64/libmdix_ffi.so"
            "Runtime/Plugins/macOS/libmdix_ffi.dylib"
            "Runtime/Plugins/iOS/libmdix_ffi.a"
            "Runtime/MdixAsset.cs"
            "Runtime/MdixBakeableAttribute.cs"
            "Runtime/MdixInitializer.cs"
            "Runtime/MdixKeyStorage.cs"
            "Runtime/MdixPaths.cs"
            "Runtime/MdixUnityExtensions.cs"
            "Runtime/link.xml"
            "Runtime/MidManStudio.Mdix.Runtime.asmdef"
            "Editor/MdixImporter.cs"
            "Editor/MdixBakeWizard.cs"
            "Editor/MdixEditorWindow.cs"
            "Editor/CreateMdixMenuItems.cs"
            "Editor/UI/MdixEditorWindow.uxml"
            "Editor/UI/MdixEditorWindow.uss"
            "Editor/MidManStudio.Mdix.Editor.asmdef"
            "package.json"
          )

          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$PKG/$f" ]; then
              echo "MISSING: $PKG/$f"
              MISSING=$((MISSING + 1))
            else
              echo "OK: $f"
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING required file(s) missing from package."
            exit 1
          fi

          echo ""
          echo "All required files present."

      - name: Write build metadata into package.json
        run: |
          PKG="com.midmanstudio.mdix"
          BUILD="${{ github.run_number }}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - << PYEOF
          import json

          with open("$PKG/package.json", "r") as f:
              pkg = json.load(f)

          pkg["_build"] = {
              "number": "$BUILD",
              "commit": "$COMMIT",
              "date":   "$DATE",
              "branch": "${{ github.ref_name }}"
          }

          with open("$PKG/package.json", "w") as f:
              json.dump(pkg, f, indent=2)
              f.write("\n")

          print("package.json updated with build metadata.")
          PYEOF

      - name: Create downloadable zip
        run: |
          PKG="com.midmanstudio.mdix"
          BUILD="${{ github.run_number }}"
          ZIP_NAME="mdix-unity-package-build-${BUILD}.zip"

          zip -r "$ZIP_NAME" "$PKG/"
          ls -lh "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload package zip (downloadable artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mdix-unity-package-${{ github.run_number }}
          path: mdix-unity-package-build-${{ github.run_number }}.zip
          retention-days: 30

      - name: Upload unpacked package (for upm branch)
        uses: actions/upload-artifact@v4
        with:
          name: mdix-unity-unpacked-${{ github.run_number }}
          path: com.midmanstudio.mdix/
          retention-days: 1

  # ── 6. Commit rebuilt package back onto the ref that triggered this run ───
  #
  # This is what makes local file: package references "just work" after a
  # plain `git pull` — same convention MidManStudio_Unity's own
  # build-projectile-rust-libs.yml / build-audio-libs.yml already use for
  # projectile_core / mid_audio. Without this job, the only place built
  # binaries ever land is the upm branch (publish-upm below), which a
  # normal local clone tracking master never sees.
  #
  # Runs on whatever ref triggered the build — push to master, or
  # workflow_dispatch from a manually-selected branch. Does not assume
  # master specifically.
  commit-to-repo:
    runs-on: ubuntu-latest
    needs: assemble-package
    if: |
      needs.assemble-package.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download unpacked package
        uses: actions/download-artifact@v4
        with:
          name: mdix-unity-unpacked-${{ github.run_number }}
          path: com.midmanstudio.mdix/

      - name: Commit rebuilt binaries
        run: |
          git config user.name  "DixScript CI"
          git config user.email "ci@dixscript.dev"

          git add com.midmanstudio.mdix/

          if git diff --staged --quiet; then
            echo "No changes — binaries on ${{ github.ref_name }} already up to date."
            exit 0
          fi

          git commit -m "ci: rebuild mdix Unity package (build #${{ github.run_number }}) [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

          echo "Committed rebuilt package directly to ${{ github.ref_name }}."
          echo "A plain 'git pull' on this branch now has the new binaries —"
          echo "no manual cargo/dotnet build needed for local file: package testing."

  # ── 7. Push to upm branch ────────────────────────────────────────────────
  publish-upm:
    runs-on: ubuntu-latest
    needs: assemble-package
    if: |
      needs.assemble-package.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_upm == true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download unpacked package
        uses: actions/download-artifact@v4
        with:
          name: mdix-unity-unpacked-${{ github.run_number }}
          path: upm-staging/

      - name: Push to upm branch
        run: |
          git config user.name  "DixScript CI"
          git config user.email "ci@dixscript.dev"

          BUILD="${{ github.run_number }}"
          COMMIT="${GITHUB_SHA:0:8}"
          WORK=$(mktemp -d)

          if git ls-remote --exit-code --heads origin upm > /dev/null 2>&1; then
            git fetch origin upm
            git worktree add "$WORK" upm
          else
            git worktree add --orphan -b upm "$WORK"
          fi

          find "$WORK" -mindepth 1 \
            ! -path "$WORK/.git" \
            ! -path "$WORK/.git/*" \
            -delete

          cp -r upm-staging/. "$WORK/"

          cd "$WORK"
          git add -A

          if git diff --staged --quiet; then
            echo "No changes to publish to upm branch."
            exit 0
          fi

          git commit -m "chore: Unity package build #${BUILD} @ ${COMMIT} [skip ci]"

          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            upm

          echo "Published to upm branch."
          echo "Install via UPM:"
          echo "  https://github.com/${{ github.repository }}.git#upm"

  # ── 8. Summary ───────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-ffi-ubuntu, build-ffi-macos, build-core-dll, assemble-package, commit-to-repo, publish-upm]
    if: always()

    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix — Unity Package Build"
          echo "============================================="
          echo "Build:        #${{ github.run_number }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Trigger:      ${{ github.event_name }}"
          echo "Publish UPM requested: ${{ github.event.inputs.publish_upm || 'false (not a manual dispatch)' }}"
          echo ""
          echo "FFI (ubuntu): ${{ needs.build-ffi-ubuntu.result  || 'skipped' }}"
          echo "FFI (macOS):  ${{ needs.build-ffi-macos.result   || 'skipped' }}"
          echo "Core DLL:     ${{ needs.build-core-dll.result     || 'skipped' }}"
          echo "Assemble:     ${{ needs.assemble-package.result   || 'skipped' }}"
          echo "Commit repo:  ${{ needs.commit-to-repo.result     || 'skipped' }}"
          echo "Publish UPM:  ${{ needs.publish-upm.result        || 'skipped' }}"
          echo ""

          if [ "${{ needs.parse-trigger.outputs.run_unity }}" != "true" ]; then
            echo "Skipped — not triggered (push path filter didn't match mdix-ffi/**"
            echo "or mdix-csharp/**, or PR title lacked --mdix-unity)."
          elif [ "${{ needs.assemble-package.result }}" = "success" ]; then
            echo "Package artifact: mdix-unity-package-${{ github.run_number }}"
            echo "Download from Actions → this run → Artifacts"
            echo ""
            echo "UPM install URL:"
            echo "  https://github.com/${{ github.repository }}.git#upm"
          else
            echo "Build failed — check job logs above."
          fi
