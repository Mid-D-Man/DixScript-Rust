name: DixScript — Test & Bench Publisher

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_type:
        description: 'What to publish'
        required: true
        default: 'tests'
        type: choice
        options:
          - tests
          - bench
          - flame
          - all

permissions:
  contents: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Decide what to run ──────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
      run_bench: ${{ steps.decide.outputs.run_bench }}
      run_flame:  ${{ steps.decide.outputs.run_flame }}
    steps:
      - name: Decide what to publish
        id: decide
        run: |
          T=false; B=false; F=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ github.event.inputs.publish_type }}" in
              tests) T=true ;;
              bench) B=true ;;
              flame)  F=true ;;
              all)   T=true; B=true; F=true ;;
            esac
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-publish-(tests|all)' && T=true || true
            echo "$MSG" | grep -qiE '\-\-publish-(bench|all)' && B=true || true
            echo "$MSG" | grep -qiE '\-\-publish-(flame|all)' && F=true || true
          fi

          echo "run_tests=$T" >> $GITHUB_OUTPUT
          echo "run_bench=$B" >> $GITHUB_OUTPUT
          echo "run_flame=$F"  >> $GITHUB_OUTPUT
          echo "Tests=$T  Bench=$B  Flame=$F"

  # ── 2. Run tests ───────────────────────────────────────────────────────────
  run-tests:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_tests == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build test binaries
        run: cargo test --no-run 2>&1

      - name: Run all tests (continue on failure)
        continue-on-error: true
        run: |
          set +e
          cargo test --color=never --no-fail-fast -- --show-output 2>&1 | tee test-raw.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "TEST_EXIT=${TEST_EXIT_CODE}" >> $GITHUB_ENV

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "Tests failed with exit code ${TEST_EXIT_CODE} — continuing to generate report"
          else
            echo "All tests passed"
          fi
          exit 0

      - name: Parse results to JSON
        env:
          BUILD_NUM:    ${{ github.run_number }}
          BRANCH:       ${{ github.ref_name }}
          COMMIT:       ${{ github.sha }}
          BUILD_DATE:   ${{ github.event.head_commit.timestamp }}
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os, sys

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip_ansi(s):
              return RE_ANSI.sub('', s)

          def build_suite(name, tests, dur_s=0.0):
              return {
                  'name':       name,
                  'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                  'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                  'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                  'duration_s': round(dur_s, 4),
                  'tests':      tests,
              }

          raw  = open('test-raw.txt', encoding='utf-8', errors='replace').read()
          text = strip_ansi(raw)

          print("=== test-raw.txt preview (first 30 lines) ===")
          for i, l in enumerate(text.splitlines()[:30], 1):
              print(f"  {i:3}: {repr(l)}")
          print("==============================================")

          test_output = {}
          for m in re.finditer(
                  r'---- ([\w:]+(?:::\w+)*) stdout ----\n(.*?)'
                  r'(?=\n---- |\n\n(?:successes|failures):\n|\ntest result:|\Z)',
                  text, re.DOTALL):
              name_key = m.group(1)
              content  = m.group(2).strip()
              if content:
                  test_output[name_key] = content

          suites    = []
          cur_name  = None
          cur_tests = []
          cur_dur   = 0.0

          RE_RUN    = re.compile(r'Running\s+(?:unittests?\s+)?(\S+)\s+\(')
          RE_TEST   = re.compile(
              r'^test\s+([\w:]+(?:::\w+)*)\s+\.\.\.\s+'
              r'(ok|FAILED|ignored)(?:\s+\(([\d.]+)s\))?'
          )
          RE_RESULT = re.compile(r'test result:.*?finished in ([\d.]+)s')

          for line in text.splitlines():
              m = RE_RUN.search(line)
              if m:
                  if cur_name is not None and cur_tests:
                      suites.append(build_suite(cur_name, cur_tests, cur_dur))
                  raw_path = m.group(1)
                  base     = os.path.splitext(os.path.basename(raw_path))[0]
                  cur_name  = (base + ' (unit tests)') if base in ('lib', 'main') else base
                  cur_tests = []
                  cur_dur   = 0.0
                  continue

              m = RE_TEST.match(line)
              if m:
                  if cur_name is None:
                      cur_name  = 'lib (unit tests)'
                      cur_tests = []
                      cur_dur   = 0.0

                  tname, status, dur = m.group(1), m.group(2), m.group(3)
                  cur_tests.append({
                      'name':        tname,
                      'status':      {'ok': 'passed', 'FAILED': 'failed',
                                      'ignored': 'ignored'}.get(status, 'unknown'),
                      'duration_ms': int(float(dur) * 1000) if dur else 0,
                      'output':      test_output.get(tname, ''),
                  })
                  continue

              m = RE_RESULT.search(line)
              if m:
                  cur_dur = float(m.group(1))
                  if cur_name is not None and cur_tests:
                      suites.append(build_suite(cur_name, cur_tests, cur_dur))
                      cur_name  = None
                      cur_tests = []
                      cur_dur   = 0.0

          if cur_name and cur_tests:
              suites.append(build_suite(cur_name, cur_tests, cur_dur))

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)
          dur     = sum(s['duration_s'] for s in suites)

          result = {
              'build':        os.environ.get('BUILD_NUM',    '0'),
              'branch':       os.environ.get('BRANCH',       'unknown'),
              'commit':       os.environ.get('COMMIT',       'unknown')[:8],
              'date':         os.environ.get('BUILD_DATE',   ''),
              'rust_version': os.environ.get('RUST_VERSION', 'stable'),
              'summary': {
                  'total':      total,
                  'passed':     passed,
                  'failed':     failed,
                  'ignored':    ignored,
                  'duration_s': round(dur, 3),
              },
              'suites': suites,
          }

          with open('test-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Total:{total}  Passed:{passed}  Failed:{failed}")
          print(f"Output captured for {len(test_output)} tests")
          if failed > 0:
              print("FAILED tests:")
              for s in suites:
                  for t in s['tests']:
                      if t['status'] == 'failed':
                          print(f"  {s['name']}::{t['name']}")
          PYEOF

      - name: Build HTML report
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          cp .github/dixscript-test-template.html test-results-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  test-results-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       test-results-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            test-results-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     test-results-index.html
          sed -i "s|RUST_VERSION_PLACEHOLDER|${RUST_VERSION}|g"        test-results-index.html

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results.json
            test-results-index.html
            test-raw.txt
          retention-days: 30

  # ── 3. Run benchmarks ──────────────────────────────────────────────────────
  run-bench:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_bench == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      # ── Compilation check ────────────────────────────────────────────────
      # Runs BEFORE the timed bench step so any compile errors are visible in
      # the CI log rather than silently swallowed by the "|| true" below.
      # If this step fails, the individual bench names that errored are shown
      # (e.g. "error[E0412]: cannot find type `GeneralSemanticAnalyzer`").
      - name: Check all benchmark targets compile
        run: |
          echo "=== Verifying benchmark compilation ==="
          cargo bench --no-run --color=always 2>&1
          echo "All bench targets compiled successfully"

      - name: Run benchmarks
        continue-on-error: true
        run: |
          {
            echo "=== throughput_benchmark ==="
            cargo bench --bench throughput_benchmark --color=never 2>&1 || true
            echo "=== lexer_throughput ==="
            cargo bench --bench lexer_throughput --color=never 2>&1 || true
            echo "=== config_throughput ==="
            cargo bench --bench config_throughput --color=never 2>&1 || true
            echo "=== general_parser_benchmark ==="
            cargo bench --bench general_parser_benchmark --color=never 2>&1 || true
            echo "=== semantics_benchmark ==="
            cargo bench --bench semantics_benchmark --color=never 2>&1 || true
          } | tee bench-raw.txt

      - name: Parse benchmark results to JSON
        env:
          BUILD_NUM:  ${{ github.run_number }}
          BRANCH:     ${{ github.ref_name }}
          COMMIT:     ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - << 'PYEOF'
          import re, json, os, glob, sys

          RE_ANSI = re.compile(r'\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])')
          def strip_ansi(s):
              return RE_ANSI.sub('', s)

          def to_ns(val_str, unit):
              v = float(val_str.replace(',', ''))
              u = unit.strip().rstrip('/')
              return v * {'ns': 1, 'µs': 1e3, 'us': 1e3,
                          'ms': 1e6, 's': 1e9}.get(u, 1)

          raw  = open('bench-raw.txt', encoding='utf-8', errors='replace').read()
          text = strip_ansi(raw)

          benches    = []
          seen_names = set()

          RE_CRIT = re.compile(
              r'^([\w /\-]+?)\s{2,}time:\s+\[\s*'
              r'([\d.,]+)\s*(ns|µs|us|ms|s)\s+'
              r'([\d.,]+)\s*(ns|µs|us|ms|s)\s+'
              r'([\d.,]+)\s*(ns|µs|us|ms|s)\s*\]',
              re.MULTILINE
          )

          sections = re.split(r'^=== (\w+) ===$', text, flags=re.MULTILINE)
          pairs = []
          if len(sections) >= 3:
              i = 1
              while i + 1 < len(sections):
                  pairs.append((sections[i], sections[i + 1]))
                  i += 2
          else:
              pairs = [('benchmarks', text)]

          for suite_name, body in pairs:
              for m in RE_CRIT.finditer(body):
                  name  = m.group(1).strip()
                  lower = to_ns(m.group(2), m.group(3))
                  mean  = to_ns(m.group(4), m.group(5))
                  upper = to_ns(m.group(6), m.group(7))
                  key   = f"{suite_name}/{name}"
                  if key in seen_names:
                      continue
                  seen_names.add(key)
                  parts      = name.rsplit('/', 1)
                  group      = parts[0] if len(parts) == 2 else suite_name
                  bench_name = parts[-1]
                  benches.append({
                      'suite':     suite_name,
                      'group':     group,
                      'name':      bench_name,
                      'full_name': f'{suite_name}/{name}',
                      'lower_ns':  round(lower, 2),
                      'mean_ns':   round(mean,  2),
                      'upper_ns':  round(upper, 2),
                      'std_ns':    round((upper - lower) / 4, 2),
                  })

          if not benches:
              for est in sorted(glob.glob('target/criterion/**/**/estimates.json',
                                          recursive=True)):
                  try:
                      data = json.load(open(est, encoding='utf-8'))
                      parts = est.replace('target/criterion/', '').split('/')
                      if len(parts) < 3:
                          continue
                      suite_name = parts[0]
                      bench_name = parts[1]
                      if bench_name in ('new', 'base', 'baseline'):
                          continue
                      mn  = data.get('mean', {})
                      ci  = mn.get('confidence_interval', {})
                      sd  = data.get('std_dev', {}).get('point_estimate', 0)
                      key = f"{suite_name}/{bench_name}"
                      if key in seen_names:
                          continue
                      seen_names.add(key)
                      benches.append({
                          'suite':     suite_name,
                          'group':     suite_name,
                          'name':      bench_name,
                          'full_name': key,
                          'lower_ns':  round(ci.get('lower_bound', mn.get('point_estimate', 0)), 2),
                          'mean_ns':   round(mn.get('point_estimate', 0), 2),
                          'upper_ns':  round(ci.get('upper_bound', mn.get('point_estimate', 0)), 2),
                          'std_ns':    round(sd, 2),
                      })
                  except Exception as e:
                      print(f"Warn parsing {est}: {e}", file=sys.stderr)

          suite_map = {}
          for b in benches:
              suite_map.setdefault(b['suite'], []).append(b)
          suites = [{'name': k, 'benchmarks': v} for k, v in suite_map.items()]

          result = {
              'build':   os.environ.get('BUILD_NUM', '0'),
              'branch':  os.environ.get('BRANCH',    'unknown'),
              'commit':  os.environ.get('COMMIT',    'unknown')[:8],
              'date':    os.environ.get('BUILD_DATE', ''),
              'summary': {'total': len(benches), 'suites': len(suites)},
              'suites':  suites,
          }

          with open('bench-results.json', 'w') as f:
              json.dump(result, f, indent=2)

          print(f"Suites:{len(suites)}  Benchmarks:{len(benches)}")
          for s in suites:
              for b in s['benchmarks']:
                  print(f"  {s['name']}/{b['name']}: {b['mean_ns']:.1f} ns")
          PYEOF

      - name: Build HTML report
        env:
          RUST_VERSION: ${{ steps.rustver.outputs.ver }}
        run: |
          cp .github/bench-results-template.html bench-results-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  bench-results-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       bench-results-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            bench-results-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     bench-results-index.html
          sed -i "s|RUST_VERSION_PLACEHOLDER|${RUST_VERSION}|g"        bench-results-index.html

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_number }}
          path: |
            bench-results.json
            bench-results-index.html
            bench-raw.txt
          retention-days: 30

  # ── 4. Flamegraph ──────────────────────────────────────────────────────────
  #
  # cargo flamegraph uses perf under the hood. Two things must be true:
  #   1. perf_event_paranoid = -1  (lowered via sudo below)
  #   2. A perf binary compatible with the running kernel must exist at the
  #      path cargo-flamegraph looks for it: /usr/lib/linux-tools/<uname -r>/perf
  #
  # GitHub-hosted ubuntu runners often have linux-tools for a DIFFERENT kernel
  # version than the one actually running. The install step below finds whatever
  # perf is available and creates symlinks in BOTH expected locations.
  #
  # lto = false in [profile.bench] (Cargo.toml) is required: ThinLTO merges
  # compilation units in ways that confuse perf's DWARF stack unwinder, producing
  # [unknown] frames. With lto = false each crate keeps its own debug sections.
  #
  # --no-inline suppresses addr2line's per-frame inline expansion which can
  # hang for minutes on optimised binaries.
  #
  run-flame:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_flame == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-flame-${{ hashFiles('**/Cargo.lock') }}

      # Lower perf restrictions. sudo is available on all hosted ubuntu runners.
      - name: Configure perf permissions
        run: |
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          echo 0  | sudo tee /proc/sys/kernel/kptr_restrict
          echo "perf_event_paranoid=$(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "kptr_restrict=$(cat /proc/sys/kernel/kptr_restrict)"

      # Install perf and create symlinks in both locations cargo-flamegraph checks:
      #   /usr/local/bin/perf          — found via PATH
      #   /usr/lib/linux-tools/<ver>/perf — found by the perf wrapper script
      #
      # The kernel-version-specific symlink is the critical one: the `perf`
      # shell wrapper in linux-tools-common resolves its binary via that path,
      # so symlinking only to /usr/local/bin is not enough.
      - name: Install perf and create kernel-version symlink
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-common linux-tools-generic 2>/dev/null || true
          sudo apt-get install -y linux-tools-$(uname -r) 2>/dev/null || true

          KERNEL_VER=$(uname -r)
          PERF_BIN=$(find /usr/lib/linux-tools -name "perf" -type f 2>/dev/null | sort | tail -1)

          if [ -n "$PERF_BIN" ]; then
            echo "Found perf binary: $PERF_BIN"

            # Symlink 1: PATH access
            sudo ln -sf "$PERF_BIN" /usr/local/bin/perf

            # Symlink 2: kernel-version-specific path that cargo-flamegraph's
            # perf wrapper resolves to.  This is the fix for the "perf not found
            # for kernel X.Y.Z" message that causes silent flamegraph failure.
            sudo mkdir -p "/usr/lib/linux-tools/${KERNEL_VER}"
            if [ ! -f "/usr/lib/linux-tools/${KERNEL_VER}/perf" ]; then
              sudo ln -sf "$PERF_BIN" "/usr/lib/linux-tools/${KERNEL_VER}/perf"
              echo "Symlinked perf → /usr/lib/linux-tools/${KERNEL_VER}/perf"
            fi
          else
            echo "WARNING: no perf binary found under /usr/lib/linux-tools"
          fi

          echo ""
          echo "perf version check:"
          perf --version || echo "WARNING: perf not available via PATH"
          ls -la "/usr/lib/linux-tools/${KERNEL_VER}/" 2>/dev/null || echo "kernel-specific dir empty"

      - name: Install cargo-flamegraph
        run: |
          cargo install flamegraph --locked 2>/dev/null || \
          cargo install flamegraph          2>/dev/null || true
          cargo flamegraph --version 2>/dev/null || echo "WARNING: cargo-flamegraph not installed"

      # Pre-build all bench targets so flamegraph does not measure compile time.
      - name: Pre-build bench targets (bench profile)
        continue-on-error: true
        run: |
          cargo build --profile bench \
            --bench throughput_benchmark \
            --bench lexer_throughput \
            --bench config_throughput \
            --bench general_parser_benchmark \
            --bench semantics_benchmark \
            2>&1 || true

      - name: Generate flamegraphs
        continue-on-error: true
        run: |
          mkdir -p flame-output
          export PATH="$HOME/.cargo/bin:$PATH"

          if ! command -v perf &>/dev/null; then
            echo "perf not on PATH — skipping flamegraph generation"
            exit 0
          fi

          if ! cargo flamegraph --version &>/dev/null 2>&1; then
            echo "cargo-flamegraph not installed — skipping flamegraph generation"
            exit 0
          fi

          # run_flame TARGET OUTNAME
          #   TARGET  = criterion bench binary name  (matches --bench <n> in Cargo.toml)
          #   OUTNAME = output SVG base name (no extension)
          #
          # --no-inline: skip per-frame addr2line inline expansion which can hang
          #              for minutes on optimised binaries. The flamegraph is still
          #              accurate at the function level.
          #
          # Full output (no | tail -5) so build and perf errors are visible in CI.
          run_flame() {
            local target="$1"
            local outfile="$2"

            echo ""
            echo "--- flamegraph: $target ---"

            cargo flamegraph \
              --profile bench \
              --bench "$target" \
              --output "flame-output/${outfile}.svg" \
              --no-inline \
              -- --bench \
              2>&1 || true

            if [ -f "flame-output/${outfile}.svg" ] && \
               [ "$(wc -c < "flame-output/${outfile}.svg")" -gt 512 ]; then
              echo "OK: ${outfile}.svg ($(wc -c < "flame-output/${outfile}.svg") bytes)"
            else
              echo "SKIP: $outfile (empty or missing SVG — check perf output above)"
              rm -f "flame-output/${outfile}.svg"
            fi
          }

          run_flame "throughput_benchmark"     "throughput_benchmark"
          run_flame "lexer_throughput"         "lexer_throughput"
          run_flame "config_throughput"        "config_throughput"
          run_flame "general_parser_benchmark" "general_parser_benchmark"
          run_flame "semantics_benchmark"      "semantics_benchmark"

          echo ""
          echo "Generated flamegraphs:"
          ls -lh flame-output/*.svg 2>/dev/null || echo "(none produced)"

      - name: Build flamegraph index HTML
        run: |
          BUILD_NUM="${{ github.run_number }}"
          BRANCH="${{ github.ref_name }}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE="$(date -u)"

          mkdir -p flame-output

          CARDS_FILE="$(mktemp)"
          SVG_COUNT=0

          for svg in flame-output/*.svg; do
            [ -f "$svg" ] || continue
            SVG_COUNT=$((SVG_COUNT + 1))
            name=$(basename "$svg" .svg)
            cat >> "$CARDS_FILE" << CARDEOF
          <div class="card" data-name="${name}">
            <div class="card-header">
              <h2>🔥 ${name}</h2>
              <span class="card-hint">Click frames to zoom · Right-click to reset</span>
              <div class="card-actions">
                <div class="height-row">
                  <span style="font-size:0.72rem;color:#484f58">Height:</span>
                  <button class="height-btn" onclick="setHeight('${name}', 320)">S</button>
                  <button class="height-btn active" onclick="setHeight('${name}', 520)">M</button>
                  <button class="height-btn" onclick="setHeight('${name}', 800)">L</button>
                  <button class="height-btn" onclick="setHeight('${name}', 1100)">XL</button>
                </div>
                <a class="btn btn-download" href="${name}.svg" download="${name}.svg">⬇ Download SVG</a>
                <a class="btn btn-open" href="${name}.svg" target="_blank">↗ Open</a>
              </div>
            </div>
            <div class="card-body">
              <iframe id="frame-${name}" src="${name}.svg"
                      title="${name} flamegraph" style="height:520px"></iframe>
            </div>
          </div>
          CARDEOF
          done

          if [ "$SVG_COUNT" -eq 0 ]; then
            cat > "$CARDS_FILE" << NOEOF
          <div class="card">
            <div class="no-graph">
              <p>No flamegraphs were generated.</p>
              <p style="font-size:0.78rem;margin-top:8px">
                Check the <strong>Install perf and create kernel-version symlink</strong>
                and <strong>Generate flamegraphs</strong> step logs for the specific error.
                Common causes: (1) perf binary found via PATH but kernel-version symlink
                missing — the install step now creates both; (2) <code>lto</code> was set
                to <code>"thin"</code> in <code>[profile.bench]</code> which breaks DWARF
                stack unwinding — ensure <code>lto = false</code> in Cargo.toml.
              </p>
            </div>
          </div>
          NOEOF
          fi

          cp .github/flame-results-template.html flame-output/index.html

          python3 - "$CARDS_FILE" << 'PYEOF'
          import sys
          cards = open(sys.argv[1], encoding='utf-8').read()
          html_path = 'flame-output/index.html'
          content = open(html_path, encoding='utf-8').read()
          content = content.replace('CARDS_PLACEHOLDER', cards)
          open(html_path, 'w', encoding='utf-8').write(content)
          print(f"Injected {len(cards)} bytes of card HTML into index.html")
          PYEOF

          rm -f "$CARDS_FILE"

          sed -i "s/BUILD_NUM_PLACEHOLDER/${BUILD_NUM}/g" flame-output/index.html
          sed -i "s/BRANCH_PLACEHOLDER/${BRANCH}/g"       flame-output/index.html
          sed -i "s/COMMIT_PLACEHOLDER/${COMMIT}/g"       flame-output/index.html
          sed -i "s|DATE_PLACEHOLDER|${DATE}|g"           flame-output/index.html

      - name: Upload flamegraph artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flamegraph-${{ github.run_number }}
          path: flame-output/
          retention-days: 30

  # ── 5. Deploy to gh-pages ──────────────────────────────────────────────────
  deploy-results:
    runs-on: ubuntu-latest
    needs: [parse-trigger, run-tests, run-bench, run-flame]
    if: |
      always() &&
      (needs.run-tests.result  == 'success' ||
       needs.run-bench.result  == 'success' ||
       needs.run-flame.result  == 'success')

    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        if: needs.run-tests.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: deploy/tests/

      - name: Download bench results
        if: needs.run-bench.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: bench-results-${{ github.run_number }}
          path: deploy/bench/

      - name: Download flamegraph artifacts
        if: needs.run-flame.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: flamegraph-${{ github.run_number }}
          path: deploy/flame/

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            echo "Creating fresh gh-pages branch"
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          # ── tests ──────────────────────────────────────────────────────────
          if [ -d "deploy/tests" ]; then
            mkdir -p "$WORK/tests" "$WORK/tests/builds/build_${BUILD_NUM}"
            cp deploy/tests/test-results.json       "$WORK/tests/test-results.json"
            cp deploy/tests/test-results-index.html "$WORK/tests/index.html"
            cp deploy/tests/test-results.json       "$WORK/tests/builds/build_${BUILD_NUM}/test-results.json"
            cp deploy/tests/test-results-index.html "$WORK/tests/builds/build_${BUILD_NUM}/index.html"
            echo "Test results deployed"
          fi

          # ── bench ──────────────────────────────────────────────────────────
          if [ -d "deploy/bench" ]; then
            mkdir -p "$WORK/bench" "$WORK/bench/builds/build_${BUILD_NUM}"
            cp deploy/bench/bench-results.json       "$WORK/bench/bench-results.json"
            cp deploy/bench/bench-results-index.html "$WORK/bench/index.html"
            cp deploy/bench/bench-results.json       "$WORK/bench/builds/build_${BUILD_NUM}/bench-results.json"
            cp deploy/bench/bench-results-index.html "$WORK/bench/builds/build_${BUILD_NUM}/index.html"
            echo "Bench results deployed"
          fi

          # ── flame ──────────────────────────────────────────────────────────
          if [ -d "deploy/flame" ]; then
            mkdir -p "$WORK/flame" "$WORK/flame/builds/build_${BUILD_NUM}"
            cp -r deploy/flame/* "$WORK/flame/"
            cp -r deploy/flame/* "$WORK/flame/builds/build_${BUILD_NUM}/"
            echo "Flamegraphs deployed"
          fi

          # ── root landing ───────────────────────────────────────────────────
          cat > "$WORK/index.html" << 'LANDEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DixScript-Rust — CI Dashboard</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117;
                color: #e6edf3; display: flex; align-items: center;
                justify-content: center; min-height: 100vh; padding: 24px; }
              .card { background: #161b22; border: 1px solid #30363d;
                border-radius: 12px; padding: 36px 40px; max-width: 460px; width: 100%; }
              h1 { font-size: 1.6rem; color: #79c0ff; margin-bottom: 6px; }
              p { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
              .links { display: flex; flex-direction: column; gap: 10px; }
              a { display: flex; align-items: center; gap: 10px; background: #1c2128;
                border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px;
                text-decoration: none; color: #e6edf3; font-size: 0.88rem;
                transition: all 0.15s; }
              a:hover { border-color: #79c0ff; color: #79c0ff; }
              a .icon { font-size: 1.2rem; }
              a .desc { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>DixScript-Rust</h1>
              <p>MidManStudio — CI Result Dashboard</p>
              <div class="links">
                <a href="tests/">
                  <span class="icon">✅</span>
                  <div><div>Test Results</div><div class="desc">cargo test — per-suite breakdown with output</div></div>
                </a>
                <a href="bench/">
                  <span class="icon">📊</span>
                  <div><div>Benchmarks</div><div class="desc">criterion — throughput and latency</div></div>
                </a>
                <a href="flame/">
                  <span class="icon">🔥</span>
                  <div><div>Flamegraphs</div><div class="desc">perf + cargo-flamegraph — profiling for hot paths</div></div>
                </a>
              </div>
            </div>
          </body>
          </html>
          LANDEOF

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "DixScript CI — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo ""
          echo "Deployed to gh-pages"
          echo "  https://mid-d-man.github.io/DixScript-Rust/"

  # ── 6. Summary ─────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, run-tests, run-bench, run-flame, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "======================================================="
          echo "  DixScript — Publish Results Summary"
          echo "======================================================="
          echo "Build:     #${{ github.run_number }}"
          echo "Branch:    ${{ github.ref_name }}"
          echo "Tests:     ${{ needs.run-tests.result  || 'skipped' }}"
          echo "Bench:     ${{ needs.run-bench.result  || 'skipped' }}"
          echo "Flame:     ${{ needs.run-flame.result  || 'skipped' }}"
          echo "Deploy:    ${{ needs.deploy-results.result || 'skipped' }}"
          echo ""
          echo "View results: https://mid-d-man.github.io/DixScript-Rust/"
