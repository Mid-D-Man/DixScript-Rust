name: DixScript — FFI Build & Deploy

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of commit message'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:

  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether to run FFI build
        id: decide
        run: |
          RUN=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-ffi' && RUN=true || true
          fi
          echo "should_run=$RUN" >> $GITHUB_OUTPUT
          echo "FFI build triggered: $RUN"

  build-ffi-linux:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.should_run == 'true'
    outputs:
      status:     ${{ steps.result.outputs.status }}
      size_bytes: ${{ steps.result.outputs.size_bytes }}
      duration_s: ${{ steps.result.outputs.duration_s }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-ffi-

      - name: Build mdix-ffi (Linux)
        id: build
        run: |
          START=$(date +%s)
          set -o pipefail
          cargo build -p mdix-ffi --release 2>&1 | tee build.log
          BUILD_EXIT=$?
          END=$(date +%s)
          echo "DURATION_S=$((END - START))" >> $GITHUB_ENV
          echo "=== Artifact sizes ==="
          ls -lh target/release/libmdix_ffi.so 2>/dev/null || echo "libmdix_ffi.so not found"
          ls -lh target/release/libmdix_ffi.a  2>/dev/null || echo "libmdix_ffi.a not found"
          echo "=== Generated MdixNative.cs ==="
          ls -lh mdix-csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs 2>/dev/null || echo "MdixNative.cs not found"
          exit $BUILD_EXIT

      - name: Collect result
        id: result
        if: always()
        run: |
          DUR="${DURATION_S:-0}"
          if [ -f "target/release/libmdix_ffi.so" ]; then
            SIZE=$(stat -c%s target/release/libmdix_ffi.so)
            echo "status=success"   >> $GITHUB_OUTPUT
            echo "size_bytes=$SIZE" >> $GITHUB_OUTPUT
          elif [ -f "target/release/libmdix_ffi.a" ]; then
            SIZE=$(stat -c%s target/release/libmdix_ffi.a)
            echo "status=success"   >> $GITHUB_OUTPUT
            echo "size_bytes=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "status=failed"    >> $GITHUB_OUTPUT
            echo "size_bytes=0"     >> $GITHUB_OUTPUT
          fi
          echo "duration_s=$DUR" >> $GITHUB_OUTPUT

      - name: Upload Linux artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: libmdix-ffi-linux-${{ github.run_number }}
          path: |
            target/release/libmdix_ffi.so
            target/release/libmdix_ffi.a
          retention-days: 30
          if-no-files-found: warn

      - name: Upload MdixNative.cs artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MdixNative-cs-${{ github.run_number }}
          path: mdix-csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs
          retention-days: 30
          if-no-files-found: error

  build-ffi-macos:
    runs-on: macos-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.should_run == 'true'
    outputs:
      status:     ${{ steps.result.outputs.status }}
      size_bytes: ${{ steps.result.outputs.size_bytes }}
      duration_s: ${{ steps.result.outputs.duration_s }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-cargo-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-latest-cargo-ffi-

      - name: Build mdix-ffi (macOS)
        id: build
        run: |
          START=$(date +%s)
          set -o pipefail
          cargo build -p mdix-ffi --release 2>&1 | tee build.log
          BUILD_EXIT=$?
          END=$(date +%s)
          echo "DURATION_S=$((END - START))" >> $GITHUB_ENV
          echo "=== Artifact sizes ==="
          ls -lh target/release/libmdix_ffi.dylib 2>/dev/null || echo "libmdix_ffi.dylib not found"
          ls -lh target/release/libmdix_ffi.a      2>/dev/null || echo "libmdix_ffi.a not found"
          exit $BUILD_EXIT

      - name: Collect result
        id: result
        if: always()
        run: |
          DUR="${DURATION_S:-0}"
          if [ -f "target/release/libmdix_ffi.dylib" ]; then
            SIZE=$(stat -f%z target/release/libmdix_ffi.dylib)
            echo "status=success"   >> $GITHUB_OUTPUT
            echo "size_bytes=$SIZE" >> $GITHUB_OUTPUT
          elif [ -f "target/release/libmdix_ffi.a" ]; then
            SIZE=$(stat -f%z target/release/libmdix_ffi.a)
            echo "status=success"   >> $GITHUB_OUTPUT
            echo "size_bytes=$SIZE" >> $GITHUB_OUTPUT
          else
            echo "status=failed"    >> $GITHUB_OUTPUT
            echo "size_bytes=0"     >> $GITHUB_OUTPUT
          fi
          echo "duration_s=$DUR" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: libmdix-ffi-macos-${{ github.run_number }}
          path: |
            target/release/libmdix_ffi.dylib
            target/release/libmdix_ffi.a
          retention-days: 30
          if-no-files-found: warn

  test-core:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.should_run == 'true'
    outputs:
      status:       ${{ steps.result.outputs.status }}
      total:        ${{ steps.result.outputs.total }}
      passed:       ${{ steps.result.outputs.passed }}
      failed:       ${{ steps.result.outputs.failed }}
      duration_s:   ${{ steps.result.outputs.duration_s }}
      failed_names: ${{ steps.result.outputs.failed_names }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-ffi-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-ffi-test-

      - name: Run dixscript core tests
        id: run-tests
        continue-on-error: true
        run: |
          START=$(date +%s)
          cargo test -p dixscript --color=never --no-fail-fast 2>&1 | tee test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "TEST_EXIT=$TEST_EXIT"          >> $GITHUB_ENV
          echo "DURATION_S=$((END - START))"   >> $GITHUB_ENV
          exit 0

      - name: Parse test counts and failures
        id: result
        if: always()
        run: |
          TOTAL=0; PASSED=0; FAILED=0

          if [ -f test-output.txt ]; then
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^test result:'; then
                P=$(echo "$line" | grep -oP '\d+(?= passed)' | head -1)
                F=$(echo "$line" | grep -oP '\d+(?= failed)' | head -1)
                PASSED=$((PASSED + ${P:-0}))
                FAILED=$((FAILED + ${F:-0}))
                TOTAL=$((TOTAL   + ${P:-0} + ${F:-0}))
              fi
            done < test-output.txt

            FAILED_NAMES=$(grep -E "^test .+ \.\.\. FAILED" test-output.txt \
              | sed 's/^test //' \
              | sed 's/ \.\.\. FAILED//' \
              | head -30 \
              | tr '\n' '|' \
              | sed 's/|$//')
          fi

          if [ "${TEST_EXIT:-0}" != "0" ]; then
            STATUS=failed
          else
            STATUS=success
          fi

          echo "status=$STATUS"                     >> $GITHUB_OUTPUT
          echo "total=$TOTAL"                       >> $GITHUB_OUTPUT
          echo "passed=$PASSED"                     >> $GITHUB_OUTPUT
          echo "failed=$FAILED"                     >> $GITHUB_OUTPUT
          echo "duration_s=${DURATION_S:-0}"        >> $GITHUB_OUTPUT
          echo "failed_names=${FAILED_NAMES:-}"     >> $GITHUB_OUTPUT

          echo "Test result: $STATUS  total=$TOTAL passed=$PASSED failed=$FAILED"
          if [ -n "${FAILED_NAMES:-}" ]; then
            echo "Failing tests: $FAILED_NAMES"
          fi

      - name: Upload test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_number }}
          path: test-output.txt
          retention-days: 30
          if-no-files-found: ignore

  collect-and-deploy:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-ffi-linux, build-ffi-macos, test-core]
    if: |
      always() &&
      needs.parse-trigger.outputs.should_run == 'true' &&
      (needs.build-ffi-linux.result != 'skipped' ||
       needs.build-ffi-macos.result != 'skipped' ||
       needs.test-core.result       != 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Get Rust version
        id: rustver
        run: echo "ver=$(rustc --version)" >> $GITHUB_OUTPUT

      - name: Download MdixNative.cs artifact
        if: needs.build-ffi-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: MdixNative-cs-${{ github.run_number }}
          path: downloaded-cs/
        continue-on-error: true

      - name: Generate ffi-results.json
        env:
          BUILD_NUM:         ${{ github.run_number }}
          BRANCH:            ${{ github.ref_name }}
          COMMIT:            ${{ github.sha }}
          BUILD_DATE:        ${{ github.event.head_commit.timestamp }}
          RUST_VER:          ${{ steps.rustver.outputs.ver }}
          LINUX_STATUS:      ${{ needs.build-ffi-linux.outputs.status     || 'skipped' }}
          LINUX_SIZE:        ${{ needs.build-ffi-linux.outputs.size_bytes  || '0' }}
          LINUX_DUR:         ${{ needs.build-ffi-linux.outputs.duration_s  || '0' }}
          MAC_STATUS:        ${{ needs.build-ffi-macos.outputs.status      || 'skipped' }}
          MAC_SIZE:          ${{ needs.build-ffi-macos.outputs.size_bytes   || '0' }}
          MAC_DUR:           ${{ needs.build-ffi-macos.outputs.duration_s   || '0' }}
          TEST_STATUS:       ${{ needs.test-core.outputs.status             || 'skipped' }}
          TEST_TOTAL:        ${{ needs.test-core.outputs.total              || '0' }}
          TEST_PASSED:       ${{ needs.test-core.outputs.passed             || '0' }}
          TEST_FAILED:       ${{ needs.test-core.outputs.failed             || '0' }}
          TEST_DUR:          ${{ needs.test-core.outputs.duration_s         || '0' }}
          TEST_FAILED_NAMES: ${{ needs.test-core.outputs.failed_names       || '' }}
          CS_AVAILABLE:      ${{ needs.build-ffi-linux.result == 'success' && 'true' || 'false' }}
        run: |
          python3 - << 'PYEOF'
          import json, os

          def int_env(key):
              try:
                  return int(os.environ.get(key, "0"))
              except ValueError:
                  return 0

          raw_names = os.environ.get("TEST_FAILED_NAMES", "")
          failed_names = [n for n in raw_names.split("|") if n.strip()] if raw_names else []

          result = {
              "build":          os.environ.get("BUILD_NUM",  "0"),
              "branch":         os.environ.get("BRANCH",     "unknown"),
              "commit":         os.environ.get("COMMIT",     "unknown")[:8],
              "date":           os.environ.get("BUILD_DATE", ""),
              "rust_version":   os.environ.get("RUST_VER",  "stable"),
              "cs_available":   os.environ.get("CS_AVAILABLE", "false") == "true",
              "builds": [
                  {
                      "platform":   "linux",
                      "runner":     "ubuntu-latest",
                      "artifact":   "libmdix_ffi.so",
                      "status":     os.environ.get("LINUX_STATUS", "skipped"),
                      "size_bytes": int_env("LINUX_SIZE"),
                      "duration_s": int_env("LINUX_DUR"),
                  },
                  {
                      "platform":   "macos",
                      "runner":     "macos-latest",
                      "artifact":   "libmdix_ffi.dylib",
                      "status":     os.environ.get("MAC_STATUS", "skipped"),
                      "size_bytes": int_env("MAC_SIZE"),
                      "duration_s": int_env("MAC_DUR"),
                  },
              ],
              "tests": {
                  "status":       os.environ.get("TEST_STATUS",  "skipped"),
                  "total":        int_env("TEST_TOTAL"),
                  "passed":       int_env("TEST_PASSED"),
                  "failed":       int_env("TEST_FAILED"),
                  "duration_s":   int_env("TEST_DUR"),
                  "failed_names": failed_names,
              },
          }

          with open("ffi-results.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PYEOF

      - name: Build FFI HTML report
        run: |
          cp .github/ffi-results-template.html ffi-results-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g" ffi-results-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"      ffi-results-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"           ffi-results-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                    ffi-results-index.html

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            echo "Creating fresh gh-pages branch"
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/ffi" "$WORK/ffi/builds/build_${BUILD_NUM}"

          cp ffi-results.json       "$WORK/ffi/ffi-results.json"
          cp ffi-results-index.html "$WORK/ffi/index.html"
          cp ffi-results.json       "$WORK/ffi/builds/build_${BUILD_NUM}/ffi-results.json"
          cp ffi-results-index.html "$WORK/ffi/builds/build_${BUILD_NUM}/index.html"

          if [ -f "downloaded-cs/MdixNative.cs" ]; then
            cp downloaded-cs/MdixNative.cs "$WORK/ffi/MdixNative.cs"
            cp downloaded-cs/MdixNative.cs "$WORK/ffi/builds/build_${BUILD_NUM}/MdixNative.cs"
            echo "MdixNative.cs deployed"
          else
            echo "MdixNative.cs not available this build"
          fi

          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "DixScript FFI CI — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

          echo "Deployed: https://mid-d-man.github.io/DixScript-Rust/ffi/"

  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-ffi-linux, build-ffi-macos, test-core, collect-and-deploy]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "======================================================="
          echo "  DixScript — FFI Build Summary"
          echo "======================================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Linux:   ${{ needs.build-ffi-linux.result   || 'skipped' }}"
          echo "macOS:   ${{ needs.build-ffi-macos.result   || 'skipped' }}"
          echo "Tests:   ${{ needs.test-core.result         || 'skipped' }}"
          echo "Deploy:  ${{ needs.collect-and-deploy.result || 'skipped' }}"
          echo ""
          echo "FFI page:        https://mid-d-man.github.io/DixScript-Rust/ffi/"
          echo "MdixNative.cs:   https://mid-d-man.github.io/DixScript-Rust/ffi/MdixNative.cs"
