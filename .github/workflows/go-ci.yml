name: DixScript — Go Package CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run regardless of commit message'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:

  # ── Step 1: decide whether this workflow should run ──────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether to run Go CI
        id: decide
        run: |
          RUN=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-go' && RUN=true || true
          fi
          echo "should_run=$RUN" >> $GITHUB_OUTPUT
          echo "Go CI triggered: $RUN"

  # ── Step 2: build Rust FFI + generate header + run go test ─────────────────
  build-and-test:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.should_run == 'true'
    outputs:
      status:       ${{ steps.result.outputs.status }}
      total:        ${{ steps.result.outputs.total }}
      passed:       ${{ steps.result.outputs.passed }}
      failed:       ${{ steps.result.outputs.failed }}
      duration_s:   ${{ steps.result.outputs.duration_s }}
      failed_names: ${{ steps.result.outputs.failed_names }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain (needed to build mdix-ffi and generate the header) ───
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-go-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-go-

      # ── Go toolchain ─────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # ── Build mdix-ffi (generates header AND native lib) ─────────────────────
      - name: Build mdix-ffi (generates mdix_ffi.h + libmdix_ffi.so)
        run: |
          cargo build -p mdix-ffi --release
          echo "=== Generated header ==="
          ls -lh mdix-go/internal/include/mdix_ffi.h || echo "header not found"
          echo "=== Native lib ==="
          ls -lh target/release/libmdix_ffi.so || echo "libmdix_ffi.so not found"

      # ── Copy the native lib into the Go package lib/ directory ───────────────
      - name: Stage native lib for Go cgo
        run: |
          mkdir -p mdix-go/internal/lib/linux-amd64
          cp target/release/libmdix_ffi.so mdix-go/internal/lib/linux-amd64/

      # ── Verify the Go module builds ──────────────────────────────────────────
      - name: go build
        working-directory: mdix-go
        run: |
          CGO_ENABLED=1 go build ./...

      # ── Run tests ────────────────────────────────────────────────────────────
      - name: go test
        id: go-test
        continue-on-error: true
        working-directory: mdix-go
        run: |
          START=$(date +%s)
          CGO_ENABLED=1 go test -v ./... 2>&1 | tee test-output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "TEST_EXIT=$TEST_EXIT"         >> $GITHUB_ENV
          echo "DURATION_S=$((END - START))"  >> $GITHUB_ENV
          exit 0

      - name: Parse test results
        id: result
        if: always()
        working-directory: mdix-go
        run: |
          TOTAL=0; PASSED=0; FAILED=0

          if [ -f test-output.txt ]; then
            # Count --- PASS / --- FAIL lines
            PASSED=$(grep -c '^--- PASS' test-output.txt || true)
            FAILED=$(grep -c '^--- FAIL' test-output.txt || true)
            TOTAL=$((PASSED + FAILED))

            FAILED_NAMES=$(grep '^--- FAIL' test-output.txt \
              | sed 's/--- FAIL: //' \
              | awk '{print $1}' \
              | head -30 \
              | tr '\n' '|' \
              | sed 's/|$//')
          fi

          if [ "${TEST_EXIT:-0}" != "0" ]; then
            STATUS=failed
          else
            STATUS=success
          fi

          echo "status=$STATUS"                 >> $GITHUB_OUTPUT
          echo "total=$TOTAL"                   >> $GITHUB_OUTPUT
          echo "passed=$PASSED"                 >> $GITHUB_OUTPUT
          echo "failed=$FAILED"                 >> $GITHUB_OUTPUT
          echo "duration_s=${DURATION_S:-0}"    >> $GITHUB_OUTPUT
          echo "failed_names=${FAILED_NAMES:-}" >> $GITHUB_OUTPUT

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-output-${{ github.run_number }}
          path: mdix-go/test-output.txt
          retention-days: 30
          if-no-files-found: ignore

  # ── Step 3: collect and deploy results to gh-pages ───────────────────────────
  collect-and-deploy:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-test]
    if: |
      always() &&
      needs.parse-trigger.outputs.should_run == 'true' &&
      needs.build-and-test.result != 'skipped'

    steps:
      - uses: actions/checkout@v4

      - name: Get Go version
        id: gover
        run: echo "ver=$(go version)" >> $GITHUB_OUTPUT

      - name: Generate go-results.json
        env:
          BUILD_NUM:         ${{ github.run_number }}
          BRANCH:            ${{ github.ref_name }}
          COMMIT:            ${{ github.sha }}
          BUILD_DATE:        ${{ github.event.head_commit.timestamp }}
          GO_VER:            ${{ steps.gover.outputs.ver }}
          TEST_STATUS:       ${{ needs.build-and-test.outputs.status     || 'skipped' }}
          TEST_TOTAL:        ${{ needs.build-and-test.outputs.total      || '0' }}
          TEST_PASSED:       ${{ needs.build-and-test.outputs.passed     || '0' }}
          TEST_FAILED:       ${{ needs.build-and-test.outputs.failed     || '0' }}
          TEST_DUR:          ${{ needs.build-and-test.outputs.duration_s || '0' }}
          TEST_FAILED_NAMES: ${{ needs.build-and-test.outputs.failed_names || '' }}
        run: |
          python3 - << 'PYEOF'
          import json, os

          def int_env(key):
              try:
                  return int(os.environ.get(key, "0"))
              except ValueError:
                  return 0

          raw_names = os.environ.get("TEST_FAILED_NAMES", "")
          failed_names = [n for n in raw_names.split("|") if n.strip()] if raw_names else []

          result = {
              "build":        os.environ.get("BUILD_NUM",  "0"),
              "branch":       os.environ.get("BRANCH",     "unknown"),
              "commit":       os.environ.get("COMMIT",     "unknown")[:8],
              "date":         os.environ.get("BUILD_DATE", ""),
              "go_version":   os.environ.get("GO_VER",     "1.21"),
              "package":      "github.com/Mid-D-Man/dixscript-go",
              "tests": {
                  "status":       os.environ.get("TEST_STATUS", "skipped"),
                  "total":        int_env("TEST_TOTAL"),
                  "passed":       int_env("TEST_PASSED"),
                  "failed":       int_env("TEST_FAILED"),
                  "duration_s":   int_env("TEST_DUR"),
                  "failed_names": failed_names,
              },
          }

          with open("go-results.json", "w") as f:
              json.dump(result, f, indent=2)

          print(json.dumps(result, indent=2))
          PYEOF

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/go" "$WORK/go/builds/build_${BUILD_NUM}"

          cp go-results.json "$WORK/go/go-results.json"
          cp go-results.json "$WORK/go/builds/build_${BUILD_NUM}/go-results.json"
          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "DixScript Go CI — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages

  # ── Step 4: print summary ─────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-test, collect-and-deploy]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "======================================================="
          echo "  DixScript — Go Package CI Summary"
          echo "======================================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Tests:   ${{ needs.build-and-test.result || 'skipped' }}"
          echo "Deploy:  ${{ needs.collect-and-deploy.result || 'skipped' }}"
          echo ""
          echo "Go results: https://mid-d-man.github.io/DixScript-Rust/go/"
