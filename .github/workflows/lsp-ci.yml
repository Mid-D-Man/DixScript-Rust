name: DixScript — LSP Tests

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:

jobs:
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - id: decide
        run: |
          RUN=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          else
            echo "${{ github.event.head_commit.message }}" | grep -qiE '\-\-lsp' && RUN=true || true
          fi
          echo "should_run=$RUN" >> $GITHUB_OUTPUT

  test-lsp:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: stable }
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/
            target/
          key: ubuntu-lsp-${{ hashFiles('**/Cargo.lock') }}

      - name: Run LSP unit + integration tests
        run: |
          cargo test -p mdix-lsp --color=never --no-fail-fast 2>&1 | tee lsp-raw.txt
          echo "LSP_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Parse results to JSON
        # same Python parser pattern as your existing workflows
        run: |
          python3 parse_lsp_results.py  # same script, different output file

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lsp-results-${{ github.run_number }}
          path: lsp-results.json
