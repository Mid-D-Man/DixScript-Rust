name: Publish MidManStudio.Mdix to NuGet

# Manual only (Actions tab -> Run workflow) — requires typing "publish" in
# the confirmation input, same gating a-publish-dixscript-crate.yml uses
# for crates.io, mdix-cli-publish.yml uses for crates.io+GHCR, and
# mdix-python-pypi-publish.yml uses for PyPI.
#
# Builds native mdix-ffi for all 9 RIDs the .csproj/.targets already wire
# up (see MidManStudio.Mdix.Core.csproj's runtimes/ ItemGroup and
# build/MidManStudio.Mdix.targets): linux-x64, linux-arm64, win-x64,
# win-x86, osx-arm64, osx-x64, android-arm64, android-arm, android-x64. Each Exists() guard in the
# .csproj means `dotnet pack` still succeeds even if a job below is ever
# skipped or fails independently — the package just ships fewer RIDs that
# run, not zero.
#
# Then creates a GitHub Release tagged "MidManStudio.Mdix-v<version>",
# same reasoning a-publish-dixscript-crate.yml / mdix-cli-publish.yml /
# wasm-npm-publish.yml / mdix-python-pypi-publish.yml already document for
# their own packages. No per-package CHANGELOG.md exists yet for
# mdix-csharp, so release notes here are a generic note + NuGet link
# rather than a changelog excerpt — same situation wasm-npm-publish.yml
# documents for mdix-npm, and upgradeable the same way later.
#
# ── NuGet — Trusted Publishing (OIDC), same bootstrap situation
#    mdix-cli-publish.yml documents for crates.io ─────────────────────────
# nuget.org's Trusted Publishing UI ties a policy to packages already
# owned by your account — for the very first push of a brand-new package
# ID, the classic API-key flow below is used. Once this package exists on
# nuget.org:
#   1. Sign in to nuget.org -> account menu -> Trusted Publishing ->
#      Add a new trusted publisher, with:
#        Repository owner:  Mid-D-Man
#        Repository name:   DixScript-Rust
#        Workflow filename: mdix-core-cs-nuget-publish.yml
#        Package ID:        MidManStudio.Mdix
#   2. Switch the "NuGet login (OIDC)" step below from `if: false` to
#      enabled, and change the push step's `--api-key` argument from
#      `${{ secrets.NUGET_API_KEY }}` to
#      `${{ steps.nuget-login.outputs.NUGET_API_KEY }}` — same swap
#      mdix-cli-publish.yml documents for its own crates.io bootstrap.
#   3. Once that's confirmed working, the NUGET_API_KEY repo secret can be
#      deleted — Trusted Publishing needs no long-lived secret at all.
#
# Requires a NUGET_API_KEY secret in this repo's settings until the
# bootstrap swap above happens (Settings -> Secrets and variables ->
# Actions -> New repository secret). Generate the key at
# https://www.nuget.org/account/apikeys with push scope for
# MidManStudio.Mdix (or "*" while it's still new — narrow it once the
# package exists, per NuGet's own guidance on first-publish key scope).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. NuGet does not allow re-uploading the same version once it is live — only unlisting, which hides it from search but does not remove it. Bump <Version> in MidManStudio.Mdix.Core.csproj first if this is a new release.'
        required: true

# FIX: was missing entirely -- contents: write is needed for the new
# create-release job below (a-publish-dixscript-crate.yml / mdix-cli-
# publish.yml / wasm-npm-publish.yml all already declare this for the
# same reason). id-token: write is needed once the Trusted Publishing
# swap documented above is flipped on; declaring it now costs nothing and
# means that swap is a one-line change later rather than a second
# permissions edit.
permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  confirm-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual trigger
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

  # ── 1. Native Build Jobs (All 9 RIDs) ────────────────────────────────────

  build-native-linux-x64:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-linux-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-linux-x64-
      - name: Build mdix-ffi (linux-x64)
        run: cargo build -p mdix-ffi --release
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x64
          path: target/release/libmdix_ffi.so
          if-no-files-found: error

  build-native-linux-arm64:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-linux-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-linux-arm64-
      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build mdix-ffi (linux-arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p mdix-ffi --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/libmdix_ffi.so
          if-no-files-found: error

  build-native-win-x64:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-win-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-win-x64-
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build mdix-ffi (win-x64)
        run: cargo build -p mdix-ffi --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x64
          path: target/x86_64-pc-windows-gnu/release/mdix_ffi.dll
          if-no-files-found: error

  build-native-win-x86:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: i686-pc-windows-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-win-x86-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-win-x86-
      - name: Install MinGW 32-bit
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - name: Build mdix-ffi (win-x86)
        run: cargo build -p mdix-ffi --release --target i686-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: native-win-x86
          path: target/i686-pc-windows-gnu/release/mdix_ffi.dll
          if-no-files-found: error

  build-native-osx-x64:
    needs: confirm-trigger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-cargo-osx-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-latest-cargo-osx-x64-
      - name: Build mdix-ffi (osx-x64)
        run: cargo build -p mdix-ffi --release --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-x64
          path: target/x86_64-apple-darwin/release/libmdix_ffi.dylib
          if-no-files-found: error

  build-native-osx-arm64:
    needs: confirm-trigger
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-cargo-osx-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-latest-cargo-osx-arm64-
      - name: Build mdix-ffi (osx-arm64)
        run: cargo build -p mdix-ffi --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: native-osx-arm64
          path: target/aarch64-apple-darwin/release/libmdix_ffi.dylib
          if-no-files-found: error

  build-native-android-arm64:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-linux-android
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-android-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-android-arm64-
      - name: Build mdix-ffi (android-arm64)
        run: cargo build -p mdix-ffi --release --target aarch64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-arm64
          path: target/aarch64-linux-android/release/libmdix_ffi.so
          if-no-files-found: error

  build-native-android-arm:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: armv7-linux-androideabi
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-android-arm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-android-arm-
      - name: Build mdix-ffi (android-arm)
        run: cargo build -p mdix-ffi --release --target armv7-linux-androideabi
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-arm
          path: target/armv7-linux-androideabi/release/libmdix_ffi.so
          if-no-files-found: error

  build-native-android-x64:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-linux-android
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-android-x64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-android-x64-
      - name: Build mdix-ffi (android-x64)
        run: cargo build -p mdix-ffi --release --target x86_64-linux-android
      - uses: actions/upload-artifact@v4
        with:
          name: native-android-x64
          path: target/x86_64-linux-android/release/libmdix_ffi.so
          if-no-files-found: error

  # ── 2. Pack, Test, and Publish Job ───────────────────────────────────────

  pack-test-and-publish:
    needs: [
      confirm-trigger,
      build-native-linux-x64,
      build-native-linux-arm64,
      build-native-win-x64,
      build-native-win-x86,
      build-native-osx-x64,
      build-native-osx-arm64,
      build-native-android-arm64,
      build-native-android-arm,
      build-native-android-x64
    ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - uses: dtolnay/rust-toolchain@stable
      
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-cli-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-cli-

      # ── Download all native binaries into runtimes/ folder ──────────────
      - name: Download Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-natives

      - name: Organize Native Binaries into Runtimes Structure
        run: |
          R="mdix-csharp/src/MidManStudio.Mdix.Core/runtimes"
          mkdir -p "$R/win-x64/native"
          mkdir -p "$R/win-x86/native"
          mkdir -p "$R/linux-x64/native"
          mkdir -p "$R/linux-arm64/native"
          mkdir -p "$R/osx-x64/native"
          mkdir -p "$R/osx-arm64/native"
          mkdir -p "$R/android-arm64/native"
          mkdir -p "$R/android-arm/native"
          mkdir -p "$R/android-x64/native"

          cp downloaded-natives/native-win-x64/mdix_ffi.dll             "$R/win-x64/native/" || true
          cp downloaded-natives/native-win-x86/mdix_ffi.dll             "$R/win-x86/native/" || true
          cp downloaded-natives/native-linux-x64/libmdix_ffi.so         "$R/linux-x64/native/" || true
          cp downloaded-natives/native-linux-arm64/libmdix_ffi.so       "$R/linux-arm64/native/" || true
          cp downloaded-natives/native-osx-x64/libmdix_ffi.dylib        "$R/osx-x64/native/" || true
          cp downloaded-natives/native-osx-arm64/libmdix_ffi.dylib      "$R/osx-arm64/native/" || true
          cp downloaded-natives/native-android-arm64/libmdix_ffi.so     "$R/android-arm64/native/" || true
          cp downloaded-natives/native-android-arm/libmdix_ffi.so       "$R/android-arm/native/" || true
          cp downloaded-natives/native-android-x64/libmdix_ffi.so       "$R/android-x64/native/" || true

          echo "Organized runtimes layout:"
          find "$R" -type f

      # ── Build CLI + generate test fixtures ──────────────────────────────
      - name: Build mdix-cli
        run: cargo build -p mdix-cli --release

      - name: Generate enum-only DLM test fixtures
        run: |
          set -e
          MDIX="target/release/mdix"
          SRC="mdix_files/tests/dlm"
          OUT="$(mktemp -d)"
          DST="mdix-csharp/tests/MidManStudio.Mdix.Core.Tests/fixtures/enum_dlm"
          mkdir -p "$DST"

          for name in 11_enum_only_gzip 12_enum_only_aes256 13_enum_only_gzip_aes256; do
            "$MDIX" compile "$SRC/$name.mdix" -o "$OUT"
            cp "$OUT/$name.mdix.enc" "$DST/"
            cp "$OUT/$name.mdix.key" "$DST/"
          done

      - name: Restore and Build Solution
        run: |
          dotnet restore mdix-csharp/MidManStudio.Mdix.sln
          dotnet build mdix-csharp/MidManStudio.Mdix.sln --configuration Release

      # ── Copy native library next to test output to prevent DllNotFoundException ──
      - name: Copy native library to test output directory
        run: |
          TEST_OUT="mdix-csharp/tests/MidManStudio.Mdix.Core.Tests/bin/Release/net7.0"
          mkdir -p "$TEST_OUT"
          cp downloaded-natives/native-linux-x64/libmdix_ffi.so "$TEST_OUT/libmdix_ffi.so"
          cp downloaded-natives/native-linux-x64/libmdix_ffi.so "$TEST_OUT/mdix_ffi.so"

      - name: Run Tests
        run: |
          dotnet test mdix-csharp/MidManStudio.Mdix.sln \
            --no-build \
            --configuration Release \
            --verbosity normal

      # ── Pack NuGet Package ──────────────────────────────────────────────
      - name: Pack NuGet Package
        run: |
          dotnet pack mdix-csharp/MidManStudio.Mdix.sln \
            --no-build \
            --configuration Release \
            -o nupkg-output

      # ── Push to NuGet (using API Key) ───────────────────────────────────
      - name: Push to NuGet
        run: |
          dotnet nuget push "nupkg-output/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

      # ── Create GitHub Release ───────────────────────────────────────────
      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" mdix-csharp/src/MidManStudio.Mdix.Core/MidManStudio.Mdix.Core.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: MidManStudio.Mdix-v${{ steps.version.outputs.version }}
          name: MidManStudio.Mdix v${{ steps.version.outputs.version }}
          files: nupkg-output/*.nupkg
          body: |
            Automated release of **MidManStudio.Mdix** v${{ steps.version.outputs.version }}.
            Available on [NuGet.org](https://www.nuget.org/packages/MidManStudio.Mdix/${{ steps.version.outputs.version }}).
