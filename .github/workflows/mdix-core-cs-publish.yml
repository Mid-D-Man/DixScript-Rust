name: MidManStudio.Mdix — Core NuGet Tests

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'csharp/**'
      - '.github/workflows/mdix-core-cs-publish.yml'
      - '.github/mdix-core-test-template.html'
  pull_request:
    branches: [master, main]
    paths:
      - 'csharp/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Build and test ──────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # MdixNative.cs is generated by cargo. For managed-only CI we create a
      # minimal stub so the project compiles. Native tests are all marked Skip.
      - name: Create MdixNative.cs stub (no Rust toolchain needed)
        run: |
          mkdir -p csharp/src/MidManStudio.Mdix.Core/Generated
          cat > csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs << 'EOF'
          // <auto-generated>
          // Stub generated by CI for managed-only builds.
          // Run 'cargo build -p mdix-ffi' to generate the real file.
          // </auto-generated>
          #pragma warning disable CS8500
          #pragma warning disable CS8981
          using System;
          using System.Runtime.InteropServices;

          namespace MidManStudio.DixScript.Native
          {
              internal static unsafe partial class MdixNative
              {
          #if UNITY_IOS && !UNITY_EDITOR
                  const string __DllName = "__Internal";
          #else
                  const string __DllName = "mdix_ffi";
          #endif
                  [DllImport(__DllName, EntryPoint = "mdix_version", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_version();
                  [DllImport(__DllName, EntryPoint = "mdix_load", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_load(byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_load_str", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_load_str(byte* source);
                  [DllImport(__DllName, EntryPoint = "mdix_load_encrypted", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_load_encrypted(byte* enc_path, byte* key_path);
                  [DllImport(__DllName, EntryPoint = "mdix_load_encrypted_password", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_load_encrypted_password(byte* enc_path, byte* password);
                  [DllImport(__DllName, EntryPoint = "mdix_load_encrypted_bytes", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_load_encrypted_bytes(byte* encrypted_bytes, int byte_count, byte* key_file_content, byte* password);
                  [DllImport(__DllName, EntryPoint = "mdix_free", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void mdix_free(void* handle);
                  [DllImport(__DllName, EntryPoint = "mdix_is_valid", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_is_valid(void* handle);
                  [DllImport(__DllName, EntryPoint = "mdix_entry_count", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern int mdix_entry_count(void* handle);
                  [DllImport(__DllName, EntryPoint = "mdix_get_type", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern MdixType mdix_get_type(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_array_length", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern int mdix_get_array_length(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_string", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_get_string(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_int", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern int mdix_get_int(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_float", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern float mdix_get_float(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_double", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern double mdix_get_double(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_bool", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_get_bool(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_enum_name", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_get_enum_name(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_enum_field", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_get_enum_field(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_json", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_get_json(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_exists", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_exists(void* handle, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_get_keys", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte** mdix_get_keys(void* handle, byte* prefix, int* out_count);
                  [DllImport(__DllName, EntryPoint = "mdix_free_string", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void mdix_free_string(byte* s);
                  [DllImport(__DllName, EntryPoint = "mdix_free_string_array", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void mdix_free_string_array(byte** arr, int count);
                  [DllImport(__DllName, EntryPoint = "mdix_get_last_error", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_get_last_error();
                  [DllImport(__DllName, EntryPoint = "mdix_clear_error", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void mdix_clear_error();
                  [DllImport(__DllName, EntryPoint = "mdix_builder_new", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void* mdix_builder_new();
                  [DllImport(__DllName, EntryPoint = "mdix_builder_free", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern void mdix_builder_free(void* builder);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_entry_count", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern int mdix_builder_entry_count(void* builder);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_clear", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_clear(void* builder);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_set_string", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_set_string(void* builder, byte* path, byte* value);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_set_int", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_set_int(void* builder, byte* path, int value);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_set_float", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_set_float(void* builder, byte* path, float value);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_set_double", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_set_double(void* builder, byte* path, double value);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_set_bool", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_set_bool(void* builder, byte* path, [MarshalAs(UnmanagedType.U1)] bool value);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_remove", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_remove(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_has_key", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_has_key(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_get_string", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_builder_get_string(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_get_int", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern int mdix_builder_get_int(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_get_float", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern float mdix_builder_get_float(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_get_double", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern double mdix_builder_get_double(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_get_bool", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_get_bool(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_save", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  [return: MarshalAs(UnmanagedType.U1)]
                  internal static extern bool mdix_builder_save(void* builder, byte* path);
                  [DllImport(__DllName, EntryPoint = "mdix_builder_to_string", CallingConvention = CallingConvention.Cdecl, ExactSpelling = true)]
                  internal static extern byte* mdix_builder_to_string(void* builder);
              }

              internal enum MdixType : int
              {
                  Unknown = -1, Null = 0, Bool = 1, Int = 2, Float = 3, Double = 4,
                  String = 5, Date = 6, Timestamp = 7, HexColor = 8, Blob = 9,
                  Regex = 10, Array = 11, Object = 12, Tuple = 13, Enum = 14,
              }
          }
          EOF

      - name: Restore dependencies
        run: dotnet restore csharp/MidManStudio.Mdix.sln

      - name: Build
        run: |
          dotnet build csharp/MidManStudio.Mdix.sln \
            --no-restore \
            --configuration Release

      - name: Run tests
        continue-on-error: true
        run: |
          dotnet test csharp/MidManStudio.Mdix.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory test-output \
            --verbosity normal \
            2>&1 | tee test-console.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Parse TRX to JSON
        env:
          BUILD_NUM:  ${{ github.run_number }}
          BRANCH:     ${{ github.ref_name }}
          COMMIT:     ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import json, os, glob, sys

          NS  = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          def q(tag): return f'{{{NS}}}{tag}'

          def parse_duration_ms(s):
              """HH:MM:SS.fffffff → int ms"""
              if not s: return 0
              try:
                  p = s.split(':')
                  if len(p) == 3:
                      return int((float(p[0])*3600 + float(p[1])*60 + float(p[2]))*1000)
              except Exception:
                  pass
              return 0

          STATUS = {'Passed': 'passed', 'Failed': 'failed', 'NotExecuted': 'ignored'}

          trx_files = glob.glob('test-output/**/*.trx', recursive=True) \
                    or glob.glob('test-output/*.trx')
          print(f"TRX files: {trx_files}")

          suites    = []
          total_dur = 0.0

          for trx in trx_files:
              root = ET.parse(trx).getroot()

              # outcome + duration + error output per test name
              res_map = {}
              for r in (root.find(q('Results')) or []):
                  name = r.attrib.get('testName', '')
                  dur  = parse_duration_ms(r.attrib.get('duration', ''))
                  out  = ''
                  out_el = r.find(q('Output'))
                  if out_el is not None:
                      err_el = out_el.find(q('ErrorInfo'))
                      if err_el is not None:
                          parts = []
                          for tag in ('Message', 'StackTrace'):
                              el = err_el.find(q(tag))
                              if el is not None and el.text:
                                  parts.append(el.text.strip())
                          out = '\n'.join(parts)
                      std = out_el.find(q('StdOut'))
                      if std is not None and std.text:
                          out = (out + '\n' + std.text.strip()).strip()
                  res_map[name] = {
                      'outcome': r.attrib.get('outcome', 'Failed'),
                      'dur_ms':  dur,
                      'output':  out,
                  }

              # group by short class name
              class_tests = {}
              for ut in (root.find(q('TestDefinitions')) or []):
                  name = ut.attrib.get('name', '')
                  tm   = ut.find(q('TestMethod'))
                  if tm is None: continue
                  cls  = tm.attrib.get('className', 'Unknown').split('.')[-1]
                  res  = res_map.get(name, {})
                  class_tests.setdefault(cls, []).append({
                      'name':        name,
                      'status':      STATUS.get(res.get('outcome', 'Failed'), 'failed'),
                      'duration_ms': res.get('dur_ms', 0),
                      'output':      res.get('output', ''),
                  })

              for cls, tests in class_tests.items():
                  dur_s = sum(t['duration_ms'] for t in tests) / 1000.0
                  total_dur += dur_s
                  suites.append({
                      'name':       cls,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur_s, 4),
                      'tests':      tests,
                  })

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)

          out = {
              'build':   os.environ.get('BUILD_NUM',  '0'),
              'branch':  os.environ.get('BRANCH',     'unknown'),
              'commit':  os.environ.get('COMMIT',     'unknown')[:8],
              'date':    os.environ.get('BUILD_DATE', ''),
              'dotnet':  '7.0',
              'summary': {
                  'total': total, 'passed': passed,
                  'failed': failed, 'ignored': ignored,
                  'duration_s': round(total_dur, 3),
              },
              'suites': suites,
          }

          with open('cs-test-results.json', 'w') as f:
              json.dump(out, f, indent=2)

          print(f"Suites:{len(suites)}  Total:{total}  Passed:{passed}  "
                f"Failed:{failed}  Ignored:{ignored}")
          if failed:
              print("FAILED:")
              for s in suites:
                  for t in s['tests']:
                      if t['status'] == 'failed':
                          print(f"  {s['name']}.{t['name']}")
          PYEOF

      - name: Build HTML report
        run: |
          cp .github/mdix-core-test-template.html cs-test-results-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  cs-test-results-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       cs-test-results-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            cs-test-results-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     cs-test-results-index.html

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-test-results-${{ github.run_number }}
          path: |
            cs-test-results.json
            cs-test-results-index.html
            test-console.txt
            test-output/
          retention-days: 30

  # ── 2. Deploy to gh-pages ──────────────────────────────────────────────────
  deploy-results:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cs-test-results-${{ github.run_number }}
          path: deploy/

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/csharp" "$WORK/csharp/builds/build_${BUILD_NUM}"
          cp deploy/cs-test-results.json       "$WORK/csharp/test-results.json"
          cp deploy/cs-test-results-index.html "$WORK/csharp/index.html"
          cp deploy/cs-test-results.json       "$WORK/csharp/builds/build_${BUILD_NUM}/test-results.json"
          cp deploy/cs-test-results-index.html "$WORK/csharp/builds/build_${BUILD_NUM}/index.html"

          # Overwrite landing page so the C# link is always present
          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "C# Core Tests — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Deployed → https://mid-d-man.github.io/DixScript-Rust/csharp/"

  # ── 3. Summary ─────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix Core — Test Summary"
          echo "============================================="
          echo "Build:  #${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Tests:  ${{ needs.build-and-test.result }}"
          echo "Deploy: ${{ needs.deploy-results.result || 'skipped' }}"
          echo ""
          echo "View: https://mid-d-man.github.io/DixScript-Rust/csharp/"
