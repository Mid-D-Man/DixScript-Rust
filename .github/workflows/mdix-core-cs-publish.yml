name: MidManStudio.Mdix — Core NuGet Tests

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Check trigger ───────────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_cs: ${{ steps.decide.outputs.run_cs }}
    steps:
      - name: Decide whether to run C# tests
        id: decide
        run: |
          RUN=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
            echo "$MSG" | grep -qiE '\-\-mdix-cs' && RUN=true || true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-cs' && RUN=true || true
          fi

          echo "run_cs=$RUN" >> $GITHUB_OUTPUT
          echo "Run C# tests: $RUN"

  # ── 2. Build FFI + test ────────────────────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_cs == 'true'

    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain + cache ─────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-mdix-cs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-mdix-cs-

      # ── Build mdix-ffi (also generates MdixNative.cs via build.rs) ─────────
      - name: Build mdix-ffi
        run: cargo build -p mdix-ffi --release

      # ── Verify generated file exists ───────────────────────────────────────
      - name: Verify MdixNative.cs was generated
        run: |
          if [ ! -f "mdix-csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs" ]; then
            echo "ERROR: MdixNative.cs was not generated by build.rs"
            exit 1
          fi
          echo "MdixNative.cs OK"
          head -5 mdix-csharp/src/MidManStudio.Mdix.Core/Generated/MdixNative.cs

      # ── .NET setup ─────────────────────────────────────────────────────────
      - name: Setup .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore dependencies
        run: dotnet restore mdix-csharp/MidManStudio.Mdix.sln

      - name: Build solution
        run: |
          dotnet build mdix-csharp/MidManStudio.Mdix.sln \
            --no-restore \
            --configuration Release

      # ── Copy native library next to the test assembly ──────────────────────
      # dotnet test loads libmdix_ffi.so via DllImport at runtime.
      # The CLR probes the directory of the executing assembly first,
      # so copying it there is the most reliable placement.
      - name: Copy libmdix_ffi.so to test output directory
        run: |
          TEST_OUT="mdix-csharp/tests/MidManStudio.Mdix.Core.Tests/bin/Release/net7.0"
          echo "Copying libmdix_ffi.so to $TEST_OUT"
          cp target/release/libmdix_ffi.so "$TEST_OUT/libmdix_ffi.so"
          # Some Linux distros also probe without the lib prefix
          cp target/release/libmdix_ffi.so "$TEST_OUT/mdix_ffi.so"
          ls -lh "$TEST_OUT/"*mdix* || true

      # ── Run tests ──────────────────────────────────────────────────────────
      - name: Run tests
        continue-on-error: true
        run: |
          dotnet test mdix-csharp/MidManStudio.Mdix.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=results.trx" \
            --results-directory test-output \
            --verbosity normal \
            2>&1 | tee test-console.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Parse TRX to JSON
        env:
          BUILD_NUM:  ${{ github.run_number }}
          BRANCH:     ${{ github.ref_name }}
          COMMIT:     ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import json, os, glob, sys

          NS  = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'
          def q(tag): return f'{{{NS}}}{tag}'

          def parse_duration_ms(s):
              if not s: return 0
              try:
                  p = s.split(':')
                  if len(p) == 3:
                      return int((float(p[0])*3600 + float(p[1])*60 + float(p[2]))*1000)
              except Exception:
                  pass
              return 0

          STATUS = {'Passed': 'passed', 'Failed': 'failed', 'NotExecuted': 'ignored'}

          trx_files = glob.glob('test-output/**/*.trx', recursive=True) \
                    or glob.glob('test-output/*.trx')
          print(f"TRX files: {trx_files}")

          suites    = []
          total_dur = 0.0

          for trx in trx_files:
              root = ET.parse(trx).getroot()

              skip_reasons = {}
              for ut in (root.find(q('TestDefinitions')) or []):
                  tid = ut.attrib.get('id', '')
                  tm  = ut.find(q('TestMethod'))
                  if tm is None:
                      continue
                  desc = ut.attrib.get('description', '').strip()
                  if desc:
                      skip_reasons[tid] = desc

              res_map = {}
              for r in (root.find(q('Results')) or []):
                  tid     = r.attrib.get('testId', '')
                  name    = r.attrib.get('testName', '')
                  dur     = parse_duration_ms(r.attrib.get('duration', ''))
                  outcome = r.attrib.get('outcome', 'Failed')
                  out     = ''

                  out_el = r.find(q('Output'))
                  if out_el is not None:
                      err_el = out_el.find(q('ErrorInfo'))
                      if err_el is not None:
                          parts = []
                          for tag in ('Message', 'StackTrace'):
                              el = err_el.find(q(tag))
                              if el is not None and el.text:
                                  parts.append(el.text.strip())
                          out = '\n'.join(parts)
                      std = out_el.find(q('StdOut'))
                      if std is not None and std.text:
                          out = (out + '\n' + std.text.strip()).strip()

                  if outcome == 'NotExecuted' and not out:
                      out = skip_reasons.get(tid, '')

                  res_map[name] = {
                      'outcome': outcome,
                      'dur_ms':  dur,
                      'output':  out,
                  }

              class_tests = {}
              for ut in (root.find(q('TestDefinitions')) or []):
                  name = ut.attrib.get('name', '')
                  tm   = ut.find(q('TestMethod'))
                  if tm is None:
                      continue
                  cls  = tm.attrib.get('className', 'Unknown').split('.')[-1]
                  res  = res_map.get(name, {})
                  class_tests.setdefault(cls, []).append({
                      'name':        name,
                      'status':      STATUS.get(res.get('outcome', 'Failed'), 'failed'),
                      'duration_ms': res.get('dur_ms', 0),
                      'output':      res.get('output', ''),
                  })

              for cls, tests in class_tests.items():
                  dur_s = sum(t['duration_ms'] for t in tests) / 1000.0
                  total_dur += dur_s
                  suites.append({
                      'name':       cls,
                      'passed':     sum(1 for t in tests if t['status'] == 'passed'),
                      'failed':     sum(1 for t in tests if t['status'] == 'failed'),
                      'ignored':    sum(1 for t in tests if t['status'] == 'ignored'),
                      'duration_s': round(dur_s, 4),
                      'tests':      tests,
                  })

          total   = sum(s['passed'] + s['failed'] + s['ignored'] for s in suites)
          passed  = sum(s['passed']  for s in suites)
          failed  = sum(s['failed']  for s in suites)
          ignored = sum(s['ignored'] for s in suites)

          out = {
              'build':   os.environ.get('BUILD_NUM',  '0'),
              'branch':  os.environ.get('BRANCH',     'unknown'),
              'commit':  os.environ.get('COMMIT',     'unknown')[:8],
              'date':    os.environ.get('BUILD_DATE', ''),
              'dotnet':  '7.0',
              'summary': {
                  'total': total, 'passed': passed,
                  'failed': failed, 'ignored': ignored,
                  'duration_s': round(total_dur, 3),
              },
              'suites': suites,
          }

          with open('cs-test-results.json', 'w') as f:
              json.dump(out, f, indent=2)

          print(f"Suites:{len(suites)}  Total:{total}  Passed:{passed}  "
                f"Failed:{failed}  Ignored:{ignored}")
          if failed:
              print("FAILED:")
              for s in suites:
                  for t in s['tests']:
                      if t['status'] == 'failed':
                          print(f"  {s['name']}.{t['name']}")
          PYEOF

      - name: Build HTML report
        run: |
          cp .github/mdix-core-test-template.html cs-test-results-index.html
          sed -i "s/BUILD_NUM_PLACEHOLDER/${{ github.run_number }}/g"  cs-test-results-index.html
          sed -i "s/BRANCH_PLACEHOLDER/${{ github.ref_name }}/g"       cs-test-results-index.html
          sed -i "s/COMMIT_PLACEHOLDER/${GITHUB_SHA:0:8}/g"            cs-test-results-index.html
          sed -i "s|DATE_PLACEHOLDER|$(date -u)|g"                     cs-test-results-index.html

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-test-results-${{ github.run_number }}
          path: |
            cs-test-results.json
            cs-test-results-index.html
            test-console.txt
            test-output/
          retention-days: 30

  # ── 3. Deploy to gh-pages ──────────────────────────────────────────────────
  deploy-results:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: cs-test-results-${{ github.run_number }}
          path: deploy/

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/csharp" "$WORK/csharp/builds/build_${BUILD_NUM}"
          cp deploy/cs-test-results.json       "$WORK/csharp/test-results.json"
          cp deploy/cs-test-results-index.html "$WORK/csharp/index.html"
          cp deploy/cs-test-results.json       "$WORK/csharp/builds/build_${BUILD_NUM}/test-results.json"
          cp deploy/cs-test-results-index.html "$WORK/csharp/builds/build_${BUILD_NUM}/index.html"

          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "C# Core Tests — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Deployed → https://mid-d-man.github.io/DixScript-Rust/csharp/"

  # ── 4. Summary ─────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-test, deploy-results]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix Core — Test Summary"
          echo "============================================="
          echo "Build:    #${{ github.run_number }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Trigger:  ${{ github.event_name }}"
          echo "CS tests: ${{ needs.build-and-test.result  || 'skipped' }}"
          echo "Deploy:   ${{ needs.deploy-results.result  || 'skipped' }}"
          echo ""
          if [ "${{ needs.parse-trigger.outputs.run_cs }}" != "true" ]; then
            echo "Skipped — commit message did not contain --mdix-cs"
          fi
          echo ""
          echo "View: https://mid-d-man.github.io/DixScript-Rust/csharp/"
