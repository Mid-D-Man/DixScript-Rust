name: Publish midmanstudio-mdix to PyPI

# Manual only (Actions tab -> Run workflow) — requires typing "publish" in
# the confirmation input, so this can't fire by an accidental click, same
# gating a-publish-dixscript-crate.yml already uses for crates.io and
# mdix-core-cs-nuget-publish.yml uses for NuGet.
#
# Authenticates using PyPI Trusted Publishers (OIDC) — no API tokens required.
# As long as the PyPI pending publisher is configured for this exact repository
# and workflow filename, the upload will succeed and automatically create the project.
#
# Builds wheels on all 3 OSes maturin/pyo3 need a real build environment
# for (can't cross-compile a compiled-extension wheel from Linux alone the
# way mdix-ffi's cdylib can be cross-compiled) — mirrors
# mdix-core-cs-nuget-publish.yml's linux-x64/win-x64/osx-arm64 split.
#
# ── GitHub Release ───────────────────────────────────────────────────────
# After a successful PyPI upload, tags "mdix-python-v<version>" and creates
# a GitHub Release — same reasoning a-publish-dixscript-crate.yml and
# wasm-npm-publish.yml already document: the registry upload and the
# GitHub Release are entirely separate systems, so this is the step that
# makes the release visible/discoverable on the repo itself. No per-package
# CHANGELOG.md exists yet for mdix-python, so (matching wasm-npm-publish.yml,
# which has the same gap for mdix-npm) the release notes are a generic note
# + PyPI link rather than a changelog excerpt.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. PyPI does not allow re-uploading the same version once it is live — only yanking, which hides it from new installs but does not remove it. Bump version in mdix-python/pyproject.toml first if this is a new release.'
        required: true

permissions:
  contents: write   # needed to create the tag + GitHub Release below
  actions: read
  id-token: write   # REQUIRED for PyPI Trusted Publisher (OIDC) authentication

jobs:
  confirm-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual trigger
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

  build-wheel:
    needs: confirm-trigger
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheel-linux-x64
          - os: windows-latest
            artifact: wheel-win-x64
          - os: macos-latest
            artifact: wheel-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel (release)
        run: |
          maturin build --release --out dist --manifest-path mdix-python/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  test-before-publish:
    needs: confirm-trigger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-py-publish-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-py-publish-test-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Same reasoning as python-publish.yml's identical step: needed for
      # test_enum_dlm.py, must run before pytest below. Belt-and-suspenders
      # here too -- python-publish.yml already runs the full suite on every
      # push, but this re-checks the exact commit about to be published.
      - name: Build mdix-cli
        run: cargo build -p mdix-cli --release

      - name: Generate enum-only DLM test fixtures
        run: |
          set -e
          MDIX="target/release/mdix"
          SRC="mdix_files/tests/dlm"
          OUT="$(mktemp -d)"
          DST="mdix-python/tests/fixtures/enum_dlm"
          mkdir -p "$DST"
          for name in 11_enum_only_gzip 12_enum_only_aes256 13_enum_only_gzip_aes256; do
            "$MDIX" compile "$SRC/$name.mdix" -o "$OUT"
            cp "$OUT/$name.mdix.enc" "$DST/"
            cp "$OUT/$name.mdix.key" "$DST/"
          done

      - name: Install maturin
        run: pip install maturin

      - name: Build + install wheel for testing
        run: |
          maturin build --release --out dist --manifest-path mdix-python/Cargo.toml
          pip install dist/midmanstudio_mdix-*.whl
          pip install pytest>=7.0 numpy>=1.21 pandas>=1.3

      - name: Run pytest
        run: python -m pytest mdix-python/tests/ -v

  publish:
    needs: [confirm-trigger, build-wheel, test-before-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: List wheels to publish
        run: ls -lh dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: pip install twine

      - name: Verify wheel metadata (still no upload yet)
        run: twine check dist/*.whl

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      # ── GitHub Release ────────────────────────────────────────────────────
      # PyPI and GitHub Releases are entirely separate systems -- the twine
      # upload above only pushes to the registry. See the header comment
      # for why the notes here are a generic note + PyPI link rather than
      # a changelog excerpt.
      - name: Read package version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' mdix-python/pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published midmanstudio-mdix v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mdix-python-v${{ steps.version.outputs.version }}" \
            --title "midmanstudio-mdix v${{ steps.version.outputs.version }}" \
            --notes "midmanstudio-mdix v${{ steps.version.outputs.version }} — published to PyPI: https://pypi.org/project/midmanstudio-mdix/${{ steps.version.outputs.version }}/" \
            --target "${{ github.sha }}"
