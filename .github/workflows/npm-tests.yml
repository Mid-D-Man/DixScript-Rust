name: MidManStudio.Mdix — npm Tests

# Manual only (Actions tab -> Run workflow). This is deliberately separate
# from wasm-npm-publish.yml: that workflow's own "Run mdix-npm test suite"
# step only ever runs when someone types "publish" and means it. This one
# is meant to be run often — after any change to mdix-npm/src or
# mdix-npm/tests — without needing to go anywhere near the publish gate.
# Same idea as wasm-test.yml (tests mdix-wasm's Rust/wasm-bindgen layer)
# and python-publish.yml (tests mdix-python) already give their bindings —
# mdix-npm was the one wrapper with no CI path to its own tests that
# didn't also mean "and then actually publish if it passes."
#
# Scope: this only runs mdix-npm's own test suite (currently just
# tests/enum-mixed-data.test.mjs, exercising the tryGet/unwrap
# Result-wrapping layer that's actually unique to this package) against a
# freshly built dist/. It does NOT re-run mdix-wasm's own
# #[wasm_bindgen_test] suite — that's wasm-test.yml's job, and duplicating
# a headless-Chrome run here for code this workflow doesn't touch would
# just slow this down for no benefit.
#
# Reporting is deliberately lighter than wasm-test.yml/python-publish.yml's
# JSON + HTML-dashboard + gh-pages-deploy treatment — a plain pass/fail
# job summary and the raw log as an artifact. Happy to add the same
# dashboard treatment later if it's actually wanted; this covers the
# "nothing tests mdix-npm on its own" gap without inventing a new
# `.github/npm-test-template.html` nobody asked for yet.

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-npm-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-npm-test-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # mdix-npm/src/index.ts imports directly from ../wasm-pkg/mdix_wasm.js
      # — has to exist before `npm run build:ts` (and therefore before the
      # tests, which import from the built dist/) can succeed.
      #
      # --target nodejs, NOT --target bundler, deliberately diverges from
      # mdix-npm/package.json's own `build:wasm` script and from
      # wasm-npm-publish.yml's "Step 1" build — both of those build
      # --target bundler because that's what actually ships in the
      # published tarball. --target bundler's glue does a static
      # `import * as wasm from './mdix_wasm_bg.wasm'`, which only a real
      # bundler (webpack/vite/rollup) can resolve — plain Node has no
      # loader for `.wasm` as an ES module and throws
      # ERR_UNKNOWN_FILE_EXTENSION trying (that's the failure this fixes).
      # --target nodejs emits CommonJS glue that reads the .wasm file via
      # `fs.readFileSync` at require-time instead, which plain `node --test`
      # can load with no bundler involved — and Node's ESM loader can still
      # pull named exports (MdixDatabase, tryGet's dependencies, etc.) out
      # of that CJS module via static analysis, so index.ts's
      # `import { ... } from "../wasm-pkg/mdix_wasm.js"` doesn't need to
      # change. The .d.ts shape wasm-bindgen emits is the same regardless
      # of target, so `npm run build:ts` type-checks identically either way.
      #
      # This only affects the throwaway wasm-pkg/ built inside this job —
      # it never touches what gets published. See the "final overview"
      # writeup for the separate, unresolved question of whether the
      # actual --target bundler package needs a Node-compatible build too
      # before a plain (non-bundler) Node consumer can use it at all.
      - name: Build WASM crate — nodejs target (test-only, NOT what gets published)
        run: |
          wasm-pack build mdix-wasm \
            --target nodejs \
            --release \
            --out-dir "$GITHUB_WORKSPACE/mdix-npm/wasm-pkg" \
            --out-name mdix_wasm

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript dependencies
        run: npm install
        working-directory: mdix-npm

      - name: Build TypeScript wrapper
        run: npm run build:ts
        working-directory: mdix-npm

      # Node picks the TAP reporter automatically on a non-TTY stdout (which
      # CI always is), but it's requested explicitly here anyway — this is
      # the one thing the pass/fail summary below actually parses, so it
      # shouldn't depend on an auto-detection default silently changing
      # out from under it in some future Node version.
      - name: Run mdix-npm test suite
        continue-on-error: true
        run: |
          node --test --test-reporter=tap --test-reporter-destination=stdout tests/ \
            2>&1 | tee ../npm-test-console.txt
          echo "TEST_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
        working-directory: mdix-npm

      - name: Parse TAP output and write job summary
        if: always()
        run: |
          python3 - << 'PYEOF'
          import re

          try:
              with open("npm-test-console.txt") as f:
                  raw = f.read()
          except FileNotFoundError:
              raw = ""

          # Node nests each individual test() under its file as an indented
          # TAP subtest, so plain ^ok/^not ok lines (no leading whitespace)
          # only ever catch the file-level wrapper, not the actual cases.
          # The "# tests/# pass/# fail" comment lines are Node's own final
          # rollup, always unindented, always present once at the very end
          # of a full run — that's what's actually counted here. The
          # indented "not ok" lines are only used below to list names.
          total_match  = re.search(r'^# tests (\d+)$', raw, re.MULTILINE)
          pass_match   = re.search(r'^# pass (\d+)$',  raw, re.MULTILINE)
          fail_match   = re.search(r'^# fail (\d+)$',  raw, re.MULTILINE)
          not_ok_lines = re.findall(r'^\s*not ok \d+ - (.+)$', raw, re.MULTILINE)

          total  = int(total_match.group(1)) if total_match else 0
          passed = int(pass_match.group(1))  if pass_match  else 0
          failed = int(fail_match.group(1))  if fail_match  else len(not_ok_lines)

          lines = ["## mdix-npm test summary", ""]
          lines.append(f"- Total: {total}")
          lines.append(f"- Passed: {passed}")
          lines.append(f"- Failed: {failed}")
          lines.append("")

          if not_ok_lines:
              lines.append("**Failed:**")
              for name in not_ok_lines:
                  lines.append(f"- {name}")
          elif total == 0:
              lines.append("No TAP result lines parsed — see the raw console output in the uploaded artifact; either every test failed before producing output, or the reporter format didn't match what this parser expects.")
          else:
              lines.append("All tests passed.")

          with open("npm-test-summary.md", "w") as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          PYEOF

      - name: Write to job summary
        if: always()
        run: cat npm-test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-test-results-${{ github.run_number }}
          path: |
            npm-test-console.txt
            npm-test-summary.md
          retention-days: 30

      # Same reasoning as wasm-test.yml / python-publish.yml's identical
      # final step: continue-on-error above exists so the parse/summary/
      # upload steps still run on a failing suite; this re-check at the
      # end is what actually turns that back into a real job failure.
      - name: Fail if the test suite actually failed
        if: always()
        run: |
          if [ "${TEST_EXIT:-0}" != "0" ]; then
            echo "::error::mdix-npm test suite failed — see the job summary or npm-test-console.txt in the uploaded artifacts."
            exit 1
          fi
