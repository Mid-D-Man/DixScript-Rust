name: MidManStudio.Mdix — Odin Package Release

# Odin has no central package registry either (odin-lang's community
# "Odin Package Manager" isn't official, and this project doesn't depend
# on it) — Odin packages are normally consumed by cloning/vendoring the
# source directly, and mdix-odin's foreign import needs a prebuilt
# libmdix_ffi per platform sitting next to it either way. Same situation
# as mdix-go (see go-release.yml, which this mirrors): "publish" means
# build every platform's native lib, verify the package actually checks
# and tests clean against one of them for real, then attach a ready-to-use
# archive (source + prebuilt libs) to a tagged GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (no leading v)"
        required: true
      dry_run:
        description: "Build and verify only — skip creating the GitHub Release"
        required: false
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Build native libs — one job per platform, mirrors go-release.yml ───
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-amd64-odin-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-amd64-odin-ffi-
      - name: Build FFI — linux-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-unknown-linux-gnu
      - name: Collect
        run: |
          mkdir -p out/linux-amd64
          cp target/x86_64-unknown-linux-gnu/release/libmdix_ffi.so out/linux-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lib-linux-amd64
          path: out/
          retention-days: 1

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-arm64-odin-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-arm64-odin-ffi-
      - name: Build FFI — linux-arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p mdix-ffi --release --target aarch64-unknown-linux-gnu
      - name: Collect
        run: |
          mkdir -p out/linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/libmdix_ffi.so out/linux-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lib-linux-arm64
          path: out/
          retention-days: 1

  build-darwin-amd64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: darwin-amd64-odin-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: darwin-amd64-odin-ffi-
      - name: Build FFI — darwin-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out/darwin-amd64
          cp target/x86_64-apple-darwin/release/libmdix_ffi.dylib out/darwin-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lib-darwin-amd64
          path: out/
          retention-days: 1

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: darwin-arm64-odin-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: darwin-arm64-odin-ffi-
      - name: Build FFI — darwin-arm64
        run: cargo build -p mdix-ffi --release --target aarch64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out/darwin-arm64
          cp target/aarch64-apple-darwin/release/libmdix_ffi.dylib out/darwin-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lib-darwin-arm64
          path: out/
          retention-days: 1

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-amd64-odin-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-amd64-odin-ffi-
      - name: Build FFI — windows-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-pc-windows-msvc
      - name: Collect
        shell: bash
        run: |
          mkdir -p out/windows-amd64
          cp target/x86_64-pc-windows-msvc/release/mdix_ffi.dll out/windows-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: odin-lib-windows-amd64
          path: out/
          retention-days: 1

  # ── 2. Verify — real odin check + odin test against the freshly-built
  #      linux-amd64 lib, same rigor as odin-ci.yml, not a rubber stamp ──────
  verify:
    runs-on: ubuntu-latest
    needs: [build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: odin-lib-linux-amd64
          path: native-linux-amd64/

      - name: Install Odin (nightly)
        env:
          ODIN_TAG: dev-2026-08
        run: |
          curl -sL "https://github.com/odin-lang/Odin/releases/download/${ODIN_TAG}/odin-linux-amd64-${ODIN_TAG}.tar.gz" -o odin.tar.gz
          mkdir -p /opt/odin
          tar xzf odin.tar.gz -C /opt/odin --strip-components=1
          echo "/opt/odin" >> $GITHUB_PATH
          echo "ODIN_ROOT=/opt/odin" >> $GITHUB_ENV

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang

      - name: odin check
        run: |
          odin check mdix-odin/mdix_ffi -no-entry-point
          odin check mdix-odin/mdix -no-entry-point

      - name: odin test
        run: |
          LIBDIR="$(pwd)/native-linux-amd64/linux-amd64"
          odin test mdix-odin/mdix/tests -extra-linker-flags:"-L${LIBDIR} -Wl,-rpath,${LIBDIR}"

  # ── 3. Assemble the release archive ───────────────────────────────────────
  assemble:
    runs-on: ubuntu-latest
    needs: [verify, build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, build-windows-amd64]
    outputs:
      archive_name: ${{ steps.pack.outputs.archive_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: odin-lib-*
          path: native/
          merge-multiple: false

      - name: Assemble package directory
        run: |
          PKG="mdix-odin-v${{ inputs.version }}"
          mkdir -p "$PKG"
          cp -r mdix-odin/. "$PKG/"
          mkdir -p "$PKG/lib"

          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            mkdir -p "$PKG/lib/$plat"
            cp native/odin-lib-$plat/$plat/* "$PKG/lib/$plat/"
          done

          find "$PKG" -maxdepth 3 -type d | sort
          echo "PKG_DIR=$PKG" >> $GITHUB_ENV

      - name: Verify every platform lib is present
        run: |
          PKG="mdix-odin-v${{ inputs.version }}"
          MISSING=0
          for f in \
            "lib/linux-amd64/libmdix_ffi.so" \
            "lib/linux-arm64/libmdix_ffi.so" \
            "lib/darwin-amd64/libmdix_ffi.dylib" \
            "lib/darwin-arm64/libmdix_ffi.dylib" \
            "lib/windows-amd64/mdix_ffi.dll"
          do
            if [ ! -f "$PKG/$f" ]; then
              echo "MISSING: $f"; MISSING=$((MISSING+1))
            else
              echo "OK: $f"
            fi
          done
          [ $MISSING -eq 0 ] || { echo "ERROR: $MISSING platform lib(s) missing"; exit 1; }

      - name: Write build metadata
        run: |
          PKG="mdix-odin-v${{ inputs.version }}"
          cat > "$PKG/build-info.json" << EOF
          {
            "version": "${{ inputs.version }}",
            "build":   "${{ github.run_number }}",
            "commit":  "${GITHUB_SHA:0:8}",
            "date":    "$(date -u --iso-8601=seconds)"
          }
          EOF

      - name: Create archive
        id: pack
        run: |
          PKG="mdix-odin-v${{ inputs.version }}"
          ARCHIVE="mdix-odin-v${{ inputs.version }}.tar.gz"
          tar czf "$ARCHIVE" "$PKG"
          ls -lh "$ARCHIVE"
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: mdix-odin-release-${{ inputs.version }}
          path: mdix-odin-v${{ inputs.version }}.tar.gz
          retention-days: 90

  # ── 4. Tag + GitHub Release (skipped entirely when dry_run: true) ────────
  release:
    runs-on: ubuntu-latest
    needs: assemble
    if: inputs.dry_run == 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mdix-odin-release-${{ inputs.version }}
          path: dist/

      - name: Tag
        run: |
          TAG="mdix-odin/v${{ inputs.version }}"
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"
          git tag -a "$TAG" -m "mdix-odin v${{ inputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mdix-odin/v${{ inputs.version }}"
          gh release create "$TAG" \
            "dist/${{ needs.assemble.outputs.archive_name }}" \
            --title "mdix-odin v${{ inputs.version }}" \
            --notes "Odin bindings for DixScript, v${{ inputs.version }}. Download the archive below — it bundles the prebuilt native lib for linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, and windows-amd64. Point foreign import at lib/<platform>/ (see mdix-odin/README.md inside the archive)." \
            --repo "${{ github.repository }}"

  # ── 5. Build-info page → gh-pages (always, even in dry_run) ──────────────
  deploy-page:
    runs-on: ubuntu-latest
    needs: [assemble, release]
    if: always() && needs.assemble.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          DRY="${{ inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            SUBTITLE="dry run — verify only, nothing published"
          else
            SUBTITLE="v${{ inputs.version }}"
          fi

          WORK=$(mktemp -d)
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/odin/release"
          cat > "$WORK/odin/release/index.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DixScript-Rust — Odin Package Release</title>
            <style>
              body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;
                   display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
              .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:36px 40px;max-width:520px;width:100%}
              h1{font-size:1.5rem;color:#4a9eff;margin-bottom:4px}
              .sub{color:#8b949e;font-size:0.82rem;margin-bottom:20px}
              .meta{font-size:0.78rem;color:#484f58;display:flex;flex-direction:column;gap:6px}
              a.back{display:inline-flex;color:#8b949e;text-decoration:none;margin-bottom:18px;font-size:0.78rem}
              a.dl{display:inline-block;margin-top:20px;padding:9px 20px;border-radius:7px;border:1px solid #4a9eff;color:#4a9eff;text-decoration:none;font-size:0.84rem}
            </style>
          </head>
          <body>
            <div class="card">
              <a class="back" href="../">← Odin Tests</a>
              <h1>Odin Package Release</h1>
              <p class="sub">${SUBTITLE}</p>
              <div class="meta">
                <span>Build #${{ github.run_number }}</span>
                <span>Commit ${GITHUB_SHA:0:8}</span>
                <span>Date $(date -u)</span>
              </div>
              <a class="dl" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View this run →
              </a>
            </div>
          </body>
          </html>
          HTMLEOF

          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "Odin release page — Build #${{ github.run_number }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  # ── 6. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [verify, assemble, release, deploy-page]
    if: always()
    steps:
      - run: |
          echo "============================================="
          echo "  MidManStudio.Mdix — Odin Package Release"
          echo "============================================="
          echo "Version:   ${{ inputs.version }}"
          echo "Dry run:   ${{ inputs.dry_run }}"
          echo "Verify:    ${{ needs.verify.result }}"
          echo "Assemble:  ${{ needs.assemble.result }}"
          echo "Release:   ${{ needs.release.result || 'skipped (dry_run)' }}"
          echo "Page:      ${{ needs.deploy-page.result }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo ""
            echo "Dry run only — re-run with dry_run: false to tag mdix-odin/v${{ inputs.version }} and publish the GitHub Release."
          fi
