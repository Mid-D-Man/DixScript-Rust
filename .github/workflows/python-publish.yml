name: MidManStudio.Mdix — Python Package

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write   # required for trusted PyPI publishing

jobs:

  # ── 1. Check trigger ───────────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_py: ${{ steps.decide.outputs.run_py }}
    steps:
      - name: Decide whether to run Python build
        id: decide
        run: |
          RUN=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
            echo "$MSG" | grep -qiE '\-\-mdix-py\b' && RUN=true || true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-py\b' && RUN=true || true
          fi

          echo "run_py=$RUN" >> $GITHUB_OUTPUT
          echo "Run Python build: $RUN"

  # ── 2. Build wheels — Linux (manylinux) ───────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_py == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-py-

      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          command:    build
          args:       --release --out dist --manifest-path mdix-python/Cargo.toml
          manylinux:  auto
          target:     x86_64

      - name: Upload Linux wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ github.run_number }}
          path: dist/
          retention-days: 1

  # ── 3. Build wheels — Windows ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_py == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-py-

      - name: Build Windows wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args:    --release --out dist --manifest-path mdix-python/Cargo.toml
          target:  x86_64-pc-windows-msvc

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ github.run_number }}
          path: dist/
          retention-days: 1

  # ── 4. Build wheels — macOS universal ─────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_py == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: >-
            x86_64-apple-darwin
            aarch64-apple-darwin

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-py-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-py-

      - name: Build macOS x64 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args:    --release --out dist --manifest-path mdix-python/Cargo.toml
          target:  x86_64-apple-darwin

      - name: Build macOS arm64 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args:    --release --out dist --manifest-path mdix-python/Cargo.toml
          target:  aarch64-apple-darwin

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ github.run_number }}
          path: dist/
          retention-days: 1

  # ── 5. Publish to PyPI ─────────────────────────────────────────────────────
  publish-pypi:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main'   ||
      github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/midmanstudio-mdix/

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*-${{ github.run_number }}
          path:    dist/
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args:    --non-interactive --skip-existing dist/*.whl
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Upload wheel artifacts (downloadable from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: midmanstudio-mdix-wheels-${{ github.run_number }}
          path: dist/
          retention-days: 90

  # ── 6. Summary ────────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-linux, build-windows, build-macos, publish-pypi]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix — Python Package"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo ""
          echo "Linux:   ${{ needs.build-linux.result   || 'skipped' }}"
          echo "Windows: ${{ needs.build-windows.result || 'skipped' }}"
          echo "macOS:   ${{ needs.build-macos.result   || 'skipped' }}"
          echo "PyPI:    ${{ needs.publish-pypi.result  || 'skipped' }}"
          echo ""
          if [ "${{ needs.parse-trigger.outputs.run_py }}" != "true" ]; then
            echo "Skipped — commit message did not contain --mdix-py"
          else
            echo "Install: pip install midmanstudio-mdix"
            echo "Import:  from midmanstudio.mdix import MdixDatabase"
          fi
