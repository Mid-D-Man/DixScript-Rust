name: Rust Build & Deploy (macOS Only)

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  parse-commit:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Check for --publish flag
        id: check
        run: |
          SHOULD_PUBLISH="false"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_PUBLISH="true"
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            if echo "$COMMIT_MSG" | grep -qiE '\-\-publish'; then
              SHOULD_PUBLISH="true"
            fi
          fi
          
          echo "should_publish=${SHOULD_PUBLISH}" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: macos-latest
    needs: parse-commit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Display Configuration
        run: |
          echo "=== DixScript Rust Build ==="
          rustc --version
          cargo --version
          echo "Build #${{ github.run_number }}"

      - name: Check Formatting
        continue-on-error: true
        run: cargo fmt -- --check 2>&1 | tee fmt-check.txt

      - name: Run Clippy
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.txt

      - name: Build Debug
        run: cargo build --verbose 2>&1 | tee build-debug.txt

      - name: Build Release
        run: cargo build --release --verbose 2>&1 | tee build-release.txt

      - name: Run Tests
        continue-on-error: true
        run: |
          set +e
          cargo test --verbose 2>&1 | tee test-results.txt
          TEST_EXIT_CODE=$?
          echo "TEST_EXIT_CODE=${TEST_EXIT_CODE}" >> $GITHUB_ENV
          exit 0

      - name: Run Benchmarks (Dry Run)
        continue-on-error: true
        run: cargo bench --no-run 2>&1 | tee bench-build.txt

      - name: Generate Report
        if: always()
        run: |
          mkdir -p build-reports
          
          TEST_STATUS="✅ PASSED"
          [ "${TEST_EXIT_CODE:-0}" -ne 0 ] && TEST_STATUS="⚠️ FAILED"
          
          cat > build-reports/report.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>DixScript Build #${{ github.run_number }}</title>
              <style>
                  body { font-family: system-ui; margin: 20px; background: #f5f5f5; }
                  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
                  h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
                  h2 { color: #34495e; margin-top: 30px; border-left: 4px solid #3498db; padding-left: 10px; }
                  .info { background: #ecf0f1; padding: 15px; border-radius: 5px; margin: 20px 0; }
                  pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 500px; overflow-y: auto; }
                  .section { margin: 20px 0; padding: 20px; background: #f8f9fa; border-radius: 5px; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>🦀 DixScript Rust Build Report</h1>
                  <div class="info">
                      <div><strong>Build:</strong> #${{ github.run_number }}</div>
                      <div><strong>Branch:</strong> ${{ github.ref_name }}</div>
                      <div><strong>Commit:</strong> ${{ github.sha }}</div>
                      <div><strong>Platform:</strong> macOS</div>
                      <div><strong>Tests:</strong> ${TEST_STATUS}</div>
                  </div>
                  
                  <div class="section">
                      <h2>📋 Clippy</h2>
                      <pre>
          EOF
          cat clippy.txt >> build-reports/report.html
          cat >> build-reports/report.html << 'EOF'
                      </pre>
                  </div>
                  
                  <div class="section">
                      <h2>✅ Tests</h2>
                      <pre>
          EOF
          cat test-results.txt >> build-reports/report.html
          cat >> build-reports/report.html << 'EOF'
                      </pre>
                  </div>
                  
                  <div class="section">
                      <h2>🚀 Build</h2>
                      <pre>
          EOF
          head -n 100 build-release.txt >> build-reports/report.html
          cat >> build-reports/report.html << 'EOF'
                      </pre>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-results-${{ github.run_number }}
          path: |
            build-reports/
            *.txt
          retention-days: 30

  deploy-results:
    runs-on: ubuntu-latest
    needs: [parse-commit, build-and-test]
    if: always() && needs.parse-commit.outputs.should_publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Create Index
        run: |
          mkdir -p builds/build_${{ github.run_number }}
          cp -r all-artifacts/* builds/build_${{ github.run_number }}/
          
          cat > builds/build_${{ github.run_number }}/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>DixScript Build #${{ github.run_number }}</title></head>
          <body style="font-family: system-ui; margin: 40px;">
              <h1>🦀 DixScript Build #${{ github.run_number }}</h1>
              <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
              <p><strong>Commit:</strong> ${{ github.sha }}</p>
              <p><a href="build-results-${{ github.run_number }}/build-reports/report.html">📊 View Full Report</a></p>
          </body>
          </html>
          EOF

      - name: Deploy
        run: |
          git config --global user.name "DixScript CI"
          git config --global user.email "ci@dixscript.dev"
          
          git fetch origin artifacts || true
          git checkout --orphan artifacts
          git rm -rf . || true
          
          cp -r builds/build_${{ github.run_number }}/* .
          
          git add .
          git commit -m "Build #${{ github.run_number }} [skip ci]"
          git push origin artifacts --force

  summary:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "=== Build Complete ==="
          echo "Platform: macOS only"
          echo "Build: #${{ github.run_number }}"
