name: DixScript — VS Code Extension Publish

# Deliberately its OWN workflow, not a job bolted onto vscode-build.yml:
# that file's push trigger is scoped with `paths:`, and tag pushes don't
# reliably interact with path filtering (a tag often points at a commit
# that was already pushed under a branch, so there may be no "new" file
# changes for GitHub to filter on). Publishing needs to fire on the tag
# itself, every time, so this workflow's trigger has no `paths:` and no
# `branches:` filter at all.
#
# Auth: two independent publish targets, each with its own one-time setup.
#
# Open VSX (publish-openvsx job) — no Azure, no card, ever. Just:
#   1. Log into https://open-vsx.org with GitHub (free)
#   2. Settings → Access Tokens → Generate New Token
#   3. Accept the Publisher Agreement if prompted (terms only, no payment)
#   4. npx ovsx create-namespace midmanstudio -p <token>   (one-time)
#   5. Add the token to this repo as secret OVSX_PAT
# This is what VSCodium, Gitpod, and other VS Code-compatible editors pull
# extensions from — a real, working, installable release without touching
# Azure at all.
#
# VS Code Marketplace (publish-marketplace job) — uses a classic Azure
# DevOps Personal Access Token (VSCE_PAT secret). As of early 2026, Azure
# DevOps requires linking an active Azure subscription to create a NEW
# organization, and that subscription setup requires a card for identity
# verification (Microsoft calls it "spending protection" — not meant to
# auto-charge you unless you explicitly opt into paid usage, but the card
# itself is non-negotiable at signup). No known way around this for an
# individual without a card right now. Set this job up whenever that
# stops being a blocker — it doesn't gate the Open VSX job above at all.
#   1. Create/confirm the "midmanstudio" publisher at
#      https://marketplace.visualstudio.com/manage
#   2. Generate an Azure DevOps PAT scoped to Marketplace (Manage), any
#      org, and add it to this repo as a secret named VSCE_PAT
# Also: Microsoft is retiring Azure DevOps' global PATs on 2026-12-01,
# after which this'll need to move to Entra ID / OIDC auth instead
# (`vsce publish --azure-credential`, which @vscode/vsce 3.9.2 already
# supports) — separate, more involved setup, tracked separately.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:

  # ── 1. Build the mdix-lsp binary + package the .vsix, per platform ────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vsce_target: linux-x64
            bin_name: mdix-lsp
          - os: macos-latest      # GitHub's current macos-latest is arm64
            vsce_target: darwin-arm64
            bin_name: mdix-lsp
          - os: macos-15-intel    # macOS Intel hosted runner label
            vsce_target: darwin-x64
            bin_name: mdix-lsp
          - os: windows-latest
            vsce_target: win32-x64
            bin_name: mdix-lsp.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.os }}-cargo-mdix-lsp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-mdix-lsp-

      # See vscode-build.yml for why both crates are needed: copy-binary.js
      # bundles mdix-cli's "mdix" binary alongside mdix-lsp.
      - name: Build mdix-lsp + mdix-cli (release)
        run: cargo build -p mdix-lsp -p mdix-cli --release

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        working-directory: mdix-vscode
        run: npm install

      - name: Compile + bundle binary (vscode:prepublish)
        working-directory: mdix-vscode
        run: npm run vscode:prepublish

      # Fails fast with a clear message instead of vsce's more cryptic
      # rejection if you tag before bumping package.json's version (or
      # vice versa).
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        working-directory: mdix-vscode
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG doesn't match package.json version ($PKG_VERSION)."
            echo "Bump package.json's version and re-tag before publishing."
            exit 1
          fi

      - name: Package .vsix
        working-directory: mdix-vscode
        run: npx --yes @vscode/vsce package --target ${{ matrix.vsce_target }} --no-dependencies

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: dixscript-vscode-${{ matrix.vsce_target }}
          path: mdix-vscode/*.vsix
          retention-days: 30

  # ── 2a. Open VSX — no Azure, no card, just a free Eclipse/GitHub login ────
  # This is the one that'll actually work today. Set up once:
  #   1. Log into https://open-vsx.org with your GitHub account (free)
  #   2. Settings → Access Tokens → Generate New Token
  #   3. Accept the Publisher Agreement if prompted (free, just terms)
  #   4. One-time, from anywhere with node: npx ovsx create-namespace midmanstudio -p <token>
  #   5. Add the token to this repo as secret OVSX_PAT
  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform .vsix files
        uses: actions/download-artifact@v4
        with:
          pattern: dixscript-vscode-*
          path: vsix
          merge-multiple: true

      - name: List packages about to publish
        run: ls -la vsix/

      - name: Publish to Open VSX
        working-directory: vsix
        run: npx --yes ovsx publish --packagePath *.vsix -p "${{ secrets.OVSX_PAT }}"

  # ── 2b. VS Code Marketplace — needs Azure DevOps, which now needs a card ──
  # linked for identity verification before it'll let you create a new org.
  # Separate job on purpose: if OVSX_PAT is set but VSCE_PAT isn't yet, the
  # Open VSX job above still succeeds independently of this one failing.
  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform .vsix files
        uses: actions/download-artifact@v4
        with:
          pattern: dixscript-vscode-*
          path: vsix
          merge-multiple: true

      - name: List packages about to publish
        run: ls -la vsix/

      - name: Publish to VS Code Marketplace
        working-directory: vsix
        run: npx --yes @vscode/vsce publish --packagePath *.vsix -p "${{ secrets.VSCE_PAT }}"
