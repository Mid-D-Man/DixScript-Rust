name: DixScript — VS Mac Addin Build

# CONFIRMED, not just suspected: this cannot produce a working build on
# GitHub-hosted macOS runners, full stop -- not a csproj issue, not an
# AddinInfo.cs issue, an environment issue with no code-side fix.
#
# What's actually going on: Microsoft.VisualStudioMac.Sdk's build targets
# need a real, installed copy of Visual Studio 2022 for Mac on the build
# machine to resolve MonoDevelop.Core / MonoDevelop.Ide addin references --
# `dotnet build` needs it, `vstool build` needs it even more directly since
# the vstool binary itself lives inside that app bundle. GitHub's hosted
# macOS images used to ship VS4Mac preinstalled (added by request in 2022),
# but after Microsoft retired the product (Aug 31 2024), GitHub's own
# guidance to people hitting this (actions/runner-images discussion #8212,
# April 2025) was "migrate to .NET 9 + android/ios workloads", not "here's
# how to keep building against it". As of today there's no confirmed way to
# get a real Visual Studio.app onto a hosted runner -- Microsoft no longer
# distributes it for fresh install at all.
#
# So: the "hosted-diagnostic" job below is workflow_dispatch-only (it won't
# fire on every push and spam you with failures for something that can't
# pass) and non-blocking. It's there in case GitHub ever changes this, or if
# you just want a fresh error dump without leaving your desk. The real path
# is either:
#   1. Build locally: mdix-vsmac/scripts/pack-addin.sh --release
#      (this is what you actually use, and it works on your machine because
#      your machine has the real app installed)
#   2. Register your own Mac as a self-hosted Actions runner (Settings ->
#      Actions -> Runners -> New self-hosted runner in this repo, follow the
#      setup script), then uncomment the `pack-mpack` job at the bottom.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  hosted-diagnostic:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-latest-cargo-mdix-lsp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-latest-cargo-mdix-lsp-

      - name: Build mdix-lsp (release)
        run: cargo build -p mdix-lsp --release

      - name: Bundle mdix-lsp binary into the addin
        working-directory: mdix-vsmac
        run: bash scripts/copy-binary.sh --release

      - name: Check whether Visual Studio for Mac exists on this runner
        id: check_app
        run: |
          if [ -d "/Applications/Visual Studio.app" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
            echo "Found /Applications/Visual Studio.app -- huh, that's new. Proceeding to build."
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "::warning::No /Applications/Visual Studio.app on this runner. This is the expected, confirmed state of GitHub's hosted macOS images post VS4Mac-retirement -- the build below will fail, and that's not a regression in your code. Build locally with mdix-vsmac/scripts/pack-addin.sh --release instead, or set up the self-hosted job in this workflow file."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.check_app.outputs.present == 'true'
        with:
          dotnet-version: "7.0.x"

      - name: Build MdixAddin.csproj
        if: steps.check_app.outputs.present == 'true'
        working-directory: mdix-vsmac
        run: dotnet build MdixAddin.csproj -c Release

      - name: Locate + upload build output
        if: steps.check_app.outputs.present == 'true'
        working-directory: mdix-vsmac
        run: |
          DLL=$(find bin/Release -name 'MdixLanguageSupport.dll' | head -n1)
          echo "Found: $DLL"

      - uses: actions/upload-artifact@v4
        if: steps.check_app.outputs.present == 'true'
        with:
          name: mdix-vsmac-compiled-${{ github.run_number }}
          path: mdix-vsmac/bin/Release
          retention-days: 30

  # ── The real path: build on a self-hosted runner registered from your own
  #    Mac (the one with Visual Studio 2022 for Mac actually installed).
  #    Settings -> Actions -> Runners -> New self-hosted runner in this repo
  #    gives you a short setup script to run once on that Mac. After that,
  #    uncomment this job and pushes will produce a real, downloadable
  #    .mpack via CI, built the same way pack-addin.sh builds it locally.
  #
  # pack-mpack:
  #   runs-on: [self-hosted, macos]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build + pack
  #       working-directory: mdix-vsmac
  #       run: bash scripts/pack-addin.sh --release
  #     - name: Upload .mpack
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: mdix-vsmac-mpack-${{ github.run_number }}
  #         path: mdix-vsmac/dist/*.mpack
  #         retention-days: 30
