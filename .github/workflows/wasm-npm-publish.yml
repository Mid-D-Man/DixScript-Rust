name: MidManStudio.Mdix — WASM mdix-npm publish

# Manual only (Actions tab -> Run workflow) — requires typing "publish" in
# the confirmation input, same gating a-publish-dixscript-crate.yml uses
# for crates.io, mdix-core-cs-nuget-publish.yml uses for NuGet, and
# mdix-python-pypi-publish.yml uses for PyPI. The previous version of
# this file had no confirmation input at all — workflow_dispatch would
# go straight to `npm publish` with nothing to stop an accidental click.
#
# ── Before the very first run ───────────────────────────────────────────
# @dixscript/core is a SCOPED package. As of writing, nothing has ever
# been published under the "dixscript" scope (registry.npmjs.org has no
# entry for it at all) — which means the "dixscript" npm user or
# Organization needs to already exist on npmjs.com, and NPM_TOKEN
# (Settings -> Secrets and variables -> Actions -> New repository secret)
# needs to belong to an account with publish rights to it, or the publish
# step below fails on its very first real run with a permissions/
# scope-not-found error rather than a build error. Generate the token as
# an "Automation" type specifically (npmjs.com -> your avatar -> Access
# Tokens) — a "Publish" token can prompt for a 2FA one-time code that has
# nowhere to go in CI and will just hang.
#
# ── What this actually publishes ────────────────────────────────────────
# @dixscript/core's mdix-npm/src/index.ts re-exports the full mdix-wasm/
# src/lib.rs surface: MdixDatabase, MdixBuilder, DLM compile/decompile,
# AST merge (mergeSources/mergeSourcesWeighted/mergeWith), schema
# validation (MdixSchema/validateSchema), and the content-hash watcher
# (MdixWatcher). This was previously re-exporting only MdixDatabase/
# MdixBuilder, flagged-not-fixed right here — that gap is closed now
# (including wiring MdixDatabase.validateSchema itself, which had no
# real wasm-bindgen binding at all despite being documented in
# schema.rs). See mdix-npm/README.md for the full API with examples.
#
# ── Fixed from the previous version of this file ────────────────────────
# - Added this confirm gate (previously none).
# - The publish step no longer has `continue-on-error: true` with nothing
#   downstream checking it — that combination meant a failed `npm
#   publish` (auth, scope, version-already-exists, whatever) would still
#   leave the job's overall result as "success", which is exactly what
#   silently un-published a real release would look like.
# - Added an actual test-before-publish step for both mdix-wasm
#   (wasm-pack test) and mdix-npm (node --test), matching the pattern
#   mdix-python-pypi-publish.yml already uses.
# - Added a `npm publish --dry-run` verification step, matching
#   `cargo publish --dry-run` in a-publish-dixscript-crate.yml.
# - Added GitHub Release creation after a successful publish, matching
#   a-publish-dixscript-crate.yml's tag/release step (no per-package
#   CHANGELOG.md exists yet for mdix-npm, so the release notes here are
#   a generic note + npm link rather than a changelog excerpt — add
#   mdix-npm/CHANGELOG.md later and this can be upgraded the same way).
# - Removed the branch-name / commit-message trigger-parsing logic — the
#   `on:` block below only ever declares workflow_dispatch, so that
#   parsing was dead code that could never actually fire from a push or
#   PR event; it's replaced by the confirm-trigger gate below.
# - Added a GitHub Packages mirror publish, right after the real npmjs.org
#   one — see the comment on that step for the naming/auth details, and
#   the important caveat that it is NOT anonymously installable the way
#   the npmjs.org package is, even though this repo is public.
#
# ── Known issue shipping in this version, on purpose ────────────────────
# github.com/Mid-D-Man/DixScript-Rust/issues/2 (.mdix.key's compressed_size
# always equalling original_size, encrypted_size being mislabeled) is
# still open — dixscript on crates.io is still 1.0.0, no patch published.
# compileWithDlm() here inherits that as-is. Deliberate call: fixed in the
# next core dixscript version, not blocking this one.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm. npm does not allow re-publishing the same version once it is live — only deprecating or unpublishing under a strict time limit. Bump the version in mdix-npm/package.json first if this is a new release.'
        required: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:

  # ── 1. Confirm trigger ─────────────────────────────────────────────────
  confirm-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual trigger
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "publish" ]; then
            echo "Confirmation text did not match 'publish' — aborting."
            exit 1
          fi

  # ── 2. Build, test, then publish ───────────────────────────────────────
  build-test-and-publish:
    runs-on: ubuntu-latest
    needs: confirm-trigger
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # ── mdix-wasm's own wasm-bindgen-test suite (headless Chrome), run
      # before anything is built for publishing — same reasoning as
      # mdix-python-pypi-publish.yml's test-before-publish job re-checking
      # the exact commit about to ship. continue-on-error + an explicit
      # follow-up check (not a blanket mask) — same pattern wasm-test.yml
      # already uses, so a slow/flaky Chrome step doesn't kill the whole
      # job before its own console output is captured.
      - name: Run mdix-wasm test suite (headless Chrome)
        continue-on-error: true
        run: |
          cd mdix-wasm
          wasm-pack test --headless --chrome 2>&1 | tee ../wasm-test-console.txt
          echo "TEST_EXIT=${PIPESTATUS[0]:-$?}" >> $GITHUB_ENV

      - name: Fail if mdix-wasm tests actually failed
        if: always()
        run: |
          if [ "${TEST_EXIT:-0}" != "0" ]; then
            echo "::error::mdix-wasm test suite failed — see the previous step's log. Nothing has been published."
            exit 1
          fi

      # ── Step 1: build bundler target for mdix-npm ──────────────────────
      - name: Build WASM crate — bundler target (for mdix-npm)
        run: |
          wasm-pack build mdix-wasm \
            --target bundler \
            --release \
            --out-dir "$GITHUB_WORKSPACE/mdix-npm/wasm-pkg" \
            --out-name mdix_wasm
          echo "wasm-pack bundler output:"
          ls -lh mdix-npm/wasm-pkg/

      # ── Step 2: build nodejs target for mdix-npm's Node entry point ────
      # --target bundler's JS glue does a raw `import * as X from
      # "./mdix_wasm_bg.wasm"` -- meant for an actual bundler to resolve.
      # Plain Node has no idea what to do with that and throws
      # ERR_UNKNOWN_FILE_EXTENSION on the .wasm file before any of your
      # code runs (confirmed directly, this is what "Run mdix-npm test
      # suite" below was failing on). --target nodejs loads the .wasm via
      # fs.readFileSync + WebAssembly.Instance instead, which plain Node
      # handles natively -- src/index.node.ts (-> dist/index.node.js)
      # imports from this output, and it's also what package.json's
      # "node" export condition points real `import ... from
      # "@dixscript/core"` consumers to under Node.
      - name: Build WASM crate — nodejs target (for mdix-npm's Node entry point)
        run: |
          wasm-pack build mdix-wasm \
            --target nodejs \
            --release \
            --out-dir "$GITHUB_WORKSPACE/mdix-npm/wasm-pkg-node" \
            --out-name mdix_wasm
          echo "wasm-pack nodejs output:"
          ls -lh mdix-npm/wasm-pkg-node/

      # ── Step 3: build web target for GitHub Pages playground ──────────
      # --target web produces JS that uses fetch() to load the .wasm file,
      # which works on a plain static file server (GitHub Pages).
      # --target bundler uses a static import that only bundlers understand.
      - name: Build WASM crate — web target (for GitHub Pages playground)
        run: |
          wasm-pack build mdix-wasm \
            --target web \
            --release \
            --out-dir "$GITHUB_WORKSPACE/wasm-web" \
            --out-name mdix_wasm
          echo "wasm-pack web output:"
          ls -lh wasm-web/

      # ── Step 3: build the TypeScript wrapper ──────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install TypeScript dependencies
        run: npm install
        working-directory: mdix-npm

      - name: Build TypeScript wrapper
        run: npm run build:ts
        working-directory: mdix-npm

      - name: Verify package contents
        run: |
          echo "dist/ contents:"
          ls -lh dist/ || echo "dist/ not found"
          echo "wasm-pkg/ (bundler) contents:"
          ls -lh wasm-pkg/
          echo "wasm-pkg-node/ (nodejs) contents:"
          ls -lh wasm-pkg-node/
          echo "wasm-web/ (web) contents:"
          ls -lh ../wasm-web/
        working-directory: mdix-npm

      # ── mdix-npm's own test suite, against the just-built dist/ output.
      # This is the layer that's actually unique to the npm package (the
      # tryGet/unwrap Result-wrapping helpers) — mdix-wasm's own tests
      # above already cover the underlying WASM getters directly.
      #
      # No trailing path here on purpose — `node --test tests/` (a bare
      # directory as a positional arg) throws "Cannot find module" and
      # fails before running anything, verified directly. Node's test
      # runner already auto-discovers *.test.mjs recursively from cwd with
      # no path argument at all; that's the form that actually works.
      - name: Run mdix-npm test suite
        run: node --test --test-reporter=tap
        working-directory: mdix-npm

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-mdix-npm-build-${{ github.run_number }}
          path: |
            mdix-npm/dist/
            mdix-npm/wasm-pkg/
            mdix-npm/wasm-pkg-node/
            wasm-web/
            mdix-npm/package-lock.json
          retention-days: 30

      # Packages the tarball exactly as it would be uploaded and reports
      # exactly what would go in it, without touching the registry — same
      # purpose as a-publish-dixscript-crate.yml's `cargo publish
      # --dry-run` step.
      - name: Verify npm package (dry run)
        run: npm publish --access public --dry-run
        working-directory: mdix-npm

      - name: Publish to npm
        run: npm publish --access public
        working-directory: mdix-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Mirror to GitHub Packages ────────────────────────────────────────
      # "Just in case" backup — npmjs.org above stays the real, primary
      # distribution channel; that's what `npm install @dixscript/core`
      # from anywhere in the world actually resolves against.
      #
      # GitHub Packages' npm registry enforces that a published package's
      # scope match the repository owner, so this can't just be a second
      # `npm publish` of the same package.json — @dixscript isn't
      # Mid-D-Man's GitHub namespace. Renamed just for this publish
      # (mdix-npm/package.json on disk in this checkout only — nothing
      # gets committed back). Auth is GITHUB_TOKEN, not NPM_TOKEN — no new
      # secret to configure, GitHub Packages accepts the workflow's own
      # token for a repo it belongs to.
      #
      # Caveat worth knowing before treating this as equivalent to the
      # npmjs.org package: GitHub Packages' npm registry has no anonymous
      # public install path at all, even for a public repo's public
      # package — every consumer needs their own GitHub PAT with
      # read:packages scope configured in .npmrc just to run `npm
      # install`. This is a mirror for discoverability / your own use,
      # not a second general-audience distribution channel.
      #
      # continue-on-error here on purpose: this is the backup copy, not
      # the real publish above — a failure here shouldn't undo or
      # overshadow a successful npmjs.org publish, just get flagged.
      - name: Compute GitHub Packages scope
        id: gh_scope
        run: |
          set -euo pipefail
          # npm scopes must be lowercase; github.repository_owner keeps
          # whatever case the account actually has (Mid-D-Man).
          echo "scope=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ steps.gh_scope.outputs.scope }}'

      - name: Publish mirror to GitHub Packages
        id: gh_packages_publish
        continue-on-error: true
        run: |
          set -euo pipefail
          npm pkg set name="@${{ steps.gh_scope.outputs.scope }}/dixscript-core"
          npm publish
        working-directory: mdix-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note GitHub Packages mirror outcome
        if: always()
        run: |
          if [ "${{ steps.gh_packages_publish.outcome }}" == "success" ]; then
            echo "GitHub Packages mirror: published to @${{ steps.gh_scope.outputs.scope }}/dixscript-core."
          else
            echo "::warning::GitHub Packages mirror publish failed — the real npmjs.org package above is unaffected. Check the 'Publish mirror to GitHub Packages' step's log."
          fi

      # ── GitHub Release ──────────────────────────────────────────────────
      # npm and GitHub Releases are entirely separate systems — `npm
      # publish` above only pushes to the registry. This makes the release
      # visible/discoverable on the repo itself, same reasoning as
      # a-publish-dixscript-crate.yml's release step.
      - name: Read package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published @dixscript/core v$VERSION"
        working-directory: mdix-npm

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dixscript-core-v${{ steps.version.outputs.version }}" \
            --title "@dixscript/core v${{ steps.version.outputs.version }}" \
            --notes "@dixscript/core v${{ steps.version.outputs.version }} — published to npm: https://www.npmjs.com/package/@dixscript/core/v/${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}"

  # ── 3. Deploy playground to gh-pages ─────────────────────────────────────
  deploy-wasm-page:
    runs-on: ubuntu-latest
    needs: [confirm-trigger, build-test-and-publish]
    if: always() && needs.build-test-and-publish.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-mdix-npm-build-${{ github.run_number }}
          path: deploy/

      - name: Write build metadata
        run: |
          cat > deploy/meta.json << EOF
          {
            "build":  "${{ github.run_number }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${GITHUB_SHA:0:8}",
            "date":   "$(date -u --iso-8601=seconds)"
          }
          EOF

      - name: Deploy wasm playground to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          # wasm/ directory — test page + web-target wasm output
          mkdir -p "$WORK/wasm"

          # Copy test page
          cp .github/wasm-test-page.html "$WORK/wasm/index.html"

          # Copy the --target web output (fetch-based, works on GitHub Pages).
          # These files come from wasm-web/, NOT wasm-pkg/ (which is bundler-only).
          if [ -d "deploy/wasm-web" ]; then
            cp deploy/wasm-web/mdix_wasm.js      "$WORK/wasm/mdix_wasm.js"      2>/dev/null || true
            cp deploy/wasm-web/mdix_wasm_bg.wasm "$WORK/wasm/mdix_wasm_bg.wasm" 2>/dev/null || true
            cp deploy/wasm-web/mdix_wasm.d.ts    "$WORK/wasm/mdix_wasm.d.ts"    2>/dev/null || true
            echo "Deployed web-target WASM files:"
            ls -lh "$WORK/wasm/"
          else
            echo "ERROR: wasm-web/ directory not found in deploy artifacts"
            exit 1
          fi

          # Copy build metadata so the test page can show the build number
          cp deploy/meta.json "$WORK/wasm/meta.json"

          # Update the landing page
          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "WASM playground — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Deployed → https://mid-d-man.github.io/DixScript-Rust/wasm/"

  # ── 4. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [confirm-trigger, build-test-and-publish, deploy-wasm-page]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix WASM — Build Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Build/Publish: ${{ needs.build-test-and-publish.result || 'skipped' }}"
          echo "Deploy:        ${{ needs.deploy-wasm-page.result || 'skipped' }}"
          echo ""
          echo "npm package (bundler consumers): --target bundler (wasm-pkg/)"
          echo "npm package (plain Node):        --target nodejs  (wasm-pkg-node/)"
          echo "playground:                      --target web     (wasm-web/)"
          echo ""
          echo "Playground → https://mid-d-man.github.io/DixScript-Rust/wasm/"
          echo "Package (npm, real)      → https://www.npmjs.com/package/@dixscript/core"
          echo "Package (GitHub mirror)  → https://github.com/Mid-D-Man/DixScript-Rust/pkgs/npm/dixscript-core"
