name: MidManStudio.Mdix — WASM npm publish

on:
  push:
    branches: [master, main, develop, npm-wasm]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Check trigger ───────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_wasm: ${{ steps.decide.outputs.run_wasm }}
    steps:
      - name: Decide whether to run WASM build
        id: decide
        run: |
          RUN=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.ref }}" = "refs/heads/npm-wasm" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
            echo "$MSG" | grep -qiE '\-\-mdix-wasm' && RUN=true || true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-wasm' && RUN=true || true
          fi

          echo "run_wasm=$RUN" >> $GITHUB_OUTPUT
          echo "Run WASM build: $RUN"

  # ── 2. Build WASM then npm package ────────────────────────────────────
  build-and-publish:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_wasm == 'true'

    steps:
      - uses: actions/checkout@v4

      # ── Rust + wasm-pack ───────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # ── Step 1: build the Rust WASM crate ─────────────────────────────
      - name: Build WASM crate (wasm-pack)
        run: |
          wasm-pack build mdix-wasm \
            --target bundler \
            --release \
            --out-dir ../npm/wasm-pkg \
            --out-name mdix_wasm
          echo "wasm-pack output:"
          ls -lh npm/wasm-pkg/

      # ── Step 2: build the TypeScript wrapper ──────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install TypeScript dependencies
        run: |
          npm install
        working-directory: npm

      - name: Generate package-lock.json for future runs
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "No package-lock.json found — one has been generated in the artifact."
            echo "Commit it to the repo to enable npm ci in future runs."
          fi
        working-directory: npm

      - name: Build TypeScript wrapper
        run: npm run build:ts
        working-directory: npm

      # ── Verify output ──────────────────────────────────────────────────
      - name: Verify package contents
        run: |
          echo "dist/ contents:"
          ls -lh dist/ || echo "dist/ not found"
          echo "wasm-pkg/ contents:"
          ls -lh wasm-pkg/
        working-directory: npm

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-npm-build-${{ github.run_number }}
          path: |
            npm/dist/
            npm/wasm-pkg/
            npm/package-lock.json
          retention-days: 30

      # ── Publish to npm — only when ready, on specific branches ────────
      # To publish: push to master/main/npm-wasm OR use workflow_dispatch.
      # PRs and develop branch builds are test-only — no publish.
      - name: Publish to npm
        if: |
          github.event_name != 'pull_request' &&
          github.ref != 'refs/heads/develop' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/npm-wasm' || github.event_name == 'workflow_dispatch')
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 3. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-publish]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix WASM — Build Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Result:  ${{ needs.build-and-publish.result || 'skipped' }}"
          echo ""
          if [ "${{ needs.parse-trigger.outputs.run_wasm }}" != "true" ]; then
            echo "Skipped — commit message did not contain --mdix-wasm"
          fi
          echo ""
          echo "NOTE: Publish is blocked on develop branch."
          echo "      Push to master/main/npm-wasm to publish to npm."
