name: MidManStudio.Mdix — WASM npm publish

on:
  push:
    branches: [master, main, develop, npm-wasm]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Check trigger ───────────────────────────────────────────────────
  parse-trigger:
    runs-on: ubuntu-latest
    outputs:
      run_wasm: ${{ steps.decide.outputs.run_wasm }}
    steps:
      - name: Decide whether to run WASM build
        id: decide
        run: |
          RUN=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN=true
          elif [ "${{ github.ref }}" = "refs/heads/npm-wasm" ]; then
            RUN=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            MSG="${{ github.event.pull_request.title }}"
            echo "$MSG" | grep -qiE '\-\-mdix-wasm' && RUN=true || true
          else
            MSG="${{ github.event.head_commit.message }}"
            echo "$MSG" | grep -qiE '\-\-mdix-wasm' && RUN=true || true
          fi

          echo "run_wasm=$RUN" >> $GITHUB_OUTPUT
          echo "Run WASM build: $RUN"

  # ── 2. Build WASM then npm package ────────────────────────────────────
  build-and-publish:
    runs-on: ubuntu-latest
    needs: parse-trigger
    if: needs.parse-trigger.outputs.run_wasm == 'true'

    steps:
      - uses: actions/checkout@v4

      # ── Rust + wasm-pack ───────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-latest-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-latest-cargo-wasm-

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      # ── Step 1: build the Rust WASM crate ─────────────────────────────
      - name: Build WASM crate (wasm-pack)
        run: |
          wasm-pack build mdix-wasm \
            --target bundler \
            --release \
            --out-dir ../npm/wasm-pkg \
            --out-name mdix_wasm
          echo "wasm-pack output:"
          ls -lh npm/wasm-pkg/

      # ── Step 2: build the TypeScript wrapper ──────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install TypeScript dependencies
        run: npm install
        working-directory: npm

      - name: Build TypeScript wrapper
        run: npm run build:ts
        working-directory: npm

      # ── Verify output ──────────────────────────────────────────────────
      - name: Verify package contents
        run: |
          echo "dist/ contents:"
          ls -lh dist/ || echo "dist/ not found"
          echo "wasm-pkg/ contents:"
          ls -lh wasm-pkg/
        working-directory: npm

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-npm-build-${{ github.run_number }}
          path: |
            npm/dist/
            npm/wasm-pkg/
            npm/package-lock.json
          retention-days: 30

      # ── Publish to npm — only on release branches ──────────────────────
      - name: Publish to npm
        continue-on-error: true
        if: |
          github.event_name != 'pull_request' &&
          github.ref != 'refs/heads/develop' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/npm-wasm' || github.event_name == 'workflow_dispatch')
        run: npm publish --access public
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 3. Deploy to gh-pages ──────────────────────────────────────────────
  deploy-wasm-page:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-publish]
    if: |
      always() &&
      needs.build-and-publish.result == 'success' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/npm-wasm' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-npm-build-${{ github.run_number }}
          path: deploy/

      - name: Write build metadata
        run: |
          cat > deploy/meta.json << EOF
          {
            "build":  "${{ github.run_number }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${GITHUB_SHA:0:8}",
            "date":   "$(date -u --iso-8601=seconds)"
          }
          EOF

      - name: Deploy wasm playground to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          BUILD_NUM=${{ github.run_number }}
          WORK=$(mktemp -d)

          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          # wasm/ directory — test page + wasm-pkg output
          mkdir -p "$WORK/wasm"

          # Copy test page
          cp .github/wasm-test-page.html "$WORK/wasm/index.html"

          # Copy wasm-pack output (the .wasm binary and JS glue)
          if [ -d "deploy/wasm-pkg" ]; then
            cp deploy/wasm-pkg/mdix_wasm.js     "$WORK/wasm/mdix_wasm.js"     2>/dev/null || true
            cp deploy/wasm-pkg/mdix_wasm_bg.wasm "$WORK/wasm/mdix_wasm_bg.wasm" 2>/dev/null || true
            cp deploy/wasm-pkg/mdix_wasm.d.ts   "$WORK/wasm/mdix_wasm.d.ts"   2>/dev/null || true
          fi

          # Copy build metadata so the test page can show the build number
          cp deploy/meta.json "$WORK/wasm/meta.json"

          # Update the landing page
          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "WASM playground — Build #${BUILD_NUM} [skip ci]"
          git push \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Deployed → https://mid-d-man.github.io/DixScript-Rust/wasm/"

  # ── 4. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [parse-trigger, build-and-publish, deploy-wasm-page]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================="
          echo "  MidManStudio.Mdix WASM — Build Summary"
          echo "============================================="
          echo "Build:   #${{ github.run_number }}"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Build:   ${{ needs.build-and-publish.result  || 'skipped' }}"
          echo "Deploy:  ${{ needs.deploy-wasm-page.result   || 'skipped' }}"
          echo ""
          if [ "${{ needs.parse-trigger.outputs.run_wasm }}" != "true" ]; then
            echo "Skipped — commit message did not contain --mdix-wasm"
          fi
          echo ""
          echo "Playground → https://mid-d-man.github.io/DixScript-Rust/wasm/"
          echo "NOTE: npm publish is blocked on develop branch."
