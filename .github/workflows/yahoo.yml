name: Crate Download Looper

on:
  workflow_dispatch:
    inputs:
      download_limit:
        description: 'How many times to download per runner'
        required: true
        default: '5'
        type: string
  push:
    branches: [ main ]

jobs:
  download-crate:
    name: Fetch Crate (${{ matrix.os }} - ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta]

    steps:
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Download, Delete, Repeat
        shell: bash
        run: |
          mkdir test_dir && cd test_dir
          cargo init --name test_app
          cargo add dixscript@=1.0.0
          
          # Use the input limit if triggered manually, otherwise default to 5
          LIMIT="${{ inputs.download_limit || '5' }}"
          
          for (( i=1; i<=LIMIT; i++ ))
          do
            echo "--- Download attempt $i of $LIMIT ---"
            
            # 1. Download the crate from crates.io
            cargo fetch
            
            # 2. Wipe the downloaded tarballs and extracted source code
            rm -rf ~/.cargo/registry/cache/*
            rm -rf ~/.cargo/registry/src/*
            
            # 3. Remove the lockfile so Cargo resolves it completely fresh
            rm -f Cargo.lock
          done
