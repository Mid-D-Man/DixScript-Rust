name: MidManStudio.Mdix — Zig Package Release

# Zig has no central package registry either (there's no crates.io/npm
# equivalent — `zig fetch` resolves a `.dependencies` entry from a plain
# URL or a git ref, not a hosted index) and mdix-zig's foreign import
# needs a prebuilt libmdix_ffi per platform sitting next to it either
# way. Same situation as mdix-go/mdix-odin (see odin-release.yml, which
# this mirrors): "publish" means build every platform's native lib,
# verify the package actually checks and tests clean against one of
# them for real, then attach a ready-to-use archive (source + prebuilt
# libs) to a tagged GitHub Release — plus, since Zig's package manager
# *can* point `.dependencies` straight at that archive URL via
# `zig fetch`, a real fetch-and-typecheck smoke test against the
# just-published release (see validate-fetch below), not just an
# assumption that `.paths` in build.zig.zon is correct.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (no leading v)"
        required: true
      dry_run:
        description: "Build and verify only — skip creating the GitHub Release"
        required: false
        type: choice
        default: "true"
        options: ["true", "false"]

permissions:
  contents: write
  actions: read

jobs:

  # ── 1. Build native libs — one job per platform, mirrors odin-release.yml ─
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-amd64-zig-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-amd64-zig-ffi-
      - name: Build FFI — linux-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-unknown-linux-gnu
      - name: Collect
        run: |
          mkdir -p out/linux-amd64
          cp target/x86_64-unknown-linux-gnu/release/libmdix_ffi.so out/linux-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: zig-lib-linux-amd64
          path: out/
          retention-days: 1

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-arm64-zig-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-arm64-zig-ffi-
      - name: Build FFI — linux-arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build -p mdix-ffi --release --target aarch64-unknown-linux-gnu
      - name: Collect
        run: |
          mkdir -p out/linux-arm64
          cp target/aarch64-unknown-linux-gnu/release/libmdix_ffi.so out/linux-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: zig-lib-linux-arm64
          path: out/
          retention-days: 1

  build-darwin-amd64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: darwin-amd64-zig-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: darwin-amd64-zig-ffi-
      - name: Build FFI — darwin-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out/darwin-amd64
          cp target/x86_64-apple-darwin/release/libmdix_ffi.dylib out/darwin-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: zig-lib-darwin-amd64
          path: out/
          retention-days: 1

  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: darwin-arm64-zig-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: darwin-arm64-zig-ffi-
      - name: Build FFI — darwin-arm64
        run: cargo build -p mdix-ffi --release --target aarch64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out/darwin-arm64
          cp target/aarch64-apple-darwin/release/libmdix_ffi.dylib out/darwin-arm64/
      - uses: actions/upload-artifact@v4
        with:
          name: zig-lib-darwin-arm64
          path: out/
          retention-days: 1

  build-windows-amd64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-amd64-zig-ffi-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-amd64-zig-ffi-
      - name: Build FFI — windows-amd64
        run: cargo build -p mdix-ffi --release --target x86_64-pc-windows-msvc
      - name: Collect
        shell: bash
        run: |
          mkdir -p out/windows-amd64
          cp target/x86_64-pc-windows-msvc/release/mdix_ffi.dll out/windows-amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: zig-lib-windows-amd64
          path: out/
          retention-days: 1

  # ── 2. Verify — real zig build test-ffi/test-mdix/test-behavioral against
  #      the freshly-built linux-amd64 lib, same rigor as zig-ci.yml, not a
  #      rubber stamp ──────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    needs: [build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zig-lib-linux-amd64
          path: native-linux-amd64/

      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p /opt/zig
          tar xf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> $GITHUB_PATH

      - name: zig version
        run: zig version

      - name: zig build test-ffi / test-mdix / test-behavioral
        run: |
          LIBDIR="$(pwd)/native-linux-amd64/linux-amd64"
          cd mdix-zig
          zig build test-ffi        --summary all -Dmdix-lib-path="${LIBDIR}"
          zig build test-mdix       --summary all -Dmdix-lib-path="${LIBDIR}"
          zig build test-behavioral --summary all -Dmdix-lib-path="${LIBDIR}"

  # ── 3. Assemble the release archive ───────────────────────────────────────
  assemble:
    runs-on: ubuntu-latest
    needs: [verify, build-linux-amd64, build-linux-arm64, build-darwin-amd64, build-darwin-arm64, build-windows-amd64]
    outputs:
      archive_name: ${{ steps.pack.outputs.archive_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zig-lib-*
          path: native/
          merge-multiple: false

      - name: Assemble package directory
        run: |
          PKG="mdix-zig-v${{ inputs.version }}"
          mkdir -p "$PKG"
          cp -r mdix-zig/. "$PKG/"
          mkdir -p "$PKG/lib"

          for plat in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            mkdir -p "$PKG/lib/$plat"
            cp native/zig-lib-$plat/$plat/* "$PKG/lib/$plat/"
          done

          find "$PKG" -maxdepth 3 -type d | sort
          echo "PKG_DIR=$PKG" >> $GITHUB_ENV

      - name: Verify every platform lib + source file is present
        run: |
          PKG="mdix-zig-v${{ inputs.version }}"
          MISSING=0
          for f in \
            "build.zig" \
            "build.zig.zon" \
            "README.md" \
            "lib/linux-amd64/libmdix_ffi.so" \
            "lib/linux-arm64/libmdix_ffi.so" \
            "lib/darwin-amd64/libmdix_ffi.dylib" \
            "lib/darwin-arm64/libmdix_ffi.dylib" \
            "lib/windows-amd64/mdix_ffi.dll"
          do
            if [ ! -f "$PKG/$f" ]; then
              echo "MISSING: $f"; MISSING=$((MISSING+1))
            else
              echo "OK: $f"
            fi
          done
          [ $MISSING -eq 0 ] || { echo "ERROR: $MISSING file(s) missing"; exit 1; }

      - name: Write build metadata
        run: |
          PKG="mdix-zig-v${{ inputs.version }}"
          cat > "$PKG/build-info.json" << EOF
          {
            "version": "${{ inputs.version }}",
            "build":   "${{ github.run_number }}",
            "commit":  "${GITHUB_SHA:0:8}",
            "date":    "$(date -u --iso-8601=seconds)"
          }
          EOF

      - name: Create archive
        id: pack
        run: |
          PKG="mdix-zig-v${{ inputs.version }}"
          ARCHIVE="mdix-zig-v${{ inputs.version }}.tar.gz"
          tar czf "$ARCHIVE" "$PKG"
          ls -lh "$ARCHIVE"
          echo "archive_name=$ARCHIVE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: mdix-zig-release-${{ inputs.version }}
          path: mdix-zig-v${{ inputs.version }}.tar.gz
          retention-days: 90

  # ── 4. Tag + GitHub Release (skipped entirely when dry_run: true) ────────
  release:
    runs-on: ubuntu-latest
    needs: assemble
    if: inputs.dry_run == 'false'
    outputs:
      archive_url: ${{ steps.asset-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: mdix-zig-release-${{ inputs.version }}
          path: dist/

      - name: Tag
        run: |
          TAG="mdix-zig/v${{ inputs.version }}"
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"
          git tag -a "$TAG" -m "mdix-zig v${{ inputs.version }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mdix-zig/v${{ inputs.version }}"
          gh release create "$TAG" \
            "dist/${{ needs.assemble.outputs.archive_name }}" \
            --title "mdix-zig v${{ inputs.version }}" \
            --notes "Zig bindings for DixScript, v${{ inputs.version }}. Download the archive below — it bundles the prebuilt native lib for linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, and windows-amd64. Point -Dmdix-lib-path= at lib/<platform>/ (see mdix-zig/README.md inside the archive) for a manual/local setup, or depend on this archive directly via 'zig fetch --save <url>' for the mdix/mdix_ffi modules alone — you'll still need to supply a native lib path yourself in that case, same as this repo's own CI does." \
            --repo "${{ github.repository }}"

      # Read the real asset URL back from the release rather than
      # hand-building it — the tag itself contains a "/" (mdix-zig/v1.2.3,
      # same convention odin-release.yml's own tag uses), and letting `gh`
      # report the actual browser_download_url sidesteps any doubt about
      # how that slash needs encoding in a hand-built URL.
      - name: Read published asset URL
        id: asset-url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="mdix-zig/v${{ inputs.version }}"
          URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
                --jq '.assets[0].browser_download_url')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Asset URL: $URL"

  # ── 5. Validate the release is actually `zig fetch`-able — a real
  #      fetch + typecheck against the just-published archive, not just an
  #      assumption that build.zig.zon's `.paths` list is right. This is
  #      new territory for this project's release workflows (odin/go don't
  #      attempt it, since neither is consumed via a package-manager fetch
  #      the way Zig can be) — expect this step specifically may need a
  #      follow-up CI iteration to get exactly right, same as every other
  #      language's CI needed several rounds against real runs. ───────────
  validate-fetch:
    runs-on: ubuntu-latest
    needs: release
    if: inputs.dry_run == 'false'
    steps:
      - name: Install Zig
        env:
          ZIG_VERSION: "0.16.0"
        run: |
          curl -sL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          mkdir -p /opt/zig
          tar xf zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> $GITHUB_PATH

      - name: zig fetch + typecheck smoke test
        env:
          RELEASE_URL: ${{ needs.release.outputs.archive_url }}
        run: |
          set -e
          WORK=$(mktemp -d)
          cd "$WORK"

          cat > main.zig << 'EOF'
          const mdix = @import("mdix");
          const mdix_ffi = @import("mdix_ffi");
          pub fn main() void {
              _ = mdix;
              _ = mdix_ffi;
          }
          EOF

          cat > build.zig << 'EOF'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const mdix_dep = b.dependency("mdix_zig", .{ .target = target, .optimize = optimize });
              const exe = b.addExecutable(.{
                  .name = "smoke",
                  .root_source_file = b.path("main.zig"),
                  .target = target,
                  .optimize = optimize,
              });
              exe.root_module.addImport("mdix", mdix_dep.module("mdix"));
              exe.root_module.addImport("mdix_ffi", mdix_dep.module("mdix_ffi"));
              b.installArtifact(exe);
          }
          EOF

          # A leaf build.zig.zon still needs *a* fingerprint present; Zig
          # computes the one it actually wants deterministically from
          # .name and reports it when this placeholder doesn't match — so
          # seed a placeholder, let the expected-to-fail first build
          # report the real one, then patch it in and retry once. If the
          # failure is for any other reason, this heuristic won't find a
          # replacement and the job fails loudly with the real log above
          # it, which is the correct outcome (something genuinely broke).
          cat > build.zig.zon << 'EOF'
          .{
              .name = .mdix_zig_fetch_smoke,
              .version = "0.0.0",
              .fingerprint = 0x0000000000000001,
              .minimum_zig_version = "0.16.0",
              .dependencies = .{},
              .paths = .{ "build.zig", "build.zig.zon", "main.zig" },
          }
          EOF

          echo "Fetching: $RELEASE_URL"
          zig fetch --save=mdix_zig "$RELEASE_URL"

          if ! zig build 2>build-err.txt; then
            cat build-err.txt
            SUGGESTED=$(grep -oE '0x[0-9a-fA-F]{16}' build-err.txt | head -1 || true)
            if [ -n "$SUGGESTED" ]; then
              echo "Retrying with suggested fingerprint: $SUGGESTED"
              sed -i "s/0x0000000000000001/$SUGGESTED/" build.zig.zon
              zig build
            else
              echo "zig build failed and no fingerprint suggestion was found in its output —"
              echo "see the log above; this is a real failure, not the fingerprint placeholder."
              exit 1
            fi
          fi

          echo "OK — mdix-zig v${{ inputs.version }} fetches via 'zig fetch' and its mdix/mdix_ffi modules resolve and compile."

  # ── 6. Build-info page → gh-pages (always, even in dry_run) ──────────────
  deploy-page:
    runs-on: ubuntu-latest
    needs: [assemble, release, validate-fetch]
    if: always() && needs.assemble.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to gh-pages
        run: |
          git config --global user.name  "DixScript CI"
          git config --global user.email "ci@dixscript.dev"

          DRY="${{ inputs.dry_run }}"
          if [ "$DRY" = "true" ]; then
            SUBTITLE="dry run — verify only, nothing published"
          else
            SUBTITLE="v${{ inputs.version }}"
          fi

          WORK=$(mktemp -d)
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            git worktree add "$WORK" gh-pages
          else
            git worktree add --orphan -b gh-pages "$WORK"
          fi

          mkdir -p "$WORK/zig/release"
          cat > "$WORK/zig/release/index.html" << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DixScript-Rust — Zig Package Release</title>
            <style>
              body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#e6edf3;
                   display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
              .card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:36px 40px;max-width:520px;width:100%}
              h1{font-size:1.5rem;color:#4a9eff;margin-bottom:4px}
              .sub{color:#8b949e;font-size:0.82rem;margin-bottom:20px}
              .meta{font-size:0.78rem;color:#484f58;display:flex;flex-direction:column;gap:6px}
              a.back{display:inline-flex;color:#8b949e;text-decoration:none;margin-bottom:18px;font-size:0.78rem}
              a.dl{display:inline-block;margin-top:20px;padding:9px 20px;border-radius:7px;border:1px solid #4a9eff;color:#4a9eff;text-decoration:none;font-size:0.84rem}
            </style>
          </head>
          <body>
            <div class="card">
              <a class="back" href="../">← Zig Tests</a>
              <h1>Zig Package Release</h1>
              <p class="sub">${SUBTITLE}</p>
              <div class="meta">
                <span>Build #${{ github.run_number }}</span>
                <span>Commit ${GITHUB_SHA:0:8}</span>
                <span>Fetch check: ${{ needs.validate-fetch.result || 'skipped (dry_run)' }}</span>
                <span>Date $(date -u)</span>
              </div>
              <a class="dl" href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View this run →
              </a>
            </div>
          </body>
          </html>
          HTMLEOF

          cp .github/landing-index.html "$WORK/index.html"

          cd "$WORK"
          git add .
          if git diff --staged --quiet; then
            echo "Nothing new to deploy"
            exit 0
          fi
          git commit -m "Zig release page — Build #${{ github.run_number }} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  # ── 7. Summary ─────────────────────────────────────────────────────────
  summary:
    runs-on: ubuntu-latest
    needs: [verify, assemble, release, validate-fetch, deploy-page]
    if: always()
    steps:
      - run: |
          echo "============================================="
          echo "  MidManStudio.Mdix — Zig Package Release"
          echo "============================================="
          echo "Version:      ${{ inputs.version }}"
          echo "Dry run:      ${{ inputs.dry_run }}"
          echo "Verify:       ${{ needs.verify.result }}"
          echo "Assemble:     ${{ needs.assemble.result }}"
          echo "Release:      ${{ needs.release.result || 'skipped (dry_run)' }}"
          echo "Fetch check:  ${{ needs.validate-fetch.result || 'skipped (dry_run)' }}"
          echo "Page:         ${{ needs.deploy-page.result }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo ""
            echo "Dry run only — re-run with dry_run: false to tag mdix-zig/v${{ inputs.version }} and publish the GitHub Release."
          fi
