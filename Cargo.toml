[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "DixScript - Secure data interchange format with built-in encryption"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "data", "encryption", "serialization"]
categories = ["config", "encoding", "data-structures"]

[lib]
name = "dixscript"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Random number generation for helper functions
rand = "0.8"
# UUID for GUID operations - ENABLE v4 feature
uuid = { version = "1.0", features = ["v4", "serde"] }
# Date and time handling for error timestamps
chrono = { version = "0.4", features = ["serde"] }
bitflags = "2.4"

# JSON serialization for error reporting
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hostname for diagnostic dumps
hostname = "0.3"

# Perfect hash maps for keywords
phf = { version = "0.11", features = ["macros"] }

# SIMD string scanning
memchr = "2.7"

# Base64 encoding/decoding for blob values
base64 = "0.21"

# Regex support for regex values
regex = "1.10"

# LINQ-like iterator extensions
itertools = "0.13"
lazy_static = "1.4"
# For concurrency
rayon = "1.8"
unicase = "2.7"
rustc-hash = "2.0"

# HTTP client for cloud imports
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.11.0-pre.4"

# URL parsing
url = "2.5"

# =============================================================================
# DLM (Data Lifecycle Modules) Dependencies
# =============================================================================

# --- Compression Modules ---
flate2 = "1.0"          # GZIP compression (fast, good ratio)
bzip2 = "0.4"           # BZIP2 compression (slower, better ratio)
xz2 = "0.1"             # LZMA compression (slowest, best ratio)

# --- Encryption Modules ---
aes-gcm = "0.10"        # AES-128/256-GCM authenticated encryption
chacha20poly1305 = "0.10" # ChaCha20-Poly1305 authenticated encryption
argon2 = "0.5"          # Argon2id key derivation function (password-based)

# --- Utilities ---
hex = "0.4"             # Hex encoding for checksums and key display

# =============================================================================
# [dev-dependencies]
# =============================================================================
[dev-dependencies]
# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Temp file management for loader/DLM tests
tempfile = "3.10"

# ---------------------------------------------------------------------------
# Serialisation format comparison
# ---------------------------------------------------------------------------
# Compact binary serialisation (Rust ecosystem standard)
bincode = "1.3"

# MessagePack - widely used cross-language compact binary format
rmp-serde = "1.1"

# Postcard - no-std friendly, very compact binary, used in embedded/IoT
postcard = { version = "1.0", features = ["alloc"] }

# CBOR - Concise Binary Object Representation (RFC 7049, used in IoT/WebAuthn)
ciborium = "0.2"

# ---------------------------------------------------------------------------
# Format Comparison: Jsonnet (in-process, no subprocess needed)
# ---------------------------------------------------------------------------
jrsonnet-evaluator = "0.4"
jrsonnet-stdlib = "0.4"

# =============================================================================
# Test / Bench targets
# =============================================================================
[[bench]]
name = "throughput_benchmark"
harness = false

[[bench]]
name = "lexer_throughput"
harness = false

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"

[[bin]]
name = "simple_bench"
path = "benches/simple_bench.rs"
test = false
bench = false

# =============================================================================
# Feature Flags
# =============================================================================
[features]
default = []
cue_cli_available = []

# =============================================================================
# Build Profiles
# =============================================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = true

[profile.dev]
opt-level = 0
debug = true

[profile.dev.build-override]
opt-level = 0

[profile.release.build-override]
opt-level = 3
