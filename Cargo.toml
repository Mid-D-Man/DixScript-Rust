[workspace]
members = ["dixscript", "mdix-cli", "mdix-lsp", "mdix-ffi", "mdix-wasm", "mdix-python", "mdix-java"]
resolver = "2"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
debug         = false

[profile.dev]
opt-level = 0
debug     = true

[profile.release.package.mdix-wasm]
opt-level = "s"
# resolver 2 is required for proper feature unification across workspace members.
# Without it, optional features can leak across crates in surprising ways.
