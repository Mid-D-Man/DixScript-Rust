[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "DixScript - Secure data interchange format with built-in encryption"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "data", "encryption", "serialization"]
categories = ["config", "encoding", "data-structures"]

[lib]
name = "dixscript"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Random number generation for helper functions
rand = "0.8"
#uuid for guid ops
uuid = "1.0.0-alpha.1"
# Date and time handling for error timestamps
chrono = "0.4"

# JSON serialization for error reporting
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hostname for diagnostic dumps
hostname = "0.3"

# Perfect hash maps for keywords
phf = { version = "0.11", features = ["macros"] }

# SIMD string scanning
memchr = "2.7"

# Base64 encoding/decoding for blob values
base64 = "0.21"

# Regex support for regex values
regex = "1.10"

# LINQ-like iterator extensions (replaces DixCore wrappers)
itertools = "0.13"

[dev-dependencies]
# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Note: Configure benchmark harness
[[bench]]
name = "throughput_benchmark"
harness = false

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = true

[profile.dev]
opt-level = 0
debug = true

# Optimize for old MacBook Pro 2010
[profile.dev.build-override]
opt-level = 0

[profile.release.build-override]
opt-level = 3