[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "DixScript - Secure data interchange format with built-in encryption"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "data", "encryption", "serialization"]
categories = ["config", "encoding", "data-structures"]

[lib]
name = "dixscript"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Random number generation for helper functions
rand = "0.8"
# UUID for GUID operations - ENABLE v4 feature
uuid = { version = "1.0", features = ["v4", "serde"] }
# Date and time handling for error timestamps
chrono = { version = "0.4", features = ["serde"] }
bitflags = "2.4"        # NEW: For section flags

# JSON serialization for error reporting
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hostname for diagnostic dumps
hostname = "0.3"

# Perfect hash maps for keywords
phf = { version = "0.11", features = ["macros"] }

# SIMD string scanning
memchr = "2.7"

# Base64 encoding/decoding for blob values
base64 = "0.21"

# Regex support for regex values
regex = "1.10"

# LINQ-like iterator extensions (replaces DixCore wrappers)
itertools = "0.13"
# Lazy static for something i dont know
lazy_static = "1.4"
# For concurrency
rayon = "1.8"
unicase = "2.7"
rustc-hash = "2.0"

# HTTP client for cloud imports
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sha2 = "0.11.0-pre.4"

# URL parsing
url = "2.5"

# =============================================================================
# DLM (Data Lifecycle Modules) Dependencies
# =============================================================================

# --- Compression Modules ---
flate2 = "1.0"          # GZIP compression (fast, good ratio)
bzip2 = "0.4"           # BZIP2 compression (slower, better ratio)
xz2 = "0.1"             # LZMA compression (slowest, best ratio)

# --- Encryption Modules ---
aes-gcm = "0.10"        # AES-128/256-GCM authenticated encryption
chacha20poly1305 = "0.10" # ChaCha20-Poly1305 authenticated encryption
argon2 = "0.5"          # Argon2id key derivation function (password-based)

# --- Utilities ---
hex = "0.4"             # Hex encoding for checksums and key display

[dev-dependencies]
# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Temp file management for loader tests
tempfile = "3.10"

# =============================================================================
# Format Comparison Dependencies (for benchmarking DixScript vs competitors)
# =============================================================================

# --- Jsonnet ---
# Pure Rust Jsonnet evaluator - in-process, no subprocess needed
# Used to benchmark against DixScript compile-time function evaluation
jrsonnet-evaluator = "0.4"
jrsonnet-stdlib = "0.4"    # Standard library for Jsonnet (std.*)

# --- CUE ---
# No Rust crate exists for CUE - it is a Go tool.
# CUE comparison tests use std::process::Command to call the `cue` CLI.
# Install CUE: https://cuelang.org/docs/install/
# Tests that require the CUE CLI are gated behind:
#   #[cfg(feature = "cue_cli_available")]
# or will be skipped if the binary is not on PATH.

# Note: Configure benchmark harness
[[bench]]
name = "throughput_benchmark"
harness = false

[[test]]
name = "config_tests"
path = "tests/config_tests.rs"

[[bench]]
name = "lexer_throughput"
harness = false

[[bin]]
name = "simple_bench"
path = "benches/simple_bench.rs"
test = false
bench = false

# =============================================================================
# Feature Flags
# =============================================================================
[features]
default = []
# Enable comparison tests that require the CUE CLI to be installed on PATH
cue_cli_available = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = true

[profile.dev]
opt-level = 0
debug = true

# Optimize for old MacBook Pro 2010
[profile.dev.build-override]
opt-level = 0

[profile.release.build-override]
opt-level = 3
