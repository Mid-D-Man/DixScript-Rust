<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MidManStudio.Mdix.Core — Test Results</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; padding: 24px;
    }
    a { color: #a371f7; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.82rem; color: #8b949e; margin-bottom: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: #a371f7; text-decoration: none; }

    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 1.5rem; color: #a371f7; margin-bottom: 4px; }
    .page-header .meta {
      font-size: 0.78rem; color: #484f58;
      display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px;
    }
    .page-header .meta span { display: flex; align-items: center; gap: 4px; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px; margin-bottom: 28px;
    }
    .summary-card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .summary-card .label {
      font-size: 0.72rem; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .summary-card .value { font-size: 1.6rem; font-weight: 700; }
    .summary-card.passed  .value { color: #3fb950; }
    .summary-card.failed  .value { color: #f85149; }
    .summary-card.ignored .value { color: #d29922; }
    .summary-card.total   .value { color: #e6edf3; }
    .summary-card.duration .value { color: #79c0ff; font-size: 1.2rem; }

    /* Dynamic status banner */
    .status-banner {
      border-radius: 8px; padding: 12px 16px;
      font-size: 0.82rem; margin-bottom: 24px;
      display: flex; align-items: center; gap: 10px;
    }
    .status-banner.all-pass {
      background: #0f2d1a; border: 1px solid #3fb950; border-left: 3px solid #3fb950;
      color: #3fb950;
    }
    .status-banner.has-fail {
      background: #2d0f0f; border: 1px solid #f85149; border-left: 3px solid #f85149;
      color: #f85149;
    }
    .status-banner.has-skip {
      background: #1c1a0f; border: 1px solid #d29922; border-left: 3px solid #d29922;
      color: #d29922;
    }
    .status-banner .icon { font-size: 1.1rem; flex-shrink: 0; }
    .status-banner .msg { color: #e6edf3; }
    .status-banner .msg strong { color: inherit; }

    .filter-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px; flex-wrap: wrap;
    }
    .filter-bar input {
      flex: 1; min-width: 200px;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 7px 12px; color: #e6edf3; font-size: 0.83rem; outline: none;
    }
    .filter-bar input:focus { border-color: #a371f7; }
    .filter-btn {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 7px 12px; color: #8b949e; font-size: 0.78rem; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .filter-btn:hover, .filter-btn.active { border-color: #a371f7; color: #a371f7; }
    .filter-btn.active-pass { border-color: #3fb950; color: #3fb950; }
    .filter-btn.active-fail { border-color: #f85149; color: #f85149; }
    .filter-btn.active-skip { border-color: #d29922; color: #d29922; }

    .suite-block {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; margin-bottom: 14px; overflow: hidden;
    }
    .suite-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; cursor: pointer; user-select: none;
      transition: background 0.12s;
    }
    .suite-header:hover { background: #1c2128; }
    .suite-header .suite-name { font-weight: 600; font-size: 0.9rem; }
    .suite-header .suite-stats { display: flex; gap: 12px; font-size: 0.76rem; }
    .suite-header .suite-stats .s-pass { color: #3fb950; }
    .suite-header .suite-stats .s-fail { color: #f85149; }
    .suite-header .suite-stats .s-skip { color: #d29922; }
    .suite-header .suite-stats .s-dur  { color: #484f58; }
    .chevron { color: #484f58; font-size: 0.7rem; transition: transform 0.2s; }
    .suite-block.open .chevron { transform: rotate(90deg); }

    .suite-tests { display: none; border-top: 1px solid #21262d; }
    .suite-block.open .suite-tests { display: block; }

    .test-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 10px 18px; border-bottom: 1px solid #21262d; font-size: 0.82rem;
    }
    .test-row:last-child { border-bottom: none; }
    .test-row:hover { background: #1c2128; }

    .test-status {
      flex-shrink: 0; width: 56px; font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; padding: 2px 6px; border-radius: 4px;
      text-align: center; margin-top: 1px;
    }
    .test-status.passed  { background: #0f2d1a; color: #3fb950; }
    .test-status.failed  { background: #2d0f0f; color: #f85149; }
    .test-status.ignored { background: #2d210f; color: #d29922; }

    .test-name {
      flex: 1; font-family: 'Cascadia Code', 'Fira Code', monospace;
      color: #c9d1d9; word-break: break-all;
    }
    /* Strip the class prefix from test names for readability */
    .test-name .class-prefix { color: #484f58; }

    .test-dur {
      flex-shrink: 0; color: #484f58; font-size: 0.72rem;
      min-width: 48px; text-align: right; margin-top: 2px;
    }

    .test-output {
      margin: 4px 18px 10px calc(18px + 56px + 12px);
      background: #0d1117; border: 1px solid #21262d; border-radius: 6px;
      padding: 10px 12px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.75rem; white-space: pre-wrap; word-break: break-all;
      display: none;
    }
    .test-output.output-fail   { color: #f85149; }
    .test-output.output-skip   { color: #d29922; }

    .test-row.has-output { cursor: pointer; }
    .test-row.has-output .test-name::after {
      content: ' ▸'; color: #484f58; font-style: normal; font-size: 0.65rem;
    }
    .test-row.expanded + .test-output { display: block; }

    .no-results {
      text-align: center; padding: 48px 24px; color: #484f58; font-size: 0.9rem;
    }
    .loading { text-align: center; padding: 60px; color: #484f58; }
    .loading .spinner {
      width: 28px; height: 28px; border: 2px solid #30363d;
      border-top-color: #a371f7; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-block {
      background: #2d0f0f; border: 1px solid #f85149;
      border-radius: 8px; padding: 16px 20px; color: #f85149;
      font-size: 0.85rem; margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <a class="back-link" href="../">← CI Dashboard</a>

  <div class="page-header">
    <h1>MidManStudio.Mdix.Core — Test Results</h1>
    <div class="meta">
      <span>🔢 Build <strong id="meta-build" style="color:#e6edf3">—</strong></span>
      <span>🌿 <strong id="meta-branch" style="color:#e6edf3">—</strong></span>
      <span>📝 <code id="meta-commit" style="color:#e6edf3">—</code></span>
      <span>☕ .NET <strong id="meta-dotnet" style="color:#e6edf3">—</strong></span>
      <span>🕐 <span id="meta-date">—</span></span>
    </div>
  </div>

  <div id="status-banner" style="display:none" class="status-banner">
    <span class="icon" id="banner-icon"></span>
    <span class="msg" id="banner-msg"></span>
  </div>

  <div id="summary-grid" class="summary-grid" style="display:none">
    <div class="summary-card total">
      <span class="label">Total</span>
      <span class="value" id="val-total">—</span>
    </div>
    <div class="summary-card passed">
      <span class="label">Passed</span>
      <span class="value" id="val-passed">—</span>
    </div>
    <div class="summary-card failed">
      <span class="label">Failed</span>
      <span class="value" id="val-failed">—</span>
    </div>
    <div class="summary-card ignored">
      <span class="label">Skipped</span>
      <span class="value" id="val-ignored">—</span>
    </div>
    <div class="summary-card duration">
      <span class="label">Duration</span>
      <span class="value" id="val-duration">—</span>
    </div>
  </div>

  <div id="error-block" class="err-block" style="display:none"></div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div>Loading test results…</div>
  </div>

  <div id="content" style="display:none">
    <div class="filter-bar">
      <input id="search" type="text" placeholder="Filter by test name or suite…">
      <button class="filter-btn active" data-filter="all"     onclick="setFilter('all',this)">All</button>
      <button class="filter-btn"        data-filter="passed"  onclick="setFilter('passed',this)">Passed</button>
      <button class="filter-btn"        data-filter="failed"  onclick="setFilter('failed',this)">Failed</button>
      <button class="filter-btn"        data-filter="ignored" onclick="setFilter('ignored',this)">Skipped</button>
    </div>
    <div id="suites-container"></div>
    <div id="no-results" class="no-results" style="display:none">No tests match the current filter.</div>
  </div>

<script>
  let allData   = null;
  let curFilter = 'all';
  let curSearch = '';

  async function init() {
    try {
      const resp = await fetch('test-results.json');
      if (!resp.ok) throw new Error(`HTTP ${resp.status} — test-results.json not found`);
      allData = await resp.json();
      renderPage(allData);
    } catch (e) {
      document.getElementById('loading').style.display = 'none';
      const eb = document.getElementById('error-block');
      eb.textContent = 'Failed to load test-results.json: ' + e.message;
      eb.style.display = 'block';
    }
  }

  function renderPage(data) {
    document.getElementById('loading').style.display = 'none';

    // ── Meta ──────────────────────────────────────────────────────────────────
    document.getElementById('meta-build') .textContent = data.build  || '—';
    document.getElementById('meta-branch').textContent = data.branch || '—';
    document.getElementById('meta-commit').textContent = data.commit || '—';
    document.getElementById('meta-dotnet').textContent = data.dotnet || '—';

    const raw = data.date || '';
    document.getElementById('meta-date').textContent =
      raw ? new Date(raw).toUTCString() : '—';

    // ── Summary grid ──────────────────────────────────────────────────────────
    const s = data.summary || {};
    const total   = s.total   ?? 0;
    const passed  = s.passed  ?? 0;
    const failed  = s.failed  ?? 0;
    const ignored = s.ignored ?? 0;

    document.getElementById('val-total')   .textContent = total;
    document.getElementById('val-passed')  .textContent = passed;
    document.getElementById('val-failed')  .textContent = failed;
    document.getElementById('val-ignored') .textContent = ignored;
    document.getElementById('val-duration').textContent = fmtDur(s.duration_s ?? 0);
    document.getElementById('summary-grid').style.display = '';

    // ── Status banner ─────────────────────────────────────────────────────────
    const banner  = document.getElementById('status-banner');
    const bIcon   = document.getElementById('banner-icon');
    const bMsg    = document.getElementById('banner-msg');

    if (failed > 0) {
      banner.className = 'status-banner has-fail';
      bIcon.textContent = '✗';
      bMsg.innerHTML = `<strong>${failed} test${failed !== 1 ? 's' : ''} failed</strong> — expand the suite below to see details.`;
    } else if (ignored > 0) {
      banner.className = 'status-banner has-skip';
      bIcon.textContent = '⊘';
      bMsg.innerHTML =
        `All <strong>${passed}</strong> runnable tests passed. ` +
        `<strong>${ignored}</strong> test${ignored !== 1 ? 's' : ''} skipped — ` +
        `run <code>cargo build -p mdix-ffi</code> and copy the library next to the test assembly to enable them.`;
    } else {
      banner.className = 'status-banner all-pass';
      bIcon.textContent = '✓';
      bMsg.innerHTML = `All <strong>${passed}</strong> tests passed.`;
    }
    banner.style.display = 'flex';

    document.getElementById('content').style.display = '';
    renderSuites();
  }

  function renderSuites() {
    const container = document.getElementById('suites-container');
    container.innerHTML = '';

    const suites   = allData.suites || [];
    const q        = curSearch.toLowerCase();
    let   anyShown = false;

    for (const suite of suites) {
      const tests = (suite.tests || []).filter(t => {
        const matchFilter = curFilter === 'all' || t.status === curFilter;
        const matchSearch = !q || t.name.toLowerCase().includes(q) || suite.name.toLowerCase().includes(q);
        return matchFilter && matchSearch;
      });
      if (tests.length === 0) continue;
      anyShown = true;

      const block = document.createElement('div');
      block.className = 'suite-block';
      // Auto-open suites with failures, or when searching/filtering
      if (suite.failed > 0 || curFilter !== 'all' || curSearch) block.classList.add('open');

      const passCount   = tests.filter(t => t.status === 'passed').length;
      const failCount   = tests.filter(t => t.status === 'failed').length;
      const ignoreCount = tests.filter(t => t.status === 'ignored').length;

      block.innerHTML = `
        <div class="suite-header" onclick="toggleSuite(this)">
          <span class="suite-name">${esc(suite.name)}</span>
          <div style="display:flex;align-items:center;gap:16px">
            <div class="suite-stats">
              <span class="s-pass">✓ ${passCount}</span>
              ${failCount   ? `<span class="s-fail">✗ ${failCount}</span>` : ''}
              ${ignoreCount ? `<span class="s-skip">⊘ ${ignoreCount}</span>` : ''}
              <span class="s-dur">${fmtDur(suite.duration_s)}</span>
            </div>
            <span class="chevron">▶</span>
          </div>
        </div>
        <div class="suite-tests">${buildTests(tests, suite.name)}</div>`;

      container.appendChild(block);
    }

    document.getElementById('no-results').style.display = anyShown ? 'none' : '';

    container.querySelectorAll('.test-row.has-output').forEach(row => {
      row.addEventListener('click', () => row.classList.toggle('expanded'));
    });
  }

  function buildTests(tests, suiteName) {
    // Strip the fully-qualified prefix that xunit puts in test names,
    // keeping only the method name for readability.
    // e.g. "MidManStudio.Mdix.Core.Tests.MdixBuilderTests.Create_ReturnsUsableBuilder"
    //   →  class prefix dim, method name bright
    const suitePrefix = suiteName + '.';

    return tests.map(t => {
      const output    = (t.output || '').trim();
      const hasOutput = output.length > 0;
      const outClass  = t.status === 'ignored' ? 'output-skip' : 'output-fail';
      const rowClass  = `test-row${hasOutput ? ' has-output' : ''}`;
      const dur       = t.duration_ms != null ? `${t.duration_ms}ms` : '';
      const label     = t.status === 'ignored' ? 'skip' : t.status;

      // Split display name: dim the suite-class prefix, highlight the method
      let displayName;
      if (t.name.startsWith(suitePrefix)) {
        const method = t.name.slice(suitePrefix.length);
        displayName = `<span class="class-prefix">${esc(suiteName)}.</span>${esc(method)}`;
      } else {
        // May have a longer fully-qualified name — trim everything up to the last dot
        const lastDot = t.name.lastIndexOf('.');
        if (lastDot > 0) {
          const prefix = t.name.slice(0, lastDot + 1);
          const method = t.name.slice(lastDot + 1);
          displayName = `<span class="class-prefix">${esc(prefix)}</span>${esc(method)}`;
        } else {
          displayName = esc(t.name);
        }
      }

      const outPanel = hasOutput
        ? `<div class="test-output ${outClass}">${esc(output)}</div>`
        : '';

      return `
        <div class="${rowClass}">
          <span class="test-status ${t.status}">${label}</span>
          <span class="test-name">${displayName}</span>
          <span class="test-dur">${dur}</span>
        </div>${outPanel}`;
    }).join('');
  }

  function toggleSuite(header) {
    header.closest('.suite-block').classList.toggle('open');
  }

  function setFilter(f, btn) {
    curFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'filter-btn';
      if (b === btn) {
        b.classList.add(
          f === 'all'     ? 'active'      :
          f === 'passed'  ? 'active-pass' :
          f === 'failed'  ? 'active-fail' : 'active-skip'
        );
      }
    });
    renderSuites();
  }

  document.getElementById('search').addEventListener('input', e => {
    curSearch = e.target.value;
    renderSuites();
  });

  function fmtDur(s) {
    if (s == null) return '—';
    if (s < 1) return `${Math.round(s * 1000)}ms`;
    return `${s.toFixed(2)}s`;
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
    </html>
