[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "DixScript - Secure data interchange format with built-in encryption"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "data", "encryption", "serialization"]
categories = ["config", "encoding", "data-structures"]

[lib]
name = "dixscript"
# staticlib and cdylib have been removed now that the workspace split is done.
# If C FFI bindings are needed in the future, create a separate dixscript-ffi
# crate in the workspace with crate-type = ["staticlib", "cdylib"] that depends
# on this crate. Keeping them here hurts compile times for mdix-cli and prevents
# LTO optimisations for all library consumers.
crate-type = ["lib"]

# =============================================================================
# Runtime dependencies
# =============================================================================
[dependencies]
rand       = "0.8"
uuid       = { version = "1.0", features = ["v4", "serde"] }
chrono     = { version = "0.4", features = ["serde"] }
bitflags   = "2.4"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
hostname   = "0.3"

phf        = { version = "0.11", features = ["macros"] }
memchr     = "2.7"
base64     = "0.21"
regex      = "1.10"
itertools  = "0.13"
lazy_static = "1.4"
rayon      = "1.8"
unicase    = "2.7"
rustc-hash = "2.0"

# sha2 pre-release — kept as-is; upgrade to stable 0.10.x when ready
sha2 = "0.11.0-pre.4"

# Cloud-import deps are OPTIONAL: `cargo build` skips them unless you pass
# --features cloud_imports. This significantly cuts compile time on dev machines.
reqwest     = { version = "0.11", features = ["json"],  optional = true }
tokio       = { version = "1",    features = ["full"],  optional = true }
async-trait = { version = "0.1",                        optional = true }
url         = { version = "2.5",                        optional = true }

# =============================================================================
# DLM (Data Lifecycle Modules)
# =============================================================================
flate2            = "1.0"
bzip2             = "0.4"
xz2               = "0.1"
aes-gcm           = "0.10"
chacha20poly1305  = "0.10"
argon2            = "0.5"
hex               = "0.4"

# =============================================================================
# Dev / bench dependencies
# =============================================================================
[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
tempfile   = "3.10"

# Serialisation format comparison
bincode    = "1.3"
rmp-serde  = "1.1"
postcard   = { version = "1.0", features = ["alloc"] }
ciborium   = "0.2"

# Jsonnet comparison
jrsonnet-evaluator = "0.4"
jrsonnet-stdlib    = "0.4"

# =============================================================================
# Bench / test targets
# =============================================================================
[[bench]]
name    = "throughput_benchmark"
harness = false

[[bench]]
name    = "lexer_throughput"
harness = false

[[bench]]
name    = "config_throughput"
harness = false

[[bench]]
name    = "general_parser_benchmark"
harness = false

[[bench]]
name    = "semantics_benchmark"
harness = false

[[bench]]
name    = "ast_enhancement_benchmark"
harness = false

[[bench]]
name    = "value_resolution_benchmark"
harness = false

[[bench]]
name    = "binary_serialization_benchmark"
harness = false

[[bench]]
name    = "runtime_benchmark"
harness = false

# =============================================================================
# Feature flags
# =============================================================================
[features]
default = []
# Pull in reqwest / tokio / async-trait / url only when cloud imports are needed
cloud_imports     = ["reqwest", "tokio", "async-trait", "url"]
cue_cli_available = []

# =============================================================================
# Build profiles
# NOTE: profiles are only respected when defined in the workspace root Cargo.toml.
# These are kept here for reference but should be moved to the workspace root
# once profile inheritance is needed across all members. For now Cargo inherits
# the workspace root profiles automatically, so these are effectively no-ops
# if the workspace root also defines them. Define once, in the root.
# =============================================================================

# --- Production release: fully stripped, maximum optimisation
[profile.release]
opt-level      = 3
lto            = true      # "fat" LTO — full cross-crate optimisation
codegen-units  = 1
strip          = true      # strips DWARF symbols; makes debug = true meaningless
debug          = false     # explicit: strip wins anyway, keep this consistent

# --- Benchmarking: same opt level as release but symbols preserved for flamegraph.
#
# lto = false is deliberate and critical:
#   ThinLTO inlines across crate boundaries and disrupts DWARF stack unwinding,
#   causing perf to emit "[unknown]" frames and producing useless flamegraphs.
#   LTO is great for release throughput but must be off for profiling.
#
# Use: cargo bench --profile bench
#      cargo flamegraph --profile bench --bench <target> -- --bench
[profile.bench]
opt-level     = 3
lto           = false     # MUST be false — ThinLTO breaks perf stack unwinding
codegen-units = 1
strip         = false     # KEEP symbols — flamegraph requires these
debug         = true      # full DWARF info

# --- Development
[profile.dev]
opt-level = 0
debug     = true

[profile.dev.build-override]
opt-level = 0

[profile.release.build-override]
opt-level = 3
