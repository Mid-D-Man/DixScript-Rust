# ============================================================================
# NOTICE: Full documentation, design decisions, and fix history for this file
# live in docs/dixscript/features.md, section "The feature graph"
# ============================================================================
[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["MidManStudio"]
description = "Config, code, and encryption in one file — a data interchange format with compile-time functions, AES-256/ChaCha20 built-in, and cross-platform FFI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "encryption", "serialization", "data-format", "gamedev"]
categories = ["config", "parser-implementations", "encoding", "data-structures", "cryptography"]
homepage = "https://dixscript-docs.pages.dev"
# Consumers of the crate never need any of this: dev-dependencies (criterion
# for benches, proptest/fuzz harnesses) only apply to these directories, and
# CI config is irrelevant once published. examples/ is deliberately NOT
# excluded -- it's what renders on docs.rs and what `cargo run --example`
# needs.
exclude = [
    "benches/",
    "tests/",
    "fuzz/",
    ".github/",
]

[lib]
name = "dixscript"
crate-type = ["lib"]

[dependencies]
rand       = { version = "0.8", features = ["getrandom"] }
chrono     = { version = "0.4", features = ["wasmbind"] }
# std::time::Instant::now() panics ("time not implemented on this platform")
# on wasm32-unknown-unknown. web-time is a drop-in replacement: std passthrough
# on native, Performance.now() (via js-sys) on wasm32. Duration is untouched —
# only Instant needed swapping. See the 8 `use web_time::Instant;` call sites.
web-time   = "1.1"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = { version = "0.8", optional = true }   # `toml-support`
# serde MUST STAY. Its one use in this crate's src/ is `#[derive(Serialize)]`
# + `#[serde(untagged)]` on DixValue (Runtime/dix_value.rs), and that derive
# is NOT dead: mdix-ffi (`mdix_get_json`), mdix-wasm (`getJson`), mdix-lua
# (`get_json`), mdix-python and mdix-java all call
# `serde_json::to_string(&DixValue)` through it. An earlier pass concluded
# it was removable from grepping this crate's own src/ only -- wrong, the
# consumers live in sibling workspace crates. See docs/dixscript/utilities.md.

phf         = { version = "0.11", features = ["macros"] }
memchr      = "2.7"
regex       = "1.10"
# itertools, unicase: removed -- grepped for real call sites across src/
# before cutting either; both were zero.
#
# async-trait, base64, bitflags, hex, hostname, lazy_static, rustc-hash, uuid:
# no longer runtime dependencies -- replaced by the hand-rolled modules under
# src/Utilities/ (see docs/dixscript/utilities.md). All of them except
# lazy_static are kept as
# DEV-dependencies below on purpose: the replacements' differential tests call
# them as oracles (`::base64`, `::hex`, ...), so they keep guarding the
# replacements. lazy_static has no oracle test and is gone entirely.

sha2 = "0.10"

flate2           = { version = "1.0", default-features = false, features = ["rust_backend"] }
# Each algorithm has its own feature (see [features]); `encryption-support` is the
# umbrella that turns all of them on. `aes-gcm` is shared by the AES-128 and AES-256
# features. XOR needs none of these (sha2 + rand only) and is part of `dlm-encryptor`.
aes-gcm          = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
argon2           = { version = "0.5",  optional = true }

# ── Cloud import deps ──────────────────────────────────────────────────────────
# `url` is no longer a dependency: its one use (the last path segment of a cloud
# URL, to name the cache file) is Utilities/Url, and `url` is kept as a
# dev-dependency oracle for its differential tests. (`reqwest::Url` was the first
# plan and would have changed the cache file name in builds without
# `cloud-import`; see docs/dixscript/utilities.md.) `reqwest` and `tokio` are the
# real cloud-import dependencies and are optional, below.

# Compression: gzip only, through flate2 above. The bzip2 and lzma codecs (and the
# bzip2 and lzma-rust2 crates behind them) were removed; docs/dixscript/dlm.md has why.

# ── Non-WASM native deps ───────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Optional: only pulled in when `rayon-support` is enabled (on by default).
# Used in exactly three places — general_parser.rs's section-level parsing,
# and binary_packer.rs/binary_unpacker.rs's section-level (de)serialization —
# all three already had a sequential fallback for wasm32 before this feature
# existed; the feature just extends that same fallback to any native build
# that wants to opt out too (smaller binary, no thread-pool spin-up, fully
# deterministic single-threaded execution for debugging).
rayon    = { version = "1.8", optional = true }
reqwest  = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }
# tokio: trimmed from "full" to only the runtime features actually used
# (rt-multi-thread for block_on, macros for #[tokio::main] if needed, fs + time for
# the cloud download path).  "full" pulled in every tokio sub-crate unnecessarily.
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# Only used by CloudFileCache's localStorage backend — Window to reach
# `window.localStorage`, Storage for the get/set/remove/key/length calls.
# Not the whole web-sys surface, just these two, to keep the wasm binary lean.
web-sys   = { version = "0.3", features = ["Window", "Storage"] }

# Bench/test-only deps. Gated off wasm32 on purpose: criterion pulls in
# rayon (one of its default features) plus a pile of native-only tooling
# (walkdir, is-terminal, plotters, ...) that has no business resolving
# against a wasm32 target.  Nothing in CI currently runs
# `cargo bench`/`cargo test --benches` against wasm32 — the wasm job only
# does `wasm-pack build mdix-wasm`, which never touches dev-dependencies —
# but this makes that guarantee explicit at the manifest level instead of
# relying on nobody ever running a broad `--workspace --all-targets
# --target wasm32-unknown-unknown` check.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
# Oracles for the differential tests in
# src/Utilities/{AsyncTrait,Base64,Bitflags,Hex,Hostname,RustcHash,Uuid}.
# Test-only: nothing in src/ outside #[cfg(test)] may name these crates.
async-trait = "0.1"
base64     = "0.21"
bitflags   = "2.4"
hex        = "0.4"
hostname   = "0.3"
rustc-hash = "2.0"
uuid       = "1.0"
url        = "2.5"
tempfile   = "3.10"
bincode    = "1.3"
rmp-serde  = "1.1"
postcard   = { version = "1.0", features = ["alloc"] }
ciborium   = "0.2"
# arena_vs_box_benchmark only — prototype bench comparing the current
# owned AST against a bumpalo-arena mirror, ahead of any real migration.
bumpalo    = { version = "3", features = ["collections"] }

# Test targets that call into an optional feature are skipped (not failed) when
# that feature is off, e.g. `cargo test --no-default-features`.
[[test]]
name = "enum_converter_json_toml_regression"
required-features = ["toml-support"]
[[test]]
name = "enum_extract"
required-features = ["toml-support"]
[[test]]
name = "enum_metadata_binary_regression"
required-features = ["dlm"]

[[bench]]
name    = "format_comparison_benchmark"
harness = false
required-features = ["toml-support"]
[[bench]]
name    = "throughput_benchmark"
harness = false
[[bench]]
name    = "lexer_throughput"
harness = false
[[bench]]
name    = "config_throughput"
harness = false
[[bench]]
name    = "stress_test_benchmark"
harness = false
[[bench]]
name    = "general_parser_benchmark"
harness = false
[[bench]]
name    = "semantics_benchmark"
harness = false
[[bench]]
name    = "ast_enhancement_benchmark"
harness = false
[[bench]]
name    = "value_resolution_benchmark"
harness = false
[[bench]]
name    = "binary_serialization_benchmark"
harness = false
[[bench]]
name    = "runtime_benchmark"
harness = false
[[bench]]
name    = "arena_vs_box_benchmark"
harness = false
[[bench]]
name    = "raw_section_benchmark"
harness = false
[[bench]]
name    = "chemistry_db_comparison_benchmark"
harness = false
required-features = ["toml-support"]

# ── Feature flags ──────────────────────────────────────────────────────────────
# Default pulls in everything — existing consumers (desktop, CI, mdix-cli,
# mdix-lsp, mdix-ffi) get identical behaviour with no changes to their
# dependency declarations.
#
# To build without cloud or compression deps (e.g. mxross-brush-lua):
#   dixscript = { path = "...", default-features = false }
#
# To restore just one group:
#   dixscript = { path = "...", default-features = false, features = ["cloud-import"] }
[features]
default        = [
    "cloud-import", "rayon-support", "toml-support",
    "dlm", "dlm-auditor", "dlm-compressor", "dlm-encryptor",
    "encryption-support",
]
cloud-import   = ["dep:reqwest", "dep:tokio"]
rayon-support  = ["dep:rayon"]
toml-support   = ["dep:toml"]

# ── DLM (Data Lifecycle Modules) ──────────────────────────────────────────────
# `@DLM(...)` sections always PARSE, validate and serialize, in every build: that
# is language-level. These features decide whether the modules can EXECUTE.
#   dlm            the pipeline: executors, key-file manifest, the module traits,
#                  `DixLoader::{load_encrypted, compile_with_dlm_from_str, ...}`
#   dlm-auditor    DAuditor   (DiyAuditor, EnhancedAuditor, .mdix.au files)
#   dlm-compressor DCompressor (gzip; `flate2` is deliberately NOT optional)
#   dlm-encryptor  DEncryptor  (xor; key files)
# and the heavy algorithms on top of a family:
#   bzip2-support / xz-support   removed codecs, now empty stubs (see below)
#   aes128-support / aes256-support / chacha20-support   one encryptor each
#   argon2-support               Argon2id: password-protected key files and
#                                `DEncryptor` password mode
#   encryption-support           umbrella: all four of the above
# Asking for a module that is not compiled in is a clear runtime error, never a
# silent skip.
dlm            = []
dlm-auditor    = ["dlm"]
dlm-compressor = ["dlm"]
dlm-encryptor  = ["dlm"]
# bzip2 and lzma were removed. These two names stay as empty stubs (each still implies
# dlm-compressor, as before) so a downstream `features = ["xz-support"]` keeps resolving.
# They enable no code: a file that uses either codec fails with a "no longer supported"
# error. They are off by default and can be deleted in the next breaking release.
bzip2-support  = ["dlm-compressor"]
xz-support     = ["dlm-compressor"]
aes128-support   = ["dlm-encryptor", "dep:aes-gcm"]
aes256-support   = ["dlm-encryptor", "dep:aes-gcm"]
chacha20-support = ["dlm-encryptor", "dep:chacha20poly1305"]
argon2-support   = ["dlm-encryptor", "dep:argon2"]
encryption-support = ["aes128-support", "aes256-support", "chacha20-support", "argon2-support"]
