[package]
name = "dixscript"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "DixScript - Secure data interchange format with built-in encryption"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["config", "data", "encryption", "serialization"]
categories = ["config", "encoding", "data-structures"]

[lib]
name = "dixscript"
crate-type = ["lib"]

[dependencies]
rand       = { version = "0.8", features = ["getrandom"] }
uuid       = { version = "1.0", features = ["v4", "serde", "js"] }
chrono     = { version = "0.4", features = ["serde"] }
bitflags   = "2.4"

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"

phf        = { version = "0.11", features = ["macros"] }
memchr     = "2.7"
base64     = "0.21"
regex      = "1.10"
itertools  = "0.13"
lazy_static = "1.4"
unicase    = "2.7"
rustc-hash = "2.0"

sha2 = "0.11.0-pre.4"

# DLM encryption — all pure Rust, compile everywhere including WASM
flate2           = { version = "1.0", default-features = false, features = ["rust_backend"] }
aes-gcm          = "0.10"
chacha20poly1305 = "0.10"
argon2           = "0.5"
hex              = "0.4"

# Cloud-import deps — optional
reqwest     = { version = "0.11", features = ["json"], optional = true }
tokio       = { version = "1",    features = ["full"], optional = true }
async-trait = { version = "0.1",                       optional = true }
url         = { version = "2.5",                       optional = true }

# ── Native-only deps (C libraries or OS threads — excluded from WASM) ─────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bzip2    = "0.4"
xz2      = "0.1"
rayon    = "1.8"
hostname = "0.3"

# ── WASM-only deps ─────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
tempfile   = "3.10"
bincode    = "1.3"
rmp-serde  = "1.1"
postcard   = { version = "1.0", features = ["alloc"] }
ciborium   = "0.2"
jrsonnet-evaluator = "0.4"
jrsonnet-stdlib    = "0.4"

[[bench]]
name    = "throughput_benchmark"
harness = false

[[bench]]
name    = "lexer_throughput"
harness = false

[[bench]]
name    = "config_throughput"
harness = false

[[bench]]
name    = "general_parser_benchmark"
harness = false

[[bench]]
name    = "semantics_benchmark"
harness = false

[[bench]]
name    = "ast_enhancement_benchmark"
harness = false

[[bench]]
name    = "value_resolution_benchmark"
harness = false

[[bench]]
name    = "binary_serialization_benchmark"
harness = false

[[bench]]
name    = "runtime_benchmark"
harness = false

[features]
default = []
cloud_imports     = ["reqwest", "tokio", "async-trait", "url"]
cue_cli_available = []
