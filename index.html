<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DixScript-Rust — CI Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117;
      color: #e6edf3; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 36px 40px; max-width: 480px; width: 100%; }
    h1 { font-size: 1.6rem; color: #79c0ff; margin-bottom: 6px; }
    p { color: #8b949e; font-size: 0.85rem; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    a { display: flex; align-items: center; gap: 10px; background: #1c2128;
      border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px;
      text-decoration: none; color: #e6edf3; font-size: 0.88rem;
      transition: all 0.15s; }
    a:hover { border-color: #79c0ff; color: #79c0ff; }
    a .icon { font-size: 1.2rem; }
    a .desc { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>DixScript-Rust</h1>
    <p>MidManStudio — CI Result Dashboard</p>
    <div class="links">
      <a href="tests/">
        <span class="icon">&#x2705;</span>
        <div><div>Test Results</div><div class="desc">cargo test — per-suite breakdown with output</div></div>
      </a>
      <a href="bench/">
        <span class="icon">&#x1F4CA;</span>
        <div><div>Parser Benchmarks</div><div class="desc">criterion — lexer, config, parser throughput</div></div>
      </a>
      <a href="semantics/">
        <span class="icon">&#x1F9E0;</span>
        <div><div>Semantics Benchmarks</div><div class="desc">criterion — section analyzers &amp; full pipeline</div></div>
      </a>
      <a href="flame/">
        <span class="icon">&#x1F525;</span>
        <div><div>Flamegraphs</div><div class="desc">samply — profiling for hot paths</div></div>
      </a>
    </div>
  </div>
</body>
</html>
