[package]
name = "mdix-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "Command-line interface for DixScript (.mdix) files"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords = ["cli", "config", "dixscript", "mdix"]
categories = ["command-line-utilities"]

[[bin]]
name = "mdix"
path = "src/main.rs"

[dependencies]
dixscript  = { path = "../dixscript" }

clap       = { version = "4", features = ["derive", "env"] }

serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml       = "0.8"

colored    = "2.0"
anyhow     = "1.0"
rand       = "0.8"
base64     = "0.21"
uuid       = { version = "1.0", features = ["v4"] }
dirs       = "5.0"

indicatif  = { version = "0.17", optional = true }

[features]
default  = []
progress = ["indicatif"]

[dev-dependencies]
tempfile   = "3.10"
assert_cmd = "2.0"
predicates = "3.0"
