language = "C"
include_guard = "MDIX_FFI_H"
pragma_once = true
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not edit manually. */"
tab_width = 4
documentation = true
documentation_style = "c99"

[export]
# Export the enums and all extern "C" functions
include = ["MdixType", "MdixFormatMode"]
exclude = []

[enum]
# Emit #define constants alongside the enum for C89 compat
prefix_with_name = false
rename_variants = "ScreamingSnakeCase"

[fn]
# All functions are extern "C" — no prefix needed
prefix = ""
postfix = ""

[parse]
parse_deps = false
extra_bindings = []
