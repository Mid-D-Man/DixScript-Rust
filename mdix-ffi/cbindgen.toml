language = "C"
include_guard = "MDIX_FFI_H"
pragma_once = true
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Do not edit manually. */"
tab_width = 4
documentation = true
documentation_style = "c99"

[export]
include = ["MdixType", "MdixFormatMode"]
exclude = []

[enum]
# prefix_with_name = true turns:
#   MdixType::Null   → MDIX_TYPE_NULL    (avoids collision with stdlib.h NULL macro)
#   MdixType::Bool   → MDIX_TYPE_BOOL
#   MdixFormatMode::Default → MDIX_FORMAT_MODE_DEFAULT
# This is the standard cbindgen pattern for C-safe enum variants.
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[fn]
prefix = ""
postfix = ""

[parse]
parse_deps = false
extra_bindings = []
