[package]
name = "mdix-java"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "JNI bridge for DixScript — Java and Kotlin native bindings"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"

[lib]
name = "mdix_java"
# cdylib   → libmdix_java.so / mdix_java.dll / libmdix_java.dylib
# System.loadLibrary("mdix_java") on the Java side.
crate-type = ["cdylib"]

[dependencies]
dixscript = { path = "../dixscript", version = "1.0.0" }
jni        = { version = "0.21", default-features = false }
serde_json = "1.0"

# NOTE: [profile.release] / [profile.dev] used to be duplicated here.
# Cargo only reads profiles from the workspace root (see the warning
# "profiles for the non root package will be ignored"), so the duplicate
# tables were dead weight — the workspace root Cargo.toml's profiles were
# always the ones actually applied. Removed rather than kept in sync by hand.
