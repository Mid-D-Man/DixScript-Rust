[package]
name         = "mdix-lsp"
version      = "1.0.0"
edition      = "2021"
rust-version = "1.85"
authors      = ["MidManStudio"]
description  = "Language server for DixScript (.mdix files)"
license      = "MIT"
repository   = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords     = ["lsp", "language-server", "dixscript", "mdix"]
categories   = ["development-tools"]

[lib]
name = "mdix_lsp"
path = "src/lib.rs"

[[bin]]
name = "mdix-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp          = { version = "0.20" }
# Path dependency while v2.0.0 is in progress: the LSP matches on `TokenType::SectionRaw` /
# `SectionSchema` / `RawContent` and `SectionId::Raw` / `Schema`, which the published
# crates.io 1.0.0 does not have. Keep `version` equal to ../dixscript/Cargo.toml's version
# (bump both together when dixscript goes to 2.0.0), and publish dixscript before
# publishing mdix-lsp, because a published mdix-lsp resolves this dep from crates.io.
dixscript          = { path = "../dixscript", version = "1.0.0" }
tokio              = { version = "1", features = ["full"] }
dashmap            = "6"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex              = "1.10"
base64             = "0.21"
tracing-appender   = "0.2"
which              = "6"   # moved from dev-dependencies — used in commands.rs (run_compile)

[dev-dependencies]
serde_json = "1.0"

[[test]]
name    = "lsp_integration"
path    = "tests/lsp_integration.rs"
harness = false
