[package]
name         = "mdix-lsp"
version      = "1.0.0"
edition      = "2021"
rust-version = "1.85"
authors      = ["MidManStudio"]
description  = "Language server for DixScript (.mdix files)"
license      = "MIT"
repository   = "https://github.com/Mid-D-Man/DixScript-Rust"
keywords     = ["lsp", "language-server", "dixscript", "mdix"]
categories   = ["development-tools"]

[lib]
name = "mdix_lsp"
path = "src/lib.rs"

[[bin]]
name = "mdix-lsp"
path = "src/main.rs"

[dependencies]
tower-lsp          = { version = "0.20" }
# Deliberately the published crates.io version, not `{ path = "../dixscript" }`
# — same reasoning mdix-wasm/Cargo.toml documents for itself and mdix-cli/
# Cargo.toml now uses too: this crate (both the mdix-lsp binary and the
# mdix_lsp library downstream dialect crates depend on — see src/lib.rs /
# src/extensions.rs) has no cross-crate type identity with the rest of
# this workspace to preserve, so every build here — including CI —
# exercises the same dixscript real external consumers get. Run the
# "Sync Cargo.lock" workflow (workflow_dispatch, default target
# "dixscript") once before publishing/`--locked` building off this, since
# this changed from a path+version dep and the committed Cargo.lock hasn't
# been regenerated to match yet.
dixscript          = "1.0.0"
tokio              = { version = "1", features = ["full"] }
dashmap            = "6"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex              = "1.10"
base64             = "0.21"
tracing-appender   = "0.2"
which              = "6"   # moved from dev-dependencies — used in commands.rs (run_compile)

[dev-dependencies]
serde_json = "1.0"

[[test]]
name    = "lsp_integration"
path    = "tests/lsp_integration.rs"
harness = false
