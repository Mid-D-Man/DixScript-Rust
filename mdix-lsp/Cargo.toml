[package]
name        = "mdix-lsp"
version     = "1.0.0"
edition     = "2021"
rust-version = "1.70"
authors     = ["MidManStudio"]
description = "LSP server for DixScript (.mdix files)"
license     = "MIT"

[[bin]]
name = "mdix-lsp"
path = "src/main.rs"

[dependencies]
dixscript          = { path = "../dixscript" }
tower-lsp-server   = "0.20"
tokio              = { version = "1", features = ["full"] }
dashmap            = "6"
lsp-types          = "0.97"
serde_json         = "1.0"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
