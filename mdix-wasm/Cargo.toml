[package]
name = "mdix-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "WebAssembly bindings for DixScript — browser and Node.js"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"

[lib]
# rlib alongside cdylib: cdylib alone can't be linked as a normal Rust
# dependency, which is exactly what tests/web.rs (an integration test) needs
# to do. cdylib is still what wasm-bindgen actually packages for JS/npm —
# this doesn't change that output, it just additionally makes the crate
# usable as a library for cargo's own test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Deliberately the published crates.io version, not `{ path = "../dixscript" }`
# — this crate is cdylib-only (its whole surface crosses the wasm-bindgen JS
# boundary, no raw Rust types shared with sibling workspace crates), so
# there's no type-identity risk in resolving it from the registry instead of
# the workspace member. That also means every build here — including CI —
# genuinely exercises the same dixscript real external consumers get, not
# whatever the local working tree happens to contain. `default` features
# (cloud-import, bzip2-support, xz-support, rayon-support) are unchanged —
# they come from dixscript's own [features].default, not from anything
# workspace-local, so this doesn't need an explicit `features = [...]` list.
dixscript                 = "1.0.0"
serde_json                = "1.0"
wasm-bindgen              = "0.2"
js-sys                    = "0.3"
chrono     = { version = "0.4", features = ["serde"] }
# Always enabled — gives the exact Rust file + line in the browser
# console instead of the opaque "unreachable executed" WASM trap.
console_error_panic_hook  = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
