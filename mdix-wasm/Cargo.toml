[package]
name = "mdix-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "WebAssembly bindings for DixScript — browser and Node.js"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"

[lib]
# rlib alongside cdylib: cdylib alone can't be linked as a normal Rust
# dependency, which is exactly what tests/web.rs (an integration test) needs
# to do. cdylib is still what wasm-bindgen actually packages for JS/npm —
# this doesn't change that output, it just additionally makes the crate
# usable as a library for cargo's own test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
dixscript                 = { path = "../dixscript" }
serde_json                = "1.0"
wasm-bindgen              = "0.2"
js-sys                    = "0.3"
chrono     = { version = "0.4", features = ["serde"] }
# Always enabled — gives the exact Rust file + line in the browser
# console instead of the opaque "unreachable executed" WASM trap.
console_error_panic_hook  = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
