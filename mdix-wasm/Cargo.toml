[package]
name = "mdix-wasm"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["MidManStudio"]
description = "WebAssembly bindings for DixScript — browser and Node.js"
license = "MIT"
repository = "https://github.com/Mid-D-Man/DixScript-Rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
dixscript  = { path = "../dixscript" }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = []

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
