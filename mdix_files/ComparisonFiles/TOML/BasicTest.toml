[GameBotConfigs]
botName = "TestBot"
version = "1.0.0"
enabled = true

[GameBotConfigs.settings]
maxRetries = 3
timeout = 5000
endpoints = [
    "https://api.example.com/v1",
    "https://api.example.com/v2"
]

[[GameBotConfigs.roles]]
name = "admin"
permissions = ["read", "write", "delete"]

[[GameBotConfigs.roles]]
name = "user"
permissions = ["read"]
